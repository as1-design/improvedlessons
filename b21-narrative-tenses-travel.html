/* ================= tokens ================= */
:root{
  --paper:#F7F5F0; --card:#FFFDF9; --ink:#1D2440; --ink-soft:#565D78; --rule:#E2DCCF; --shade:#EFEBE2;
  /* line colours: identify the six activities */
  --l-story:#E63946; --l-first:#F28C28; --l-gap:#2BB673; --l-done:#FFB703; --l-such:#0FA3B1; --l-tale:#D6458F;
  /* reserved meaning colours: only used for the two time tracks */
  --now:#1F5FC8;     /* story time: past simple, past continuous */
  --before:#7B3A9C;  /* earlier past: past perfect simple, past perfect continuous */
  /* feedback (always with ✓ / ✗) */
  --ok:#1A8F52; --ok-bg:#E3F5EA; --no:#C8203A; --no-bg:#FBE5E8;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'Overpass','Segoe UI',Verdana,sans-serif;
  --mono:'Overpass Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-s:10px; --r-m:16px; --r-l:26px; --pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:16px; --sp-4:24px; --sp-5:40px; --sp-6:64px;
  --shadow:0 1px 0 rgba(29,36,64,.06),0 6px 18px -8px rgba(29,36,64,.22);
  --shadow-lift:0 2px 0 rgba(29,36,64,.08),0 14px 30px -12px rgba(29,36,64,.35);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.25,.46,.45,.94);
}
/* ================= base ================= */
*{box-sizing:border-box}
html{touch-action:manipulation;font-size:clamp(16px,calc(12.5px + .48vw),23px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
button{font:inherit;color:inherit;min-height:44px;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{cursor:default}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-3) var(--sp-3) var(--sp-5)}
@media (min-width:1600px){.wrap{max-width:1500px}}
.label{font:600 max(12px,.8rem)/1.25 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* decorative layer: big faint metro curves behind everything */
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.deco svg{position:absolute;width:140vmax;height:140vmax;right:-45vmax;top:-50vmax;opacity:.1}
.deco svg.b{left:-60vmax;right:auto;top:auto;bottom:-75vmax;opacity:.08;transform:rotate(180deg)}

/* ================= shared pieces ================= */
.roundel{--c:var(--ink);display:inline-grid;place-items:center;flex:none;width:2.4em;height:2.4em;border-radius:50%;
  background:#fff;border:.32em solid var(--c);font:800 1em/1 var(--display);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.6em 1.2em;border-radius:var(--pill);
  background:var(--ink);color:#fff;font-weight:700;box-shadow:var(--shadow);transition:transform .2s var(--spring),box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--rule);box-shadow:none}
.btn.small{padding:.4em .9em;font-size:.88rem}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:var(--pill);background:rgba(255,255,255,.12);color:#fff;font-size:1.05rem;padding:0 .7em;gap:.3em;font-weight:700}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.25em .7em;border-radius:var(--pill);background:var(--shade);font-size:.85rem}
.ukus{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.4em;font-size:.85rem;color:var(--ink-soft);margin-top:var(--sp-2)}
.ukus b{font:600 max(12px,.75rem)/1 var(--mono);letter-spacing:.08em;background:var(--ink);color:#fff;padding:.35em .5em;border-radius:6px}

/* ================= setup ================= */
.setup{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:var(--sp-4) var(--sp-3)}
.setup-card{max-width:760px;width:100%;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:.5em;margin-bottom:var(--sp-3)}
.brand .roundel{--c:var(--l-story);font-size:1.4rem}
.big-title{font-size:clamp(3rem,10vw,6.2rem);line-height:.9}
.big-title span{display:inline-block;animation:rise .7s var(--spring) both}
.big-title span:nth-child(2){animation-delay:.08s;color:var(--l-story)}
.sub{margin:var(--sp-3) auto var(--sp-4);max-width:34em;color:var(--ink-soft);font-size:1.05rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--sp-3);text-align:left}
.mode{background:var(--card);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--shadow);border:2px solid var(--rule)}
.mode h2{font-size:1.5rem;margin-bottom:.3em}
.mode p{color:var(--ink-soft);margin-bottom:var(--sp-3);font-size:.95rem}
.mode .row{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

/* ================= hub ================= */
.hub-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-2) 0 var(--sp-4)}
.hub-head h1{font-size:clamp(2.4rem,6vw,4.2rem)}
.hub-head h1 em{font-style:normal;color:var(--l-story)}
.hub-tools{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.hub-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
@media (min-width:980px){.hub-grid{grid-template-columns:1.1fr 1fr;align-items:start}}
.mapbox{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);padding:var(--sp-3);position:relative;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .label{display:block;margin-bottom:var(--sp-1)}
.map-line{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.map-stop{fill:#fff;stroke-width:4}
.map-stop.on{fill:var(--ink)}
.map-name{font:700 15px var(--body);fill:var(--ink)}
.map-hub-text{font:800 13px var(--display);fill:#fff;letter-spacing:.02em}
.lines{display:grid;gap:var(--sp-2)}
.linecard{--c:var(--ink);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  background:var(--card);border-radius:var(--r-m);padding:var(--sp-3);box-shadow:var(--shadow);border-left:10px solid var(--c);
  transition:transform .25s var(--spring),box-shadow .25s;animation:slidein .5s var(--ease) both}
.linecard:hover{transform:translateX(4px);box-shadow:var(--shadow-lift)}
.linecard .roundel{--c:inherit;border-color:var(--c);font-size:1.05rem}
.linecard .lc-name{display:block;font:800 1.2rem/1.1 var(--display);letter-spacing:-.02em}
.linecard .lc-desc{display:block}
.linecard .lc-desc{font-size:.88rem;color:var(--ink-soft);margin-top:.15em}
.minidots{display:flex;flex-wrap:wrap;gap:3px;margin-top:.45em}
.minidots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);background:#fff}
.minidots i.on{background:var(--c)}
.status{font:600 .75rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.status.done{color:var(--ok)}
.hub-foot{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;justify-content:space-between;margin-top:var(--sp-4)}
.scoreboard{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

/* team chips */
.team{display:inline-flex;align-items:center;gap:.4em;padding:.35em .8em;border-radius:var(--pill);background:var(--card);border:2px solid var(--rule);font-weight:700;font-size:.9rem}
.team .pts{font:600 .9rem var(--mono)}
.team.turn{border-color:var(--ink);background:var(--ink);color:#fff;transform:translateY(-2px);box-shadow:var(--shadow)}
.team.turn::after{content:'▶ turn';font:600 max(12px,.7rem) var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* ================= line screen ================= */
.sign{--c:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2) var(--sp-3);background:var(--ink);color:#fff;border-radius:var(--r-m);
  padding:var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);box-shadow:var(--shadow);border-bottom:8px solid var(--c)}
.sign .roundel{--c:inherit;border-color:var(--c);font-size:.95rem}
.sign h1{font-size:clamp(1.25rem,2.6vw,1.9rem);flex:1 1 12em}
.sign .tools{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
.track{position:relative;margin:var(--sp-4) .9rem var(--sp-3);height:34px}
.track .rail{position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:8px;background:var(--rule)}
.track .rail b{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--c);transition:width .6s var(--ease)}
.track .stop{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--rule)}
.track .stop.on{border-color:var(--c);background:var(--c)}
.track .stop.miss{border-color:var(--c);background:#fff}
.track .veh{position:absolute;top:50%;font-size:1.7rem;line-height:1;transform:translate(-50%,-62%);transition:left .7s var(--spring);filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.track .veh.flip{transform:translate(-50%,-62%) scaleX(-1)}
.teams-row{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.stage{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);padding:clamp(16px,3vw,40px);position:relative}
.stage.enter{animation:pop .45s var(--spring) both}
.instr{display:flex;align-items:flex-start;gap:.5em;font-weight:700;color:var(--ink-soft);margin-bottom:var(--sp-3);font-size:.95rem}
.instr .n{font:600 max(12px,.85rem) var(--mono);background:var(--shade);border-radius:6px;padding:.3em .5em;color:var(--ink);white-space:nowrap}
.prompt{font-size:clamp(1.15rem,1rem + .9vw,1.7rem);line-height:1.45;margin-bottom:var(--sp-4)}
.prompt .q{display:block;margin-top:var(--sp-2);font-weight:700}
.prompt .pair{display:grid;gap:.25em}
.storyhead{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);font-size:1rem}
.storyhead .em{font-size:1.8rem}
.storyhead h2{font-size:1.3rem}
.gap{display:inline-block;min-width:4.5em;padding:0 .35em;border-bottom:3px solid var(--ink);text-align:center;font-weight:700;line-height:1.25}
.gap.now{background:#FFF3C4;border-radius:6px 6px 0 0;animation:blink 1.6s ease-in-out infinite}
.gap.later{color:var(--ink-soft);border-bottom-style:dotted;font:600 .8em var(--mono)}
.gap.fill{border-bottom-color:var(--ok);color:var(--ok);animation:none;background:var(--ok-bg)}
.gap.prev{border-bottom-color:var(--rule);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13em),1fr));gap:var(--sp-2)}
.opts.long{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:.7em;text-align:left;padding:.75em 1em;min-height:3.2em;border-radius:var(--r-m);
  background:#fff;border:3px solid var(--rule);font-weight:700;font-size:clamp(1rem,.95rem + .35vw,1.25rem);line-height:1.3;
  transition:transform .2s var(--spring),border-color .2s,background .2s;box-shadow:0 3px 0 var(--rule)}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--rule)}
.opt .k{font:600 max(12px,.75rem) var(--mono);color:var(--ink-soft);border:2px solid var(--rule);border-radius:6px;padding:.15em .4em;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok);animation:bump .45s var(--spring)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:#7d1b29;box-shadow:none;animation:shake .4s}
.opt.right::after{content:'✓';margin-left:auto;font-size:1.3em;color:var(--ok)}
.opt.wrong::after{content:'✗';margin-left:auto;font-size:1.2em;color:var(--no)}
.opt.dim{opacity:.45}
.fb{margin-top:var(--sp-3);border-radius:var(--r-m);padding:var(--sp-3);animation:pop .4s var(--spring) both}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--no-bg)} .fb.try{background:#FFF3C4}
.fb h2,.fb h3,.fb h4{margin:0 0 .25em;font:800 1.15rem var(--display)}
.fb p{font-size:.98rem}
.fb .nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-3)}
.firsttl{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;margin:.6em 0 .2em;font-weight:700}
.firsttl span{background:#fff;border-radius:var(--pill);padding:.25em .8em;border:2px solid var(--rule)}
.firsttl span b{font:600 .8em var(--mono);margin-right:.4em}

/* ================= story line ================= */
.story-grid{display:grid;gap:var(--sp-3)}
@media (min-width:900px){.story-grid{grid-template-columns:1.25fr 1fr;align-items:start}}
.storytext h2{font-size:1.6rem;margin-bottom:var(--sp-2)}
.storytext p{font-size:clamp(1.05rem,.95rem + .5vw,1.35rem);line-height:1.75;margin-bottom:var(--sp-3)}
.vb{min-height:40px;display:inline;padding:.05em .3em;margin:0 .05em;border-radius:6px;background:#FFF3C4;font-weight:700;
  border-bottom:3px solid #E8B400;line-height:1.9;transition:background .2s}
.vb:hover{background:#FFE68A}
.vb.found{background:transparent;border-bottom-width:4px}
.vb.found.t-now{border-bottom-color:var(--now);color:var(--now)}
.vb.found.t-before{border-bottom-color:var(--before);color:var(--before)}
.vb.found.cont{border-bottom-style:dashed}
.vb.found::after{content:attr(data-tag);font:600 .6em var(--mono);vertical-align:super;margin-left:.2em}
.storynote{font-size:.9rem;color:var(--ink-soft)}
.tlbox{background:var(--paper);border-radius:var(--r-m);padding:var(--sp-3)}
.tlhead,.tlrow{display:grid;grid-template-columns:3.6rem 3.6rem 1fr;align-items:center}
.tlhead{font:600 max(12px,.72rem)/1.15 var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--sp-1)}
.tlhead span:nth-child(1){color:var(--now)} .tlhead span:nth-child(2){color:var(--before)}
.tlrow{min-height:2.3rem;position:relative}
.tlcell{position:relative;height:100%;min-height:2.3rem;display:grid;place-items:center}
.tlcell::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;opacity:.28}
.tlcell.now::before{background:var(--now)} .tlcell.before::before{background:var(--before)}
.mk{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid currentColor}
.mk.cont{height:2.1rem;border-radius:12px}
.tlcell.now .mk{color:var(--now)} .tlcell.before .mk{color:var(--before)}
.mk.q{color:#B9B2A3!important;border-style:dashed}
.tllab{font-size:.92rem;padding-left:.4em}
.tllab b{font-weight:700}
.tllab small{display:block;font:600 max(12px,.75rem) var(--mono);color:var(--ink-soft);letter-spacing:.03em}
.tllab .q{color:var(--ink-soft);font:600 .8rem var(--mono)}
.tlrow.new .mk{animation:bump .6s var(--spring)}
.tlkey{display:flex;flex-wrap:wrap;gap:.3em 1em;font-size:.8rem;color:var(--ink-soft);margin-top:var(--sp-2)}
.tlkey span{display:inline-flex;align-items:center;gap:.35em}
.tlkey i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink-soft)}
.tlkey i.c{height:20px;border-radius:8px}

/* picker sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(29,36,64,.45);padding:var(--sp-3)}
.sheet.enter{animation:fade .25s both}
.sheet.enter .sheet-card{animation:up .4s var(--spring) both}
@media (min-width:700px){.sheet{place-items:center}}
.sheet-card{width:min(100%,640px);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--shadow-lift)}
.sheet-card h3{font-size:1.6rem;margin:.2em 0 var(--sp-3)}
.sheet-card h3 mark{background:#FFF3C4;padding:0 .2em;border-radius:6px}

/* grammar central */
.gram .sheet-card{width:min(100%,920px)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:var(--sp-2);margin-top:var(--sp-3)}
.gcard{border-radius:var(--r-m);padding:var(--sp-3);background:#fff;border:2px solid var(--rule);border-top:8px solid var(--gc,var(--ink))}
.gcard h4{margin:0 0 .3em;font:800 1.1rem var(--display)}
.gcard p{font-size:.92rem;margin-bottom:.4em}
.gcard .ex{font-style:italic;color:var(--ink-soft)}
.gcard ul{margin:.2em 0 .4em;padding-left:1.1em;font-size:.92rem}

/* tale line */
.tale{display:grid;gap:var(--sp-3)}
@media (min-width:900px){.tale{grid-template-columns:1.2fr 1fr;align-items:start}}
.talecard{background:var(--ink);color:#fff;border-radius:var(--r-l);padding:clamp(20px,3vw,40px);position:relative;overflow:hidden;min-height:14rem;animation:flipin .6s var(--spring) both}
.talecard::before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid var(--l-tale);opacity:.5}
.talecard .em{font-size:3rem;line-height:1}
.talecard h2{font-size:clamp(1.6rem,3vw,2.4rem);margin:.3em 0 .4em;position:relative}
.talecard p{font-size:clamp(1.1rem,1rem + .5vw,1.45rem);line-height:1.5;position:relative}
.talecard .ukus{color:#C9CDE0}
.talecard .ukus b{background:#fff;color:var(--ink)}
.targets{display:grid;gap:var(--sp-2)}
.target{display:flex;align-items:center;gap:.7em;text-align:left;padding:.6em .9em;border-radius:var(--r-m);background:#fff;border:3px solid var(--rule);width:100%}
.target .box{flex:none;width:1.6em;height:1.6em;border-radius:8px;border:3px solid var(--rule);display:grid;place-items:center;font-weight:800}
.target small{display:block;color:var(--ink-soft);font-style:italic;font-size:.82rem}
.target.on{border-color:var(--l-tale);background:#FCEAF3}
.target.on .box{background:var(--l-tale);border-color:var(--l-tale);color:#fff}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.timer .t{font:600 1.6rem var(--mono);min-width:4.2ch}
.timer .t.warn{color:var(--no)}

/* ticket */
.ticketwrap{display:grid;place-items:center;padding:var(--sp-4) 0}
.slot{width:min(100%,560px);height:16px;border-radius:10px;background:var(--ink);box-shadow:inset 0 4px 6px rgba(0,0,0,.5)}
.ticket{--c:var(--ink);width:min(calc(100% - 24px),520px);margin-top:-6px;background:#FFFBEA;border-radius:0 0 var(--r-m) var(--r-m);box-shadow:var(--shadow-lift);
  position:relative;padding:var(--sp-4);font-family:var(--mono);animation:print 1.4s var(--ease) both;transform-origin:top;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(29,36,64,.05) 23px 24px)}
.ticket::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:var(--c)}
.ticket .row:first-of-type{padding-right:48px}
.ticket .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5em;border-bottom:2px dashed #D8CFAF;padding:.6em 0;font-size:.9rem}
.ticket .row:last-of-type{border-bottom:0}
.ticket h2{font-family:var(--display);font-size:clamp(1.6rem,4vw,2.3rem);margin:.4em 0 .2em}
.ticket .from{font-weight:600;font-size:1rem}
.ticket .stat{font:800 clamp(2.4rem,7vw,3.6rem)/1 var(--display);color:var(--ink)}
.ticket .punch{position:absolute;right:22px;top:26px;width:30px;height:30px;border-radius:50%;background:var(--paper);box-shadow:inset 0 2px 4px rgba(0,0,0,.25);transform:scale(0);animation:punch .35s var(--spring) 1.5s forwards}
.ticket .tip{font-family:var(--body);font-size:.95rem;line-height:1.45;background:#fff;border-radius:var(--r-s);padding:.7em .9em;margin-top:.6em}
.review{width:min(100%,720px);margin-top:var(--sp-4)}
.review h3{font-size:1.3rem;margin-bottom:var(--sp-2)}
.review li{margin-bottom:.5em;font-size:.95rem}
.review li b{color:var(--ok)}
.after{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-4)}

/* confetti */
.conf{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 1.6s var(--ease) forwards}

/* banner */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--sp-2);background:#FFF3C4;border-radius:var(--r-m);padding:.6em 1em;margin-bottom:var(--sp-3);font-size:.95rem}


/* ================= v1.1: tense panel, fixed action bar, Lost Property ================= */
:root{ --l-lost:#7A6A58; }
.vb{scroll-margin:90px 0 45vh}
.vb.sel{background:#FFE07A;outline:3px solid var(--ink);outline-offset:2px;animation:selpulse 1.6s ease-in-out infinite}
@keyframes selpulse{0%,100%{outline-color:var(--ink)}50%{outline-color:rgba(29,36,64,.35)}}
.side{display:grid;gap:var(--sp-3);align-content:start}
.dock{background:var(--card);border:3px solid var(--ink);border-radius:var(--r-m);padding:var(--sp-3);box-shadow:var(--shadow-lift);position:sticky;top:12px;z-index:5}
.dock-q{font:800 clamp(1.15rem,1rem + .6vw,1.5rem)/1.2 var(--display);margin:.2em 0 .6em}
.dock-q mark,.vmark{background:#FFE07A;padding:0 .25em;border-radius:6px;color:var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;grid-auto-flow:column;gap:6px 10px}
.th{font:600 max(12px,.72rem)/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:0 .2em}
.th.now{color:var(--now)} .th.before{color:var(--before)}
.tbtn{display:flex;align-items:center;gap:.5em;text-align:left;min-height:52px;padding:.5em .7em;border-radius:var(--r-s);background:#fff;border:3px solid var(--rule);
  font-weight:700;font-size:clamp(.95rem,.9rem + .25vw,1.15rem);line-height:1.2;box-shadow:0 3px 0 var(--rule);transition:transform .15s var(--spring),border-color .15s}
.tbtn:hover:not(:disabled){transform:translateY(-2px)} .tbtn.t-now:hover:not(:disabled){border-color:var(--now)} .tbtn.t-before:hover:not(:disabled){border-color:var(--before)}
.tbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--rule)}
.tbtn .k{font:600 max(12px,.75rem) var(--mono);color:var(--ink-soft);border:2px solid var(--rule);border-radius:6px;padding:.1em .4em;flex:none}
.tbtn .mk{flex:none;width:16px;height:16px;border-width:3px} .tbtn .mk.cont{height:26px;border-radius:9px}
.tbtn.t-now .mk{color:var(--now)} .tbtn.t-before .mk{color:var(--before)}
.tbtn.wrong{border-color:var(--no);background:var(--no-bg);color:#7d1b29;box-shadow:none} .tbtn.wrong .tn::after{content:' ✗'}
.tbtn.right{border-color:var(--ok);background:var(--ok-bg)} .tbtn.right .tn::after{content:' ✓';color:var(--ok)}
.tbtn.dim{opacity:.45}
.dock-fb{margin-top:var(--sp-2);font-size:.92rem;line-height:1.4;border-radius:var(--r-s);padding:.5em .7em}
.dock-fb.ok{background:var(--ok-bg)} .dock-fb.no{background:var(--no-bg)} .dock-fb.try{background:#FFF3C4;font-weight:700} .dock-fb.muted{color:var(--ink-soft);padding-left:0}
.dock-fb .why{display:block;color:var(--ink-soft)}
.tlist{position:relative;list-style:none;margin:0;padding:0}
.tlbox.reveal .tlrow{animation:pop .5s var(--spring) both;animation-delay:var(--d)}
.tltrain{position:absolute;left:calc(3.6rem - .75em);top:-12px;font-size:1.5rem;line-height:1;animation:ride 2.4s ease-in-out .2s both;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
@keyframes ride{from{top:-12px}to{top:calc(100% - 26px)}}
.story-grid.rules{margin-bottom:16px}
@media (max-width:899px){
  .story-tap .dock{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:20px 20px 0 0;border-width:3px 0 0;max-height:62vh;overflow:auto;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .story-tap:not(.all) .tlbox{display:none}
  .story-tap .dock .dock-fb:not(.peek) .why{display:none}
}
@media (max-width:899px) and (max-height:520px){
  .story-tap .dock{padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
  .story-tap .dock .label,.story-tap .dock .th{display:none}
  .story-tap .dock .dock-q{font-size:1.05rem;margin:0 0 6px}
  .story-tap .dock .tgrid{grid-template-columns:repeat(4,1fr);grid-auto-flow:row;grid-template-rows:auto}
  .story-tap .dock .tbtn{min-height:44px;padding:.35em .5em;font-size:.9rem}
  .story-tap .dock .dock-fb{margin-top:6px;padding:.3em .6em}
}
.actionbar{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:40;animation:up .35s var(--spring) both}
.btn.big{padding:.8em 1.6em;font-size:1.1rem;box-shadow:var(--shadow-lift)}
@media (max-width:699px){
  .actionbar{left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(247,245,240,.94);backdrop-filter:blur(6px);border-top:1px solid var(--rule)}
  .actionbar .btn{width:100%}
}
.cando{margin-top:.5em;font-weight:700;color:var(--ink-soft);font-size:1rem}
.status.here{color:var(--ink);background:#FFE07A;padding:.35em .6em;border-radius:var(--pill)}
.linecard.starthere{box-shadow:0 0 0 4px #FFE07A,var(--shadow-lift)}
.lostcard{margin-top:var(--sp-3);background:var(--card);border-radius:var(--r-l);padding:var(--sp-3);box-shadow:var(--shadow);border:3px dashed var(--c)}
.lost-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.lost-head .roundel{--c:var(--l-lost);font-size:1.05rem;border-color:var(--c)}
.lostcard .lc-name{display:block;font:800 1.2rem/1.1 var(--display)} .lostcard .lc-desc{display:block;font-size:.88rem;color:var(--ink-soft);margin-top:.15em}

/* ================= state ================= */
const C = CONTENT;
const KEY = 'pastlines.v1', PKEY = 'pastlines.prefs';
const TKEYS = Object.keys(C.TENSES);  // fixed order: ps, pc, pp, ppc
let S = null;                         // saved game state
let prefs = { sound:true };           // saved separately, survives "Start again"
let UI = { sel:null, tries:{}, fb:null, view:null, lview:null, solvedAt:0, gram:false, lastNew:null, reveal:false, confirmReset:false, timer:null, timerMode:'plan', setup:false, enter:'', animKey:'' }; // not saved

const LINE = id => C.LINES.find(l => l.id === id);
function freshLine(){ return { i:0, res:[], tries:0, wrong:[], picks:[], vpicks:{}, solved:false, done:false, found:{}, phase:'tap', deck:null, k:0, told:0, ticks:[], left:null }; }
function newGame(mode, n){
  S = { v:1, mode:'solo', teams:[], turn:0, view:'hub', line:null, lines:{}, lost:{}, lp:null };
  C.LINES.forEach(l => S.lines[l.id] = freshLine());
  setMode(mode, n);
}
/* Change mode at any time. Progress on the lines is kept; team scores start again. */
function setMode(mode, n){
  S.mode = mode;
  S.teams = mode === 'teams' ? C.TEAMS.slice(0, n).map(t => ({ name:t.name, icon:t.icon, score:0 })) : [];
  S.turn = 0; UI.setup = false; S.view = 'hub'; S.line = null;
  save();
}

/* ================= logic ================= */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const verbIds = () => Object.keys(C.STORY.verbs);
const READ_ORDER = C.STORY.paras.join(' ').match(/\{v:\w+\}/g).map(m => m.slice(3, -1));

/* Steps of the multiple-choice lines, built from CONTENT. */
const STEPS = {};
function steps(id){
  if (STEPS[id]) return STEPS[id];
  let out = [];
  if (id === 'story') out = C.STORY.rules.map(r => ({ instr:C.UI.rulesInstr, prompt:() => `<p>${fmt(r.q)}</p>`, o:r.o, a:r.a, why:r.why, long:true, review:plain(r.q) + ' → ' + r.o[r.a] }));
  if (id === 'first') out = C.FIRST.map(x => ({ instr:C.UI.firstInstr, prompt:() => `<p>${fmt(x.s)}</p>`, o:x.ev, a:x.first, why:x.why, note:x.note, long:true,
      order:[x.ev[x.first], x.ev[1 - x.first]], review:plain(x.s) + ' → First: ' + x.ev[x.first] }));
  if (id === 'gap') C.GAP.forEach((st, si) => st.gaps.forEach((g, gi) => out.push({
      instr:C.UI.gapInstr, story:si, gapNo:gi + 1, prompt:solved => gapStory(si, gi, solved),
      short:solved => `<div class="storyhead"><span class="em" aria-hidden="true">${st.em}</span><h2>${esc(st.title)}</h2></div><p>${fmtGap(gapSentence(si, gi), solved ? g.o[g.a] : null)}</p>${st.note ? ukus(st.note) : ''}`,
      o:g.o, a:g.a, why:g.why, review:gapSentence(si, gi) + ' → ' + g.o[g.a] })));
  if (id === 'done') out = C.DONE.map(x => x.kind === 'meaning'
      ? { instr:C.UI.meaningInstr, prompt:() => `<p>${fmt(x.s)}</p><span class="q">${fmt(x.q)}</span>`, o:x.o, a:x.a, why:x.why, review:plain(x.s) + ' ' + x.q + ' → ' + x.o[x.a] }
      : { instr:C.UI.formInstr, prompt:solved => `<p>${fmtGap(x.s, solved ? x.o[x.a] : null)}</p>`, o:x.o, a:x.a, why:x.why, review:plain(x.s).replace('___', x.o[x.a]) });
  if (id === 'such'){
    out = C.SUCH_A.map(x => ({ instr:C.UI.suchAInstr, prompt:solved => `<p>${fmtGap(x.s, solved ? x.o[x.a] : null)}</p>`, o:x.o, a:x.a, why:x.why, note:x.note, review:x.s.replace('___', x.o[x.a]) }));
    out = out.concat(C.SUCH_B.map(x => ({ instr:C.UI.suchBInstr, prompt:() => `<div class="pair"><p>${fmt(x.s[0])}</p><p>${fmt(x.s[1])}</p></div>`, o:x.o, a:x.a, why:x.why, long:true, review:x.o[x.a] })));
  }
  return STEPS[id] = out;
}
function total(id){
  if (id === 'story') return verbIds().length + C.STORY.rules.length;
  if (id === 'tale') return C.TALE.goal;
  return steps(id).length;
}
const answered = arr => arr.filter(r => r !== undefined && r !== null).length;
function doneCount(id){
  const L = S.lines[id];
  if (id === 'tale') return Math.min(L.told, C.TALE.goal);
  if (id === 'story') return Object.keys(L.found).length + answered(L.res);
  return answered(L.res);
}
/* Result of one item: 2 = first try, 1 = second try, 0 = answer shown. */
function award(r){ if (S.mode === 'teams' && r > 0) S.teams[S.turn].score += r; }
function nextTurn(){ if (S.mode === 'teams') S.turn = (S.turn + 1) % S.teams.length; }
function markLost(k){ S.lost[k] = 'open'; }
const lostOpen = () => Object.keys(S.lost).filter(k => S.lost[k] === 'open' && lostItemOK(k));

/* Multiple-choice lines */
function answer(idx){
  const L = S.lines[S.line], st = steps(S.line)[L.i];
  if (UI.view !== null) return;
  if (!st || L.solved || L.wrong.includes(idx) || idx < 0 || idx >= st.o.length) return;
  if (idx === st.a){
    const r = L.tries === 0 ? 2 : 1;
    L.res[L.i] = r; L.solved = true; L.lastOk = true; award(r); sfx.good();
    if (r < 2) markLost(S.line + ':' + L.i);
  } else {
    L.wrong.push(idx); L.tries++; sfx.bad();
    if (st.o.length <= 2 || L.tries >= 2){ L.res[L.i] = 0; L.solved = true; L.lastOk = false; markLost(S.line + ':' + L.i); }
  }
  if (L.solved){ L.picks[L.i] = L.wrong.slice(); UI.solvedAt = Date.now(); }
  save(); render();
}
/* A short pause after each answer, so a fast Enter or double tap never skips the feedback. */
const tooSoon = (ms = 350) => Date.now() - (UI.solvedAt || 0) < ms;
function next(){
  const L = S.lines[S.line];
  if (!L.solved || tooSoon()) return;
  L.i++; L.tries = 0; L.wrong = []; L.solved = false; nextTurn();
  if (L.i >= steps(S.line).length) finishLine();
  save(); render(); scrollTo(0, 0);
}
/* Moving back and forth between answered questions (read-only review). UI.view = index being reviewed, null = live question. */
function prevItem(){
  if (S.view === 'lost') return lostPrev();
  const L = S.lines[S.line], cur = UI.view ?? L.i;
  const min = S.line === 'story' && L.phase === 'rules' ? -1 : 0;
  if (cur - 1 < min) return;
  UI.view = cur - 1; UI.fb = null; sfx.tap(); render(); scrollTo(0, 0);
}
function nextItem(){
  if (S.view === 'lost') return lostFwd();
  const L = S.lines[S.line];
  if (UI.view === null) return next();
  const t = UI.view + 1;
  if (t >= L.i){ UI.view = null; if (L.done){ S.view = 'ticket'; save(); } }
  else UI.view = t;
  UI.fb = null; sfx.tap(); render(); scrollTo(0, 0);
}
function reviewLine(){
  S.view = 'line'; UI.view = S.line === 'story' ? -1 : 0; UI.fb = null; render(); scrollTo(0, 0);
}
function finishLine(){
  S.lines[S.line].done = true; S.view = 'ticket'; sfx.chime(); setTimeout(celebrate, 900);
}

/* Story line: the selected verb + the fixed tense panel. */
function nextUnfound(after){
  const f = S.lines.story.found, i0 = after ? READ_ORDER.indexOf(after) : -1;
  return READ_ORDER.slice(i0 + 1).concat(READ_ORDER.slice(0, i0 + 1)).find(id => f[id] === undefined) || null;
}
function selVerb(id){
  if (!C.STORY.verbs[id] || S.lines.story.found[id] !== undefined) return;
  UI.sel = id; UI.fb = null; sfx.tap(); render(); showSel();
}
function pickTense(t){
  const L = S.lines.story, id = UI.sel;
  if (!id || L.found[id] !== undefined || !C.TENSES[t]) return;
  const v = C.STORY.verbs[id], P = UI.tries[id] = UI.tries[id] || { n:0, wrong:[] };
  if (P.wrong.includes(t)) return;
  if (t === v.tense) return finishVerb(id, P.n === 0 ? 2 : 1, true);
  P.wrong.push(t); P.n++; sfx.bad();
  if (P.n >= 2) return finishVerb(id, 0, false);
  UI.fb = { kind:'try' }; render();
}
function finishVerb(id, r, ok){
  const L = S.lines.story, v = C.STORY.verbs[id], P = UI.tries[id] || { wrong:[] };
  const team = S.mode === 'teams' ? S.teams[S.turn] : null;
  L.found[id] = r; L.vpicks[id] = P.wrong.slice(); award(r); if (r < 2) markLost('v:' + id);
  ok ? sfx.good() : null;
  UI.fb = { kind:ok ? 'ok' : 'no', id, r, wrong:P.wrong.slice(), team:team ? team.icon : '' };
  UI.lastNew = id; nextTurn();
  UI.sel = nextUnfound(id);
  if (!UI.sel){ UI.reveal = true; sfx.chime(); }
  save(); render();
  if (UI.sel) showSel(); else showTimeline();
}
/* Tap a verb that is already on the timeline to see your answer and the explanation again. */
function peekVerb(id){
  const L = S.lines.story; if (L.found[id] === undefined) return;
  const r = L.found[id];
  UI.fb = { kind:r > 0 ? 'ok' : 'no', id, r, wrong:(L.vpicks || {})[id] || [], peek:true };
  sfx.tap(); render();
  const box = document.querySelector('.dock-fb.peek'); if (box && box.getBoundingClientRect().top < 0) box.scrollIntoView({ block:'nearest' });
}
function startRules(){ const L = S.lines.story; L.phase = 'rules'; L.i = 0; L.res = []; L.picks = []; L.tries = 0; L.wrong = []; L.solved = false; UI.reveal = false; UI.view = null; UI.fb = null; save(); render(); scrollTo(0, 0); }

/* Tale line */
function taleCard(){
  const L = S.lines.tale;
  if (!L.deck) { L.deck = shuffle([...C.TALE.cards.keys()]); L.k = 0; }
  return C.TALE.cards[L.deck[L.k % L.deck.length]];
}
function toggleTick(i){ const L = S.lines.tale; L.ticks = L.ticks.includes(i) ? L.ticks.filter(x => x !== i) : [...L.ticks, i]; sfx.tap(); save(); render(); }
function taleDone(){
  const L = S.lines.tale;
  if (S.mode === 'teams') S.teams[S.turn].score += L.ticks.length;
  if (L.ticks.length) sfx.good();
  L.told++; L.k++; L.ticks = []; stopTimer(); L.left = null; UI.timerMode = 'plan'; nextTurn();
  if (L.told === C.TALE.goal){ L.done = true; S.view = 'ticket'; sfx.chime(); setTimeout(celebrate, 900); }
  save(); render(); scrollTo(0, 0);
}
function skipTale(){ const L = S.lines.tale; L.k++; L.ticks = []; stopTimer(); L.left = null; UI.timerMode = 'plan'; save(); render(); }

/* Timer for the tale line: one minute to plan, two minutes to tell. */
const timerSecs = m => m === 'plan' ? C.TALE.planSeconds : C.TALE.seconds;
function startTimer(mode){
  const L = S.lines.tale;
  if (UI.timer && UI.timerMode === mode){ stopTimer(); render(); return; }
  stopTimer();
  if (UI.timerMode !== mode || L.left === null || L.left <= 0){ UI.timerMode = mode; L.left = timerSecs(mode); }
  UI.timer = setInterval(() => {
    L.left--; drawTimer();
    if (L.left === 10) sfx.tap();
    if (L.left <= 0){ stopTimer(); sfx.chime(); render(); }
  }, 1000);
  render();
}
function stopTimer(){ clearInterval(UI.timer); UI.timer = null; }
function resetTimer(){ stopTimer(); S.lines.tale.left = null; UI.timerMode = 'plan'; render(); }

/* Lost Property */
function lostItemOK(k){
  if (k.startsWith('v:')) return !!C.STORY.verbs[k.slice(2)];
  const [line, i] = k.split(':');

}
function openLost(shelf){
  const queue = shelf === 'mine' ? lostOpen() : [...C.LOST.common.keys()];
  if (!queue.length) return;
  S.lp = { shelf, queue, i:0, step: shelf === 'common' ? 'spot' : 'answer', tries:0, wrong:[], spotTries:0, spotWrong:[], spotOk:null, solved:false, ok:false, res:[], log:[], done:false };
  S.view = 'lost'; S.line = null; UI.lview = null; stopTimer(); save(); render(); scrollTo(0, 0);
}
function lostItem(i){
  const P = S.lp, q = P.queue[i ?? P.i];
  if (P.shelf === 'common') return { kind:'common', x:C.LOST.common[q] };
  if (q.startsWith('v:')) { const id = q.slice(2), v = C.STORY.verbs[id]; return { kind:'verb', id, v, o:TKEYS, a:TKEYS.indexOf(v.tense), from:LINE('story') }; }
  const [line, n] = q.split(':'), st = steps(line)[+n];

}
function lostSpot(ci){
  if (UI.lview !== null) return;
  const P = S.lp, it = lostItem(); if (it.kind !== 'common' || P.step !== 'spot' || P.spotWrong.includes(ci) || ci < 0 || ci >= it.x.c.length) return;
  if (ci === it.x.bad){ P.spotOk = P.spotTries === 0; P.step = 'fix'; sfx.good(); }
  else { P.spotWrong.push(ci); P.spotTries++; sfx.bad(); if (P.spotTries >= 2){ P.spotOk = false; P.step = 'fix'; } }
  save(); render();
}
function lostAnswer(idx){
  if (UI.lview !== null) return;
  const P = S.lp; if (P.solved || P.wrong.includes(idx)) return;
  const it = lostItem();
  const o = it.kind === 'common' ? it.x.o : it.o, a = it.kind === 'common' ? it.x.a : it.a;
  if (it.kind === 'common' && P.step !== 'fix') return;
  if (idx < 0 || idx >= o.length) return;
  if (idx === a){ P.solved = true; P.ok = true; sfx.good(); }
  else { P.wrong.push(idx); P.tries++; sfx.bad(); if (o.length <= 2 || P.tries >= 2){ P.solved = true; P.ok = false; } }
  if (P.solved){
    let r;
    if (it.kind === 'common') r = (P.spotOk ? 1 : 0) + (P.ok && P.tries === 0 ? 1 : 0);
    else { r = P.ok ? (P.tries === 0 ? 2 : 1) : 0; if (r === 2) S.lost[P.queue[P.i]] = 'found'; }
    P.res[P.i] = r; award(r);
    if (!Array.isArray(P.log)) P.log = [];
    P.log[P.i] = { wrong:P.wrong.slice(), spotWrong:P.spotWrong.slice(), spotOk:P.spotOk, ok:P.ok };
    UI.solvedAt = Date.now();
  }
  save(); render();
}
function lostNext(){
  const P = S.lp; if (!P.solved || tooSoon()) return;
  P.i++; P.step = P.shelf === 'common' ? 'spot' : 'answer'; P.tries = 0; P.wrong = []; P.spotTries = 0; P.spotWrong = []; P.spotOk = null; P.solved = false; P.ok = false; nextTurn();
  if (P.i >= P.queue.length){ P.done = true; sfx.chime(); setTimeout(celebrate, 400); }
  save(); render(); scrollTo(0, 0);
}
function lostPrev(){
  const P = S.lp, cur = UI.lview ?? (P.done ? P.queue.length : P.i);
  if (cur - 1 < 0) return;
  UI.lview = cur - 1; sfx.tap(); render(); scrollTo(0, 0);
}
function lostFwd(){
  const P = S.lp;
  if (UI.lview === null) return lostNext();
  const t = UI.lview + 1, live = P.done ? P.queue.length : P.i;

}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const plain = s => String(s).replace(/\*\*/g, '');
function fmtGap(s, fill){
  return fmt(s).replace('___', fill ? `<span class="gap fill">${esc(fill)}</span>` : `<span class="gap now" aria-label="gap">?</span>`);
}
function gapSentence(si, gi){
  const st = C.GAP[si];
  const t = st.text.replace(/\{(\d)\}/g, (m, n) => +n === gi ? '___' : st.gaps[+n].o[st.gaps[+n].a]);
  return t.split(/(?<=[.!?])\s+/).find(x => x.includes('___')) || t;
}
function gapStory(si, gi, solved){
  const st = C.GAP[si];
  const body = esc(st.text).replace(/\{(\d)\}/g, (m, n) => {
    n = +n; const g = st.gaps[n];
    if (n < gi) return `<span class="gap prev">${esc(g.o[g.a])}</span>`;
    if (n === gi) return solved ? `<span class="gap fill">${esc(g.o[g.a])}</span>` : `<span class="gap now">${n + 1}</span>`;

  return `<div class="storyhead"><span class="em" aria-hidden="true">${st.em}</span><h2>${esc(st.title)}</h2><span class="chip">Story ${si + 1} of ${C.GAP.length}, gap ${gi + 1}</span></div>
    <p>${body}</p>${st.note ? ukus(st.note) : ''}`;
}
/* The sentence of the story that contains a given verb, with that verb marked. */
function verbSentence(id){
  const para = C.STORY.paras.find(p => p.includes('{v:' + id + '}'));

function fitBottom(){

}

function trackHTML(color, n, d, results, veh){

/* Options: always in the order written in CONTENT. */
function optsHTML(o, a, wrong, solved, act, long){

    let cls = 'opt';

  }).join('');

function renderMCQ(l, L){
  const all = steps(l.id), n = all.length;
  const rv = UI.view !== null && UI.view >= 0 && UI.view < L.i;
  const i = rv ? UI.view : L.i, st = all[i]; if (!st) return ['', ''];
  const solved = rv ? true : L.solved, wrong = rv ? (L.picks[i] || []) : L.wrong, r = L.res[i];
  const ok = rv ? r > 0 : L.lastOk, tries = rv ? 0 : L.tries;
  let fb = '';
  if (solved){
    const title = ok ? (r === 2 ? C.UI.good[i % C.UI.good.length] : 'Got there!') : `✗ ${C.UI.reveal}: ${st.o[st.a]}`;
    const pts = S.mode === 'teams' && !rv ? ` <span class="chip">${S.teams[S.turn].icon} +${r} ${r === 1 ? 'point' : 'points'}</span>` : '';
    const order = st.order ? `<div class="firsttl"><span><b>1</b>${esc(st.order[0])}</span> → <span><b>2</b>${esc(st.order[1])}</span></div>` : '';
    const lostNote = r < 2 ? `<p class="lostnote">🧳 ${rv ? 'This one went to Lost Property.' : 'Sent to Lost Property for another try later.'}</p>` : '';
    fb = `<div class="fb ${ok ? 'ok' : 'no'}" role="status"><h2>${ok ? '✓ ' : ''}${esc(title)}${pts}</h2>${order}<p>${esc(st.why)}</p>${st.note ? ukus(st.note) : ''}${lostNote}</div>`;
  } else if (tries > 0){
    fb = `<div class="fb try" role="status"><h2>${esc(C.UI.tryAgain)}</h2></div>`;
  }
  const tag = rv ? '<span class="chip reviewtag">👀 Your answer</span>' : '';
  const html = `<section class="stage${UI.enter}${rv ? ' review-mode' : ''}" style="--c:${l.color}" aria-label="Question">

    <div class="prompt">${st.prompt(solved)}</div>

                   : (i + 1 >= n ? 'Finish the line 🎫' : 'Next stop ›');

}

/* The fixed tense panel: columns = story time | earlier past; rows = finished | in progress.

  };
  return `<div class="tgrid"><span class="th now">Story time</span>${b('ps')}${b('pc')}<span class="th before">Earlier past</span>${b('pp')}${b('ppc')}</div>`;
}
function dockFB(){

  if (f.kind === 'try') return `<p class="dock-fb try" role="status">${esc(C.UI.tryAgain)}</p>`;

let AC = null;
function tone(f, d = .12, type = 'sine', g = .07, when = 0){
  if (!prefs.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(g, t + .01); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch(e){}
}
const sfx = {
  tap(){ tone(660, .06, 'triangle', .05); },
  good(){ [523, 659, 784].forEach((f, i) => tone(f, .16, 'triangle', .07, i * .07)); },
  bad(){ tone(180, .22, 'sawtooth', .035); },
  chime(){ [659, 523, 784, 1047].forEach((f, i) => tone(f, .55, 'sine', .07, i * .2)); } // station chime
};

    const p = document.createElement('i');

    p.style.animationDelay = Math.random() * .5 + 's'; p.style.animationDuration = 1.2 + Math.random() * .9 + 's';
    if (i % 3 === 0){ p.style.borderRadius = '50%'; p.style.width = p.style.height = '10px'; }

}

  Object.keys(s.lines.story.found).forEach(id => { if (!C.STORY.verbs[id]) delete s.lines.story.found[id]; });
  C.LINES.forEach(l => { const L = s.lines[l.id];

    if (l.id !== 'tale' && (l.id !== 'story' || L.phase === 'rules') && L.i >= steps(l.id).length){ L.i = steps(l.id).length; L.done = true; } });
  if (!s.lost || typeof s.lost !== 'object') s.lost = {};
  Object.keys(s.lost).forEach(k => { if (!lostItemOK(k)) delete s.lost[k]; });
  if (s.mode !== 'teams' && s.mode !== 'solo') s.mode = 'solo';
  if (s.mode === 'teams' && (!Array.isArray(s.teams) || !s.teams.length)) s.mode = 'solo';
  if (!Array.isArray(s.teams)) s.teams = [];
  if (!(s.turn >= 0 && s.turn < s.teams.length)) s.turn = 0;
  if (s.view === 'lost' && (!s.lp || !Array.isArray(s.lp.queue) || !s.lp.queue.length)) s.view = 'hub';
  if (s.lp && !Array.isArray(s.lp.log)) s.lp.log = [];
  if (s.view === 'lost' && s.lp && s.lp.shelf === 'mine' && !s.lp.queue.every(lostItemOK)) s.view = 'hub';
  if ((s.view === 'line' || s.view === 'ticket') && !LINE(s.line)) { s.view = 'hub'; s.line = null; }
  return s;
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const acts = {
    solo: () => { S ? setMode('solo') : newGame('solo'); sfx.tap(); render(); scrollTo(0, 0); },
    teams: () => { S ? setMode('teams', +b.dataset.n) : newGame('teams', +b.dataset.n); sfx.tap(); render(); scrollTo(0, 0); },
    mode: () => { UI.setup = true; stopTimer(); render(); scrollTo(0, 0); },
    open: () => { sfx.tap(); openLine(b.dataset.id); },
    hub: goHub,
    ans: () => answer(+b.dataset.i),
    next: nextItem,
    fwd: nextItem,
    prev: prevItem,
    peek: () => peekVerb(b.dataset.id),
    review: reviewLine,
    lreview: () => { UI.lview = 0; sfx.tap(); render(); scrollTo(0, 0); },
    verb: () => selVerb(b.dataset.id),
    tense: () => pickTense(b.dataset.t),
    rules: startRules,
    tick: () => toggleTick(+b.dataset.i),
    told: taleDone,
    skip: skipTale,
    timer: () => startTimer(b.dataset.m),
    treset: resetTimer,
    more: () => { S.view = 'line'; save(); render(); },
    replay: replayLine,
    reset: resetAll,
    lost: () => { sfx.tap(); openLost(b.dataset.s); },
    spot: () => lostSpot(+b.dataset.i),
    lans: () => lostAnswer(+b.dataset.i),
    ltense: () => lostAnswer(TKEYS.indexOf(b.dataset.t)),
    lnext: lostFwd,
    gram: () => { UI.gram = true; renderOverlay(); },
    gramclose: () => { UI.gram = false; renderOverlay(); },
    sound: () => { prefs.sound = !prefs.sound; savePrefs(); render(); },
    full: toggleFull
  };
  acts[b.dataset.act]?.();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.classList.contains('sheet') && UI.gram){ UI.gram = false; renderOverlay(); }
});
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'Escape'){ if (UI.gram){ UI.gram = false; renderOverlay(); } return; }
  if (e.key === 'f' || e.key === 'F'){ toggleFull(); return; }
  if (!S || UI.gram || UI.setup) return;
  const n = parseInt(e.key, 10), enter = e.key === 'Enter' && !e.target.closest('button');
  const left = e.key === 'ArrowLeft', right = e.key === 'ArrowRight';
  if (S.view === 'lost' && S.lp){
    const P = S.lp, live = UI.lview === null;
    if (left){ lostPrev(); return; }
    if (P.done && live) return;
    if ((enter || right) && (!live || (P.solved && !tooSoon(1000)))){ e.preventDefault(); lostFwd(); return; }
    if (live && !P.solved && n >= 1){ const it = lostItem(); if (it.kind === 'common' && P.step === 'spot') lostSpot(n - 1); else lostAnswer(n - 1); }
    return;
  }
  if (S.view !== 'line') return;
  const L = S.lines[S.line];
  if (S.line === 'story' && (L.phase === 'tap' || UI.view === -1)){
    if (UI.view === -1){ if (enter || right){ e.preventDefault(); nextItem(); } return; }
    if (n >= 1 && n <= 4) pickTense(TKEYS[n - 1]);
    if (enter && Object.keys(L.found).length === verbIds().length){ e.preventDefault(); startRules(); }
    return;
  }
  if (S.line === 'tale') return;
  if (left){ prevItem(); return; }
  const live = UI.view === null;
  if (live && !L.solved && n >= 1){ answer(n - 1); return; }
  if ((enter || right) && (!live || (L.solved && !tooSoon(1000)))){ e.preventDefault(); nextItem(); }
});
addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ================= start ================= */
loadPrefs();
const saved = store.load();
if (saved){ S = repair(saved); }
render();
</script>
