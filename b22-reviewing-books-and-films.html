<style>
/* ================= tokens ================= */
:root{
  --bg:#FBF4E9; --paper:#FFFDF8; --ink:#1F1B33; --ink-soft:#5A5470; --line:#EADCC8;
  --red:#D7263D;      /* cinema red: accents and buttons */
  --gold:#F5B82E;     /* popcorn */
  --teal:#0E6B66;     /* bookshop green */
  --plum:#5B3E8C;
  --good:#167A4A; --good-bg:#E3F4EA;   /* right answer (always with ✓ and a word) */
  --bad:#B3261E;  --bad-bg:#FBE7E5;    /* wrong answer (always with ✗ and a word) */
  --display:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,-apple-system,Roboto,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:10px; --r-m:16px; --r-l:24px;
  --shadow:0 2px 0 rgba(31,27,51,.08),0 8px 24px rgba(31,27,51,.08);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.25,.46,.45,.94);
  --fs: clamp(1rem, .92rem + .35vw, 1.35rem);
  --fs-big: clamp(1.9rem, 1.2rem + 3vw, 4rem);
  --navh: 64px;
}
/* ================= base ================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;font-size:clamp(16px,7px + .7vw,22px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;min-height:44px;cursor:pointer;border:0;background:none;border-radius:var(--r-s)}
button:focus-visible,a:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em}
p{margin:.3em 0 .7em}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.deco span{position:absolute;font-size:9rem;opacity:.06}
.wrap{width:min(100%,1040px);margin:0 auto;padding:12px 16px}
main{flex:1}
.screen{display:none}.screen.active{display:block}
.enter{animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ================= top bar ================= */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px dashed var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px}
.top .title{margin:0;flex:1 1 180px;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.2}
.top .title small{display:block;font-weight:500;color:var(--ink-soft);font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);
  border:2px solid var(--line);font-weight:700;font-size:.9rem;min-height:44px}
.chip:hover{border-color:var(--ink-soft)}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-weight:700;
  border-radius:var(--r-m);background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff;border-color:#8E1324;box-shadow:0 3px 0 #8E1324}
.btn.gold{background:var(--gold);border-color:#9A6B00;box-shadow:0 3px 0 #9A6B00}
.btn.small{padding:6px 12px;font-size:.9rem;min-height:40px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ================= ticket cards ================= */
.ticket{position:relative;background:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow);padding:22px clamp(18px,3vw,36px);
  -webkit-mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 14px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 14px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket.edge{border-top:8px solid var(--red)}
.ticket.teal{border-top-color:var(--teal)} .ticket.gold{border-top-color:var(--gold)} .ticket.plum{border-top-color:var(--plum)}
.kicker{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--ink-soft)}

/* ================= home ================= */
.hero{text-align:center;padding:18px 0 8px}
.hero h2{font-size:clamp(1.8rem,1.2rem + 2.6vw,3.4rem);font-weight:900}
.hero h2 .pop{color:var(--red)}
.cando{display:inline-block;background:var(--paper);border:2px dashed var(--teal);border-radius:var(--r-m);padding:10px 16px;margin:4px 0 6px;font-weight:600}
.cando b{color:var(--teal)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:16px 0}
.modecard{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:var(--r-l);padding:16px 18px;box-shadow:var(--shadow)}
.modecard[aria-pressed="true"]{border-color:var(--ink)}
.modecard .big{font-size:2rem}
.modecard h3{margin:.2em 0}
.teamsel{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.teamsel button{min-width:56px;border:2px solid var(--line);background:var(--bg);font-weight:800}
.teamsel button[aria-pressed="true"]{border-color:var(--ink);background:var(--gold)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0 24px}
.sec{text-align:left;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r-l);background:var(--paper);
  box-shadow:var(--shadow);border:3px solid transparent;min-height:170px}
.sec:hover{border-color:var(--line)}
.sec .n{font-family:var(--display);font-weight:900;font-size:.85rem;letter-spacing:.06em;color:var(--ink-soft)}
.sec .em{font-size:2rem;line-height:1}
.sec h3{font-size:1.2rem;margin:0}
.sec p{margin:0;color:var(--ink-soft);font-size:.92rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--teal)}
.sec .status{font-size:.85rem;font-weight:700}
.sec .go{align-self:flex-start;margin-top:4px;padding:4px 12px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:.9rem}

/* ================= teams strip and timer ================= */
.teams{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:8px 0 12px}
.team{flex:1 1 120px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r-m);background:var(--paper);border:3px solid var(--line);font-weight:700}
.team .sym{font-size:1.3rem}
.team .pts{margin-left:auto;font-family:var(--mono);font-size:1.4rem}
.team.now{border-color:var(--ink);background:#FFF3CF}
.team.now::before{content:"▶";font-size:.9rem}
.turnline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.turnline .who{font-family:var(--display);font-weight:800;font-size:1.15rem}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.clock{font-family:var(--mono);font-weight:800;font-size:clamp(1.6rem,1.2rem + 1.6vw,2.6rem);min-width:4.2ch;text-align:right;line-height:1}
.clock.hurry{color:var(--red)}
.clock small{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);text-align:right}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{border-radius:0;min-width:44px;font-weight:700;font-size:.9rem;background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ================= question card ================= */
.phase{font-family:var(--display);font-weight:800;color:var(--teal)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:8px;color:var(--ink-soft);font-weight:600;font-size:.92rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:.85rem;color:var(--ink)}
.word{font-family:var(--display);font-weight:900;font-size:var(--fs-big);line-height:1.05;margin:.1em 0 .15em;overflow-wrap:anywhere}
.chunk{font-size:1.2em;color:var(--ink-soft)}
.chunk b{color:var(--ink)}
.example{margin:8px 0 0;padding:10px 14px;background:#F3EEFA;border-left:5px solid var(--plum);border-radius:var(--r-s);font-style:italic}
.review{font-size:clamp(1.15rem,1rem + .9vw,1.9rem);line-height:1.45;margin:.2em 0 .4em}
.review .gap{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--ink);text-align:center;font-weight:800;color:var(--plum)}
.review .gap.ok{color:var(--good);border-color:var(--good)}
.stars{color:#B07A00;letter-spacing:2px;font-size:1.1rem}
.medium{font-weight:800}
.opts{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:64px;padding:10px 14px;border-radius:var(--r-m);
  background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:clamp(1.05rem,.95rem + .6vw,1.6rem)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt .k{font-family:var(--mono);font-size:.75rem;padding:1px 6px;border:1.5px solid currentColor;border-radius:6px;opacity:.6}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 4px 0 var(--good);opacity:1}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:none;opacity:1;text-decoration:line-through}
.opt.pos{background:#E6F5EE}.opt.neg{background:#FCECEA}
.fb{margin-top:14px;padding:12px 16px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--bg)}
.fb.good{border-color:var(--good);background:var(--good-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb .verdict{font-weight:800}
.fb .pts{font-family:var(--mono);font-weight:800}
.note{font-size:.95rem;color:var(--ink-soft)}
.note b{color:var(--ink)}
.talk .em{font-size:2.6rem}
.tr{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;padding:10px 14px;border-radius:var(--r-s);background:#E8F5F4;border-left:5px solid var(--teal)}
.tr .lang{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:99px;background:var(--teal);color:#fff;font-size:.8rem;letter-spacing:.03em}
.talk .q{font-size:clamp(1.2rem,1rem + 1vw,2rem);font-weight:700;margin:.3em 0}
.readonly{display:inline-block;margin-bottom:8px;padding:2px 10px;border-radius:99px;background:var(--ink);color:#fff;font-size:.82rem;font-weight:700}

/* ================= nav bar (fixed place) ================= */
.nav{position:fixed;z-index:6;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;
  background:var(--paper);padding:8px;border-radius:var(--r-l);box-shadow:var(--shadow);border:2px solid var(--line)}
.nav .count{font-family:var(--mono);font-weight:700;padding:0 6px;font-size:.95rem}
.nav .btn{min-width:130px}
body.hasnav main{padding-bottom:calc(var(--navh) + 40px)}
@media (max-width:640px), (max-height:500px){
  .nav{left:0;right:0;bottom:0;border-radius:0;border-width:2px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));justify-content:space-between}
  .nav .btn{flex:1;min-width:0}
}

/* ================= end and lists ================= */
.score{font-family:var(--mono);font-weight:800;font-size:2.4rem}
.podium{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.podium .team{flex:0 1 180px}
.callout{background:#FFF3CF;border:2px solid var(--gold);border-radius:var(--r-m);padding:12px 16px;margin:12px 0}
.frame{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin:12px 0}
.frame div{background:var(--bg);border-radius:var(--r-m);padding:10px 14px;border:2px solid var(--line)}
.frame b{display:block;font-family:var(--display);color:var(--teal);font-size:max(.85rem,min(18px,1vw + 6px));text-transform:uppercase;letter-spacing:.05em}
.toolbox{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.toolbox span{padding:3px 10px;border-radius:99px;background:var(--paper);border:1.5px solid var(--line);font-size:.9rem}
.bigclock{font-family:var(--mono);font-weight:800;font-size:clamp(2.4rem,2rem + 3vw,5rem);line-height:1}
.listener{background:#E8F5F4;border-left:6px solid var(--teal);border-radius:var(--r-s);padding:10px 14px;margin-top:12px}
.slipnote{margin-top:8px;padding:10px 14px;border-radius:var(--r-s);background:#F3EEFA;border-left:5px solid var(--plum)}

/* phones: compact top bar (icons keep their aria-labels) */
@media (max-width:560px){
  .top .chip span{display:none}
  .top .chip{padding:6px 10px;min-width:44px;justify-content:center}
  .top .wrap{flex-wrap:nowrap}
  .top .title{font-size:.88rem;min-width:0}
  .nav .btn{padding:10px 8px}
}
/* whiteboard: no text under 18 px */
@media (min-width:1600px){
  .wrap{width:min(100%,1400px)}
  .kicker,.tr .lang,.top .title small,.tag,.sec .n,.sec .status,.teamsel button,.seg button,.btn.small,.chip,.clock small,.note,.opt .k{font-size:max(18px,.9rem)}
}
/* ================= panels (settings, QR) ================= */
.panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(31,27,51,.5);padding:16px}
.panel.open{display:flex}
.panel .box{background:var(--paper);border-radius:var(--r-l);padding:20px;width:min(100%,520px);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.panel .box h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setlist{display:grid;gap:10px}
.setlist .btn{justify-content:flex-start}
.qr{width:min(78vw,62vh,520px);margin:0 auto;display:block;background:#fff;padding:10px;border-radius:var(--r-m)}
.qr svg{display:block;width:100%;height:auto}
.panel .box.qrbox{width:auto;max-width:96vw;text-align:center}

/* ================= signature footer (Class of Coffee) ================= */
.coc-footer{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:4px 16px; padding:7px 20px;
  background:var(--coc-tan,#E6C496); color:var(--coc-coffee-dark,#5A2D0C);
  font-family:var(--coc-body,'Nunito','Segoe UI',Verdana,sans-serif); font-size:13px; line-height:1.4;
}
.coc-footer__brand{ display:flex; align-items:center; gap:10px; font-weight:600; }
.coc-footer__mark{ width:30px; height:30px; flex:none; }
.coc-footer a{ color:inherit; text-decoration:underline; text-underline-offset:3px;
  display:inline-flex; align-items:center; min-height:40px; padding:0 4px; }
.coc-footer a:focus-visible{ outline:2px solid var(--coc-coffee-dark,#5A2D0C); outline-offset:3px; border-radius:4px; }
.coc-footer{margin-top:18px;border-radius:var(--r-m)}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span style="top:8%;left:-2%">🎬</span><span style="top:55%;right:-3%">📚</span><span style="bottom:-4%;left:30%">🍿</span></div>

<header class="top">
  <div class="wrap">
    <button class="chip" data-act="home" aria-label="Menu">🏠 <span>Menu</span></button>
    <h1 class="title" id="topTitle"></h1>
    <button class="chip" data-act="modepage" id="modeChip" aria-label="Change mode"></button>
    <button class="chip" data-act="settings" aria-label="Settings">⚙️ <span>Settings</span></button>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="screen" id="s-mode"></section>
    <section class="screen" id="s-menu"></section>
    <section class="screen" id="s-play"></section>
    <section class="screen" id="s-speak"></section>
    <section class="screen" id="s-end"></section>
  </div>
</main>

<nav class="nav" id="nav" hidden>
  <button class="btn" data-act="prev" id="prevBtn">◀ Previous</button>
  <span class="count" id="navCount"></span>
  <button class="btn primary" data-act="next" id="nextBtn">Next ▶</button>
</nav>

<div class="panel" id="p-settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="box">
    <h2 id="setTitle">Settings <button class="btn small" data-act="close">✕ Close</button></h2>
    <div class="setlist" id="setList"></div>
  </div>
</div>
<div class="panel" id="p-qr" role="dialog" aria-modal="true" aria-label="QR code">

function getItem(k){

    const list = src==='sa' ? C.SORT.a : src==='sb' ? C.SORT.b : C.SORT.bReserve;
    const it = list[+id]; return { kind:'sort', ...it, opts:[C.UI.pos, C.UI.neg], a: it.p==='+' ? 0 : 1 };
  }
  if (src==='rm' || src==='rr'){ const it = (src==='rm' ? C.REVIEWS.main : C.REVIEWS.reserve)[+id]; return { kind:'mc', ...it }; }
  if (src==='sl'){ return { kind:'slip', ...C.SLIPS[+id] }; }
  if (src==='ta'){ return { kind:'talk', ...C.SORT.talkA[+id] }; }
  if (src==='tb'){ return { kind:'talk', ...C.SORT.talkB[+id] }; }
  return null;
}
const keys = (pre, list) => list.map((_, i) => pre + ':' + i);

/* Fair turns: main items in full rounds; reserves fill the last round if needed. */
function fairList(main, reserve){
  if (S.mode !== 'teams') return main.concat(reserve);
  const n = S.nTeams, rem = main.length % n;
  if (!rem) return main.slice();
  const need = n - rem;
  return need <= reserve.length ? main.concat(reserve.slice(0, need)) : main.slice(0, main.length - rem);
}

function buildSection(id){
  let steps = [];
  if (id === 'sort'){
    const qa = keys('sa', C.SORT.a), qb = keys('sb', C.SORT.b), qr = keys('sr', C.SORT.bReserve);
    // Fair turns are counted across both rounds together.
    const all = fairList(qa.concat(qb), qr);
    const inA = all.filter(k => k.startsWith('sa')), inB = all.filter(k => !k.startsWith('sa'));
    steps.push({ t:'phase', k:'introA' }); inA.forEach(k => steps.push({ t:'q', k }));
    keys('ta', C.SORT.talkA).forEach(k => steps.push({ t:'talk', k }));
    steps.push({ t:'phase', k:'introB' }); inB.forEach(k => steps.push({ t:'q', k }));
    keys('tb', C.SORT.talkB).forEach(k => steps.push({ t:'talk', k }));
  }
  if (id === 'reviews'){
    steps.push({ t:'phase', k:'intro' });
    fairList(keys('rm', C.REVIEWS.main), keys('rr', C.REVIEWS.reserve)).forEach(k => steps.push({ t:'q', k }));
  }
  let qi = 0; steps.forEach(s => { if (s.t==='q') s.n = qi++; });
  S.sec[id] = { steps, pos:0, ans:{}, done:false, nq:qi, nTeams:S.mode==='teams'?S.nTeams:0 };
}

function teamFor(sec, step){ return sec.nTeams ? step.n % sec.nTeams : -1; }

function addMistake(k){ if (!S.mistakes.includes(k)) S.mistakes.push(k); }
function removeMistake(k){ S.mistakes = S.mistakes.filter(x => x !== k); }

/* Answer a question. Returns nothing; updates the record. */
function answer(rec, item, choice, opts){
  if (rec.final || rec.tries.includes(choice)) return;
  rec.tries.push(choice);
  const right = choice === item.a;
  const late = !!opts.late;
  if (rec.tries.length === 1) rec.late = late;
  if (right){
    rec.final = true; rec.first = rec.tries.length === 1;
    rec.pts = late ? 0 : (rec.tries.length === 1 ? 2 : 1);
  } else {
    if (rec.tries.length === 1 && opts.mistakeKey) addMistake(opts.mistakeKey);
    if (item.opts.length < 3 || rec.tries.length >= 2){ rec.final = true; rec.first = false; rec.pts = 0; }
  }
  if (late) rec.pts = 0;
}

function scores(sec){
  const t = Array(S.nTeams).fill(0);
  Object.values(sec.ans).forEach(r => { if (r.team >= 0 && r.final) t[r.team] += r.pts || 0; });
  return t;
}

/* Mistakes round: queue = learner's mistakes + common slips not yet mastered. */
function mistakeQueue(){
  const slips = keys('sl', C.SLIPS).filter(k => !S.mastered.includes(k) && !S.mistakes.includes(k));
  return S.mistakes.concat(slips);
}

/* ================= thinking time (Teams mode) ================= */
const QT = { start:0, stopped:null, hurryEnd:null, paused:false, pausedAt:0, ticked:-1, int:null, up:false };
function qtStart(){ Object.assign(QT, { start:Date.now(), stopped:null, hurryEnd:null, paused:false, up:false, ticked:-1 }); qtLoop(); }
function qtStop(){ if (QT.stopped === null) QT.stopped = Date.now(); }
function qtHurry(){ if (QT.stopped !== null || QT.paused) return; QT.hurryEnd = Date.now() + prefs.hurry*1000; QT.up = false; drawTimer(); }
function qtPause(){
  if (QT.stopped !== null) return;
  if (!QT.paused){ QT.paused = true; QT.pausedAt = Date.now(); }
  else { const d = Date.now() - QT.pausedAt; QT.start += d; if (QT.hurryEnd) QT.hurryEnd += d; QT.paused = false; }
  drawTimer();
}
function qtTimeUp(){ return !!QT.hurryEnd && (QT.up || Date.now() >= QT.hurryEnd); }
function qtLoop(){ clearInterval(QT.int); QT.int = setInterval(drawTimer, 200); }
function qtElapsed(){ const end = QT.stopped ?? (QT.paused ? QT.pausedAt : Date.now()); return Math.max(0, end - QT.start); }
function qtLeft(){ if (!QT.hurryEnd) return null; const now = QT.stopped ?? (QT.paused ? QT.pausedAt : Date.now()); return Math.max(0, QT.hurryEnd - now); }

function roundOf(sec, step){

      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="btn small" data-act="home">🏠 Menu</button>
        <button class="btn small" data-act="again">↺ Play this section again</button></div>
    </div>${footer()}`;
  show('end', 'end:' + id);
}

/* ================= display: speaking ================= */
const SP = { mode:null, end:0, int:null, paused:false, left:0 };
function renderSpeak(){
  setTop('Thirty-second review');
  const sp = S.sec.speak, cards = C.SPEAK.cards;
  if (!sp.order) sp.order = shuffle(cards.map((_,i)=>i));
  const card = cards[sp.order[sp.i]];
  $('#s-speak').innerHTML = `<div class="ticket edge">
      <div class="kicker">Warm-up 3 · Card ${sp.i+1} of ${cards.length}</div>
      <p class="note">${esc(C.SPEAK.intro)}</p>
      <div class="talk"><div class="em" aria-hidden="true" style="font-size:3rem">${card.em}</div>
      <p class="q" style="font-size:clamp(1.4rem,1.1rem + 1.6vw,2.6rem);font-family:var(--display);font-weight:800">${esc(card.t)}</p></div>
      <div class="row" style="margin:8px 0">
        <button class="btn gold" data-act="sptime" data-m="plan">📝 Plan · ${C.SPEAK.planSecs/60} min</button>
        <button class="btn primary" data-act="sptime" data-m="speak">🎤 Speak · ${C.SPEAK.speakSecs} s</button>
        <span class="bigclock" id="spclock" aria-live="off">–:––</span>
        <button class="btn small" data-act="sppause" id="spPause" hidden>❚❚ Pause</button>
      </div>
      <div class="frame">${C.SPEAK.frame.map(f => `<div><b>${esc(f.h)}</b>${esc(f.t)}</div>`).join('')}</div>
      <div class="listener">👂 ${esc(C.SPEAK.listener)}</div>
      <div class="kicker" style="margin-top:14px">Toolbox</div>
      <div class="toolbox">${C.SPEAK.toolbox.map(w => `<span>${esc(w)}</span>`).join('')}</div>
    </div>`;
  setNav(true, sp.i > 0, true, `${sp.i+1} / ${cards.length}`, sp.i === cards.length-1 ? 'Menu ▶' : 'Next card ▶');
  show('speak', 'speak:' + sp.i);
  drawSp();
}
function spStart(m){
  SP.mode = m; SP.paused = false; SP.end = Date.now() + (m==='plan' ? C.SPEAK.planSecs : C.SPEAK.speakSecs)*1000; SP.done = false;
  clearInterval(SP.int); SP.int = setInterval(drawSp, 200); keepAwake(true); drawSp();
}
function spPause(){
  if (!SP.mode) return;
  if (!SP.paused){ SP.paused = true; SP.left = SP.end - Date.now(); } else { SP.paused = false; SP.end = Date.now() + SP.left; }
  drawSp();
}
function drawSp(){
  const el = document.getElementById('spclock'), pb = document.getElementById('spPause'); if (!el) { clearInterval(SP.int); return; }
  if (!SP.mode){ el.textContent = '–:––'; if (pb) pb.hidden = true; return; }
  const left = SP.paused ? SP.left : SP.end - Date.now();
  if (left <= 0){ el.textContent = SP.mode==='plan' ? 'Ready? Speak!' : 'Time! Listener…'; if (!SP.done){ SP.done = true; sfx.chime(); } clearInterval(SP.int); if (pb) pb.hidden = true; return; }
  el.textContent = fmt(left + 999); if (pb){ pb.hidden = false; pb.textContent = SP.paused ? '▶ Resume' : '❚❚ Pause'; }
}
function spReset(){ clearInterval(SP.int); SP.mode = null; }

/* ================= display: mistakes ================= */
function renderMistakes(){
  setTop('Mistakes round');
  const m = S.sec.mistakes;
  const q = mistakeQueue();
  // History view (read-only) or current item
  if (m.pos < m.hist.length){
    const h = m.hist[m.pos], it = getItem(h.k);
    $('#s-play').innerHTML = `<div class="kicker" style="margin-bottom:8px">🔁 Mistakes round · answered earlier</div>
      <div class="ticket edge plum"><span class="readonly">Answered · review</span>${itemBody(it, h.rec)}${optsHtml(it, h.rec, true)}${fbHtml(it, h.rec, false)}</div>`;
    setNav(true, m.pos > 0, true, `${q.length} left`);
    show('play', 'mh:' + m.pos); return;
  }
  if (!q.length){
    $('#s-play').innerHTML = `<div class="ticket edge teal" style="text-align:center"><div style="font-size:3rem">✨</div><h2>All clear!</h2>
      <p>There is nothing to review at the moment. Mistakes from warm-ups 1 and 2 will appear here.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="home">🏠 Menu</button></div></div>${footer()}`;
    setNav(m.hist.length > 0, m.pos > 0, false, ''); show('play', 'mempty'); return;
  }
  const k = q[0], it = getItem(k);
  if (!m.cur || m.cur.k !== k) m.cur = { k, rec:{ tries:[], team:-1 } };
  const rec = m.cur.rec;
  $('#s-play').innerHTML = `<div class="kicker" style="margin-bottom:8px">🔁 Mistakes round · ${q.length} to go · a word leaves the list when you get it right first time</div>
    <div class="ticket edge plum">${itemBody(it, rec)}${optsHtml(it, rec, false)}${fbHtml(it, rec, false)}</div>`;
  setNav(true, m.pos > 0, !!rec.final, `${q.length} left`);
  show('play', 'mq:' + m.hist.length + ':' + k);
}
function mistakesNext(){
  const m = S.sec.mistakes;
  if (m.pos < m.hist.length){ m.pos++; return; }
  if (!m.cur || !m.cur.rec.final) return;
  const k = m.cur.k, ok = m.cur.rec.first;
  if (ok){ removeMistake(k); if (k.startsWith('sl') && !S.mastered.includes(k)) S.mastered.push(k); }
  else if (!S.mistakes.includes(k)) S.mistakes.push(k);
  else { S.mistakes = S.mistakes.filter(x => x!==k).concat(k); }  // send to the back of the queue
  m.hist.push(m.cur); if (m.hist.length > 60) m.hist.shift();
  m.pos = m.hist.length; m.cur = null;
}

/* ================= router ================= */
function render(){
  spReset();
  if (!S.mode || V.screen === 'mode') return renderMode();
  if (V.screen === 'menu') return renderMenu();
  if (V.screen === 'speak') return renderSpeak();
  if (V.screen === 'mistakes') return renderMistakes();
  if (V.screen === 'end') return renderEnd();
  if (V.screen === 'play') return renderPlay();
  renderMenu();
}
function go(screen){ V.screen = screen; V.ex = false; save(); render(); window.scrollTo({ top:0 }); }

function openSection(id){
  S.last = id === 'mistakes' ? S.last : id;
  V.sec = id; V.reviewing = false;
  if (id === 'speak') return go('speak');
  if (id === 'mistakes'){ S.sec.mistakes.pos = S.sec.mistakes.hist.length; return go('mistakes'); }
  const want = S.mode==='teams' ? S.nTeams : 0;
  if (!S.sec[id] || (!Object.keys(S.sec[id].ans).length && S.sec[id].nTeams !== want)) buildSection(id);
  const sec = S.sec[id];
  if (sec.done){ return go('end'); }
  go('play');
}

/* ================= events ================= */
function act(name, el){
  sfx.tap0();
  switch(name){
    case 'home': closePanels(); return go('menu');
    case 'modepage': closePanels(); return go('mode');
    case 'settings': return openSettings();
    case 'close': return closePanels();
    case 'teams': S.mode = 'teams'; S.nTeams = +el.dataset.n; return go('menu');
    case 'solo': S.mode = 'solo'; return go('menu');
    case 'open': return openSection(el.dataset.id);
    case 'ans': return doAnswer(+el.dataset.i);
    case 'next': return doNext();
    case 'prev': return doPrev();
    case 'hurry': qtHurry(); return;
    case 'hsecs': prefs.hurry = +el.dataset.s; savePrefs(); document.querySelectorAll('[data-act="hsecs"]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s===prefs.hurry)); return;
    case 'pause': qtPause(); return;
    case 'review': { const sec = S.sec[V.sec]; sec.pos = 0; V.reviewing = true; return go('play'); }
    case 'again': if (confirmLike()) { buildSection(V.sec); S.last = V.sec; return go('play'); } return;
    case 'sptime': return spStart(el.dataset.m);
    case 'sppause': return spPause();
    case 'sound': prefs.sound = !prefs.sound; savePrefs(); return openSettings();
    case 'qr': return openQR();
    case 'full': return toggleFull();
    case 'reset': return askReset(el);
  }
}
function confirmLike(){ return true; }   // no browser dialogs: "Play again" simply restarts this section
function doAnswer(i){
  if (V.screen === 'mistakes'){
    const m = S.sec.mistakes; if (!m.cur || m.pos < m.hist.length) return;
    const it = getItem(m.cur.k); if (i >= it.opts.length) return;
    answer(m.cur.rec, it, i, {});
    m.cur.rec.final ? (m.cur.rec.first ? sfx.good() : sfx.bad()) : sfx.bad();
    save(); return renderMistakes();
  }
  if (V.screen !== 'play') return;
  const sec = S.sec[V.sec], step = sec.steps[sec.pos]; if (step.t !== 'q') return;
  const it = getItem(step.k); if (i >= it.opts.length) return;
  const rec = sec.ans[sec.pos] || (sec.ans[sec.pos] = { tries:[], team: (sec.nTeams && S.mode==='teams') ? teamFor(sec, step) : -1 });
  if (rec.final) return;
  const late = rec.team >= 0 && qtTimeUp();
  answer(rec, it, i, { late, mistakeKey: step.k });
  if (rec.final){ qtStop(); (rec.tries[rec.tries.length-1] === it.a) ? sfx.good() : sfx.bad(); } else sfx.bad();
  save(); renderPlay();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function doNext(){
  if (V.screen === 'speak'){
    const sp = S.sec.speak;
    if (sp.i < C.SPEAK.cards.length - 1){ sp.i++; save(); spReset(); return renderSpeak(); }
    sp.i = 0; sp.order = null; return go('menu');
  }
  if (V.screen === 'mistakes'){ mistakesNext(); save(); V.ex = false; renderMistakes(); window.scrollTo({top:0}); return; }
  if (V.screen !== 'play') return;
  const sec = S.sec[V.sec], step = sec.steps[sec.pos], rec = sec.ans[sec.pos];
  if (step.t === 'q' && !(rec && rec.final)) return;
  V.ex = false;
  if (sec.pos >= sec.steps.length - 1){ sec.done = true; sec.max = sec.steps.length; V.reviewing = false; return go('end'); }
  sec.pos++; sec.max = Math.max(sec.max||0, sec.pos); save(); renderPlay(); window.scrollTo({ top:0 });
}
function doPrev(){
  if (V.screen === 'speak'){ const sp = S.sec.speak; if (sp.i > 0){ sp.i--; save(); spReset(); renderSpeak(); } return; }
  if (V.screen === 'mistakes'){ const m = S.sec.mistakes; if (m.pos > 0){ m.pos--; renderMistakes(); window.scrollTo({top:0}); } return; }
  if (V.screen !== 'play') return;
  const sec = S.sec[V.sec]; if (sec.pos > 0){ sec.pos--; V.ex = false; save(); renderPlay(); window.scrollTo({ top:0 }); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (e.target.closest('.panel') && !e.target.closest('.box')) return;
  act(b.dataset.act, b);
});
document.querySelectorAll('.panel').forEach(p => p.addEventListener('click', e => { if (e.target === p) closePanels(); }));
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'Escape') return closePanels();
  if (document.querySelector('.panel.open')) return;
  const k = e.key;
  if (k === 'ArrowRight' && !$('#nextBtn').disabled && !$('#nav').hidden) doNext();
  else if (k === 'ArrowLeft' && !$('#prevBtn').disabled && !$('#nav').hidden) doPrev();
  else if (k === 'h' || k === 'H') qtHurry();
  else if (k === ' ' && (V.screen === 'play' || V.screen === 'speak')){ e.preventDefault(); V.screen === 'speak' ? spPause() : qtPause(); }
  else if (k === 'f' || k === 'F') toggleFull();
  else if (/^[1-3]$/.test(k)){ const b = document.querySelector(`.opt[data-i="${+k-1}"]:not(:disabled)`); if (b) b.click(); }
});

/* ================= panels ================= */
function openSettings(){
  $('#setList').innerHTML = `
    <button class="btn" data-act="qr">📱 Show QR code</button>
    <button class="btn" data-act="sound">${prefs.sound ? '🔊 Sound: on' : '🔇 Sound: off'}</button>
    <button class="btn" data-act="modepage">🎛️ Change mode (Teams / Just me)</button>
    <button class="btn" data-act="full">⛶ Full screen (F)</button>
    <button class="btn" data-act="reset" id="resetBtn">🗑️ Reset all progress on this device</button>
    <p class="note">Keys: 1–3 choose an answer · ← → previous / next · H hurry up · Space pause · F full screen · Esc close.</p>
    <p class="note">Progress is saved only in this browser. Nothing is sent anywhere.</p>`;
  $('#p-settings').classList.add('open'); $('#p-settings .btn').focus();
}
function askReset(el){
  if (el.dataset.sure){ S = freshState(); store.clear(); closePanels(); V.screen = 'mode'; render(); return; }
  el.dataset.sure = '1'; el.textContent = '⚠️ Tap again to delete all progress'; el.classList.add('primary');
}
function openQR(){ $('#p-settings').classList.remove('open'); $('#qrUrl').textContent = C.url; $('#p-qr').classList.add('open'); }
function closePanels(){ document.querySelectorAll('.panel.open').forEach(p => p.classList.remove('open')); }
function toggleFull(){ const d = document, el = d.documentElement; try { (d.fullscreenElement ? d.exitFullscreen() : el.requestFullscreen()).catch(()=>{}); } catch(e){} }

/* ================= sound ================= */
let AC = null;
function tone(freq, dur=.12, type='sine', gain=.08, when=0){
  if (!prefs.sound) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  } catch(e){}
}
const sfx = {
  tap0(){},
  tick(){ tone(880, .05, 'square', .03); },
  good(){ [523,659,784,1047].forEach((f,i) => tone(f, .16, 'triangle', .06, i*.06)); },
  bad(){ tone(196, .18, 'sawtooth', .035); },
  chime(){ [784,988,1175,1568].forEach((f,i) => tone(f, .5, 'sine', .06, i*.15)); },
};
let lock = null;
async function keepAwake(on=true){ try { if (on && 'wakeLock' in navigator && !lock) lock = await navigator.wakeLock.request('screen'); } catch(e){} }

/* ================= utils ================= */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ================= saving ================= */
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} },
};
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(() => { if (S) store.save(S); }, 120); }
function savePrefs(){ try { localStorage.setItem(PREFKEY, JSON.stringify(prefs)); } catch(e){} }
addEventListener('visibilitychange', () => { if (document.hidden && S) store.save(S); });

function validKey(k){ try { return typeof k === 'string' && !!getItem(k); } catch(e){ return false; } }
function loadState(){
  const d = store.load(); const f = freshState();
  if (!d || d.v !== 1 || typeof d !== 'object') return f;
  try {
    const s = Object.assign(f, { mode: ['teams','solo'].includes(d.mode) ? d.mode : null,
      nTeams: [2,3,4].includes(d.nTeams) ? d.nTeams : 2,
      last: C.sections.some(x => x.id === d.last) ? d.last : null,
      mistakes: Array.isArray(d.mistakes) ? d.mistakes.filter(validKey) : [],
      mastered: Array.isArray(d.mastered) ? d.mastered.filter(validKey) : [] });
    ['sort','reviews'].forEach(id => {
      const x = d.sec && d.sec[id];
      if (x && Array.isArray(x.steps) && x.steps.every(st => st && (st.t==='phase' || validKey(st.k))) && typeof x.pos === 'number' && x.pos < x.steps.length)
        s.sec[id] = { steps:x.steps, pos:x.pos, ans: (x.ans && typeof x.ans==='object') ? x.ans : {}, done:!!x.done, max:+x.max||0, nq:+x.nq||0, nTeams:[0,2,3,4].includes(x.nTeams)?x.nTeams:0 };
    });
    const sp = d.sec && d.sec.speak;
    if (sp && Array.isArray(sp.order) && sp.order.length === C.SPEAK.cards.length && Number.isInteger(sp.i) && sp.i >= 0 && sp.i < C.SPEAK.cards.length) s.sec.speak = { order: sp.order.map(Number), i: sp.i };
    return s;
  } catch(e){ return freshState(); }
}

/* ================= start ================= */
try { const p = JSON.parse(localStorage.getItem(PREFKEY)); if (p && typeof p === 'object'){ prefs.sound = p.sound !== false; if ([5,10,20].includes(p.hurry)) prefs.hurry = p.hurry; } } catch(e){}
S = loadState();
V.screen = S.mode ? 'menu' : 'mode';
render();
</script>
<script>
/* ===== Class of Coffee – origin check (separate from the tool's own code) ===== */
(function () {
  var HOME = ['classofcoffee.com', 'www.classofcoffee.com', 'as1-design.github.io', 'localhost', '127.0.0.1'];
  if (HOME.indexOf(location.hostname) > -1) return;
  try { if (sessionStorage.getItem('coc-origin-closed')) return; } catch (e) {}

  function show() {
    if (document.querySelector('.coc-origin')) return;
    var canon = document.querySelector('link[rel="canonical"]');
    var url = canon && /^https:\/\//.test(canon.href) ? canon.href : 'https://classofcoffee.com';
    var box = document.createElement('aside');
    box.className = 'coc-origin';
    box.setAttribute('aria-label', 'About this activity');
    box.innerHTML = '<svg viewBox="4 4 48 48" aria-hidden="true" focusable="false"><path d="M48.31 17.2A23 23 0 1 0 48.31 38.8A3.25 3.25 0 0 0 42.57 35.75A16.5 16.5 0 1 1 42.57 20.25A3.25 3.25 0 0 0 48.31 17.2Z" fill="#A2521A" stroke="#5A2D0C" stroke-width="1.8"/><circle cx="28" cy="28" r="12.2" fill="#744823"/><path d="M32.5 22.64A7.0 7.0 0 1 0 32.5 33.36L32.64 32.21A5.5 5.5 0 1 1 32.64 23.79Z" fill="#F3E2BF"/></svg>';
    var text = document.createElement('span');
    text.textContent = 'Original by Class of Coffee';
    var link = document.createElement('a');
    link.href = url; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Open the original';
    var close = document.createElement('button');
    close.type = 'button'; close.setAttribute('aria-label', 'Close this note'); close.textContent = '×';
    close.addEventListener('click', function () {
      box.remove();
      try { sessionStorage.setItem('coc-origin-closed', '1'); } catch (e) {}

    box.appendChild(text); box.appendChild(link); box.appendChild(close);
    document.body.appendChild(box);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
})();
</script>
