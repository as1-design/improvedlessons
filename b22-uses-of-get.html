/* ================= CONTENT (edit here) ================= */
// Mini-format: in sentences, square brackets [ ] mark the words that are highlighted.
// "a" is the index of the correct option, counting from 0. "us" is an optional
// American English note and "l1" an optional Spanish/Catalan note, both shown after the answer.

const SETTINGS = {
  buildHighlightFirst: 4,   // Build it: the get tile is yellow in the first 4 sentences only
};

// The five uses of get. Their order is used by activity 1 (Sort it).
const USES = [
  { id:'u1', icon:'📦', name:'receive, bring, arrive', short:'receive / bring / arrive',
    pattern:'get + noun / pronoun · get to + place',
    explain:'With a noun or pronoun, get usually means receive, bring, fetch, obtain, buy or catch. With to + a place, it means arrive at or in.',
    example:'I [got] a strange email this morning. · What time did you [get to] the station?' },
  { id:'u2', icon:'🌗', name:'become', short:'become',
    pattern:'get + adjective / comparative adjective',
    explain:'With an adjective or a comparative adjective, get means become. It describes a change.',
    example:'It\'s [getting colder]. · Prices have [got higher].' },
  { id:'u3', icon:'⚡', name:'passive', short:'passive',
    pattern:'get + past participle',
    explain:'Get + past participle can replace be in a passive structure. It is more informal, and it is often used for bad or unexpected things.',
    example:'My bike [got stolen]. · The match [got cancelled].' },
  { id:'u4', icon:'✂️', name:'someone does it for you', short:'get something done',
    pattern:'get + object + past participle', gist:'someone else does it for you.',
    explain:'In informal spoken English, get + object + past participle can replace have + object + past participle. You ask or pay someone to do something for you.',

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const range = n => Array.from({ length:n }, (_, i) => i);
function shuffleNotSame(n){ if (n < 2) return range(n); let o; do { o = shuffle(range(n)); } while (o.every((v, i) => v === i)); return o; }
const GAPS = STORY.parts.filter(p => typeof p === 'object');

function freshAct(id){
  if (id === 'sort')  return { order:shuffle(range(SORT.length)), i:0, picks:{} };
  if (id === 'state') return { order:shuffle(range(STATE.length)), i:0, picks:{}, opt:{} };
  if (id === 'build') return { order:range(BUILD.length), i:0, placed:{}, pool:{}, res:{}, tries:{}, wrong:false };
  if (id === 'story') { const opt = {}; GAPS.forEach((g, k) => opt[k] = shuffle(range(g.o.length))); return { i:0, picks:{}, opt }; }
  if (id === 'speak') return { order:range(SPEAK.length), i:0 };
}
function freshPracRound(){ return { queue:[], i:0, picks:{}, opt:{}, placed:{}, pool:{}, res:{}, tries:{}, wrong:false }; }
function freshPrac(){ return { ...freshPracRound(), fixed:{} }; }
function freshState(){ return { v:1, screen:'home', act:'sort', sort:freshAct('sort'), state:freshAct('state'), build:freshAct('build'), story:freshAct('story'), speak:freshAct('speak'), prac:freshPrac() }; }

/* ================= logic ================= */
function correctOf(kind, i){ return kind === 'sort' ? SORT[i].u : kind === 'state' ? STATE[i].a : kind === 'story' ? GAPS[i].a : null; }
function optOrder(kind, i, store, key){
  if (kind === 'sort') return range(USES.length);
  const n = kind === 'state' ? STATE[i].o.length : GAPS[i].o.length;
  if (!store.opt[key]) store.opt[key] = shuffle(range(n));
  return store.opt[key];
}
const parseKey = k => { const [kind, n] = k.split(':'); return { kind, i:+n }; };

// The item on screen now, for choice questions and for Build it
function ctxChoice(){
  const scr = S.screen;
  if (scr === 'sort' || scr === 'state') { const A = S[scr]; if (A.i >= A.order.length) return null; const it = A.order[A.i]; return { kind:scr, i:it, key:it, store:A }; }
  if (scr === 'story') { const A = S.story; if (A.i >= GAPS.length) return null; return { kind:'story', i:A.i, key:A.i, store:A }; }
  if (scr === 'prac') { const P = S.prac; if (P.i >= P.queue.length) return null; const key = P.queue[P.i], { kind, i } = parseKey(key); if (kind === 'build') return null; return { kind, i, key, store:P, prac:true }; }
  return null;
}
function ctxBuild(){
  if (S.screen === 'build') { const A = S.build; if (A.i >= A.order.length) return null; const it = A.order[A.i]; return { i:it, key:it, store:A, highlight: it < SETTINGS.buildHighlightFirst }; }
  if (S.screen === 'prac') { const P = S.prac; if (P.i >= P.queue.length) return null; const key = P.queue[P.i], { kind, i } = parseKey(key); if (kind !== 'build') return null; return { i, key, store:P, prac:true, highlight:false }; }
  return null;
}

function pick(o){
  const c = ctxChoice(); if (!c || c.store.picks[c.key] !== undefined) return false;
  c.store.picks[c.key] = o;
  if (c.prac && o === correctOf(c.kind, c.i)) S.prac.fixed[c.key] = true;
  save(); return true;
}
function next(){
  const scr = S.screen;
  if (scr === 'sort' || scr === 'state' || scr === 'build') { const A = S[scr]; A.i = Math.min(A.i + 1, A.order.length); A.wrong = false; }
  else if (scr === 'story') S.story.i = Math.min(S.story.i + 1, GAPS.length);
  else if (scr === 'prac') { const P = S.prac; P.i = Math.min(P.i + 1, P.queue.length); P.wrong = false; }
  save();
}

function buildEnsure(c){ const st = c.store; if (!st.pool[c.key]) { st.pool[c.key] = shuffleNotSame(BUILD[c.i].t.length); st.placed[c.key] = []; } }
function placeTile(k){ const c = ctxBuild(); if (!c) return; buildEnsure(c); const st = c.store; if (st.res[c.key] || st.placed[c.key].includes(k)) return; st.placed[c.key].push(k); st.wrong = false; save(); }
function unplaceTile(k){ const c = ctxBuild(); if (!c) return; buildEnsure(c); const st = c.store; if (st.res[c.key]) return; st.placed[c.key] = st.placed[c.key].filter(x => x !== k); st.wrong = false; save(); }
function checkBuild(){
  const c = ctxBuild(); if (!c) return; buildEnsure(c); const st = c.store, t = BUILD[c.i].t;
  if (st.placed[c.key].length !== t.length || st.res[c.key]) return;
  const ok = st.placed[c.key].map(k => t[k]).join(' ') === t.join(' ');
  st.tries[c.key] = (st.tries[c.key] || 0) + 1;
  if (ok) { st.res[c.key] = st.tries[c.key] === 1 ? 'first' : 'later'; st.wrong = false; if (c.prac) S.prac.fixed[c.key] = true; }
  else st.wrong = true;
  save();
}
function showBuild(){ const c = ctxBuild(); if (!c) return; buildEnsure(c); const st = c.store; st.placed[c.key] = range(BUILD[c.i].t.length); st.res[c.key] = 'shown'; st.wrong = false; save(); }

function meter(done, total){
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="meter"><span>${done} / ${total}</span><span class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="Progress"><i style="width:${pct}%"></i></span></div>`;
}
function setBar(cfg){
  const bar = $('#bar');
  if (!cfg) { bar.hidden = true; bar.innerHTML = ''; document.body.classList.remove('has-bar'); return; }
  bar.hidden = false; document.body.classList.add('has-bar');
  const sec = (cfg.sec || []).map(b => `<button class="btn ghost" data-act="${b.act}" aria-label="${esc(b.label)}"><span aria-hidden="true">${b.icon}</span><span class="lbl">${esc(b.label)}</span></button>`).join('');
  const p = cfg.primary;
  bar.innerHTML = `<div class="bar-in">${cfg.total ? meter(cfg.done, cfg.total) : '<span class="meter"></span>'}${sec}
    <button class="btn primary" data-act="${p.act}"${p.id ? ` data-id="${p.id}"` : ''} ${p.disabled ? 'disabled' : ''}>${esc(p.label)}</button></div>`;
}

      cls:o => 'cat ' + USES[o].id, note:`${u.icon} <b>${esc(u.name)}</b> (${esc(u.pattern)}). ${esc(it.note)}`, us:it.us }; }
  if (kind === 'state') { const it = STATE[i];
    return { prompt:`<p class="situ">${esc(it.s)}</p>`, layout:'two', label:o => `<span class="tx">${esc(it.o[o])}</span>`, cls:() => '', note:esc(it.note), us:it.us }; }
  const g = GAPS[i], c = gapContext(i);
  return { prompt:`<p class="situ">${esc(c.before)}<span class="gap now">?</span>${esc(c.after)}</p>`, layout:'three',
    label:o => `<span class="tx">${esc(g.o[o])}</span>`, cls:() => '', note:esc(g.note), us:g.us, l1:g.l1 };
}
function choiceBlock(c){
  const d = describe(c.kind, c.i), order = optOrder(c.kind, c.i, c.store, c.key);
  const picked = c.store.picks[c.key], answered = picked !== undefined, correct = correctOf(c.kind, c.i);
  const opts = order.map((o, n) => {
    let cls = 'opt ' + d.cls(o), mk = '';
    if (answered && o === correct) { cls += ' right'; mk = '<span class="mk" aria-hidden="true">✓</span>'; }
    else if (answered && o === picked) { cls += ' wrong'; mk = '<span class="mk" aria-hidden="true">✗</span>'; }
    return `<button class="${cls}" data-act="pick" data-id="${o}" ${answered ? 'disabled' : ''}><span class="n" aria-hidden="true">${n + 1}</span>${d.label(o)}${mk}</button>`;
  }).join('');
  const ok = picked === correct;
  return { prompt:d.prompt, answered,
    opts:`<div class="opts ${d.layout}">${opts}</div>`,
    fb: answered ? feedbackHTML(ok, ok ? '✓ Correct!' : '✗ Not this time.', d.note, d.us, d.l1) : '' };
}
// The sentence around a diary gap, for Practise my mistakes
function gapContext(g){
  const idx = STORY.parts.indexOf(GAPS[g]);
  const b = String(STORY.parts[idx - 1] || ''), a = String(STORY.parts[idx + 1] || '');
  const cut = Math.max(b.lastIndexOf('. '), b.lastIndexOf('! '));
  const m = a.search(/[.!?]/);
  return { before: cut >= 0 ? b.slice(cut + 2) : b, after: m >= 0 ? a.slice(0, m + 1) : a };
}

/* --- one Build it sentence --- */
function buildBlock(c){
  buildEnsure(c);
  const st = c.store, it = BUILD[c.i], placed = st.placed[c.key], res = st.res[c.key], wrong = st.wrong && !res;
  const tile = (k, where) => `<button class="tile${c.highlight && k === it.g ? ' get' : ''}" data-act="${where}" data-id="${k}" ${res ? 'disabled' : ''}>${esc(it.t[k])}</button>`;
  const line = placed.length ? placed.map(k => tile(k, 'unplace')).join('') : '<span class="hint">Tap the words below…</span>';
  const pool = st.pool[c.key].filter(k => !placed.includes(k)).map(k => tile(k, 'place')).join('');
  const u = USES[it.u];
  let fb = '';
  if (res) fb = feedbackHTML(true, res === 'shown' ? 'Here is the answer.' : '✓ Correct!', `${u.icon} <b>${esc(u.pattern)}</b>: ${esc(u.gist)}`, it.us, it.l1);
  else if (wrong) fb = feedbackHTML(false, '✗ Not quite.', 'Tap a word to move it back, then try again.');
  return { res, full: placed.length === it.t.length, tried:(st.tries[c.key] || 0) > 0,
    html:`<div class="answer-line ${res ? 'ok' : wrong ? 'no' : ''}" aria-label="Your sentence">${line}</div><div class="pool" aria-label="Words to use">${pool}</div>${fb}` };
}
function buildBar(b, done, total){
  return { done, total, sec: (!b.res && b.tried) ? [{ act:'show', icon:'💡', label:'Show answer' }] : [],
    primary: b.res ? NEXT(false) : { act:'check', label:'Check ✓', disabled:!b.full } };
}

function endCard(score, total, id){
  const pct = total ? score / total : 0;
  const big = pct === 1 ? '🏆' : pct >= .7 ? '🌟' : '💪';
  const msg = pct === 1 ? 'Perfect score!' : pct >= .7 ? 'Well done!' : 'Good effort. Try it again to improve your score.';
  const left = pendingMistakes().filter(k => k.startsWith(id + ':')).length;
  return `<div class="card done"><div class="big" aria-hidden="true">${big}</div><h3>${score} / ${total}${id === 'build' ? ' right first time' : ''}</h3><p>${msg}</p>
    ${left ? `<p>You can try your ${left === 1 ? 'mistake' : left + ' mistakes'} again in <b>Practise my mistakes</b> on the menu.</p>` : ''}
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="again" data-id="${id}">↺ Do it again</button></div></div>`;
}

/* --- screens --- */
function renderHome(){
  setBar(null);
  const acts = TXT.acts.map((a, k) => {
    const p = progressOf(a.id);
    const prog = p.done === 0 ? 'Not started' : p.finished ? `✓ Finished · ${p.score} / ${p.total}${a.id === 'build' ? ' first time' : ' correct'}` : `In progress · ${p.done} / ${p.total}`;
    return `<button class="act" data-act="go" data-id="${a.id}">
      <span class="num" style="background:${ACT_COLOURS[k]}">${k + 1}</span>
      <h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p><span class="prog">${prog}</span></button>`;
  }).join('');
  const side = TXT.side.map(a => {
    let prog = '';
    if (a.id === 'story') { const p = progressOf('story'); prog = p.done === 0 ? 'Not started' : p.finished ? `✓ Finished · ${p.score} / ${p.total} correct` : `In progress · ${p.done} / ${p.total}`; }
    if (a.id === 'prac') { const n = pendingMistakes().length; prog = n ? `${n} ${n === 1 ? 'item' : 'items'} to practise` : 'Nothing to practise yet'; }
    return `<button class="act" data-act="go" data-id="${a.id}"><h3>${a.icon} ${esc(a.title)}</h3><p>${esc(a.desc)}</p>${prog ? `<span class="prog">${prog}</span>` : ''}</button>`;
  }).join('');
  const chips = USES.map(u => `<span class="chip ${u.id}">${u.icon} ${esc(u.short)}</span>`).join('');
  $('#home').innerHTML = `
    <div class="hero"><span class="lvl">B2.2 · Grammar</span>
      <h1 id="homeTitle"><span class="get">get</span>: one verb, five jobs</h1>
      <p>${esc(TXT.homeSub)}</p><p class="aim">🎯 ${esc(TXT.aim)}</p>
      <div class="chips" aria-label="The five uses">${chips}</div></div>
    <div class="grid">${acts}</div>
    <h2 class="section-title">Also in this app</h2>
    <div class="side">${side}</div>
    <div class="home-foot"><span>Your progress is saved on this device.</span>${resetBtn('all', 'Reset all progress', false)}</div>`;
}

function renderQuiz(){
  const id = S.screen, A = S[id], k = TXT.acts.findIndex(a => a.id === id);
  let body;
  if (A.i >= A.order.length) { body = endCard(quizScore(id), A.order.length, id); setBar({ done:A.order.length, total:A.order.length, primary:MENU }); }
  else {
    const b = choiceBlock(ctxChoice());
    body = `<div class="card">${b.prompt}${b.opts}${b.fb}</div>`;
    setBar({ done:Object.keys(A.picks).length, total:A.order.length, primary:NEXT(!b.answered) });
  }
  $('#quiz').innerHTML = topbar(`${k + 1} · ${TXT.acts[k].title}`, id) + `<p class="instr">${esc(TXT.instr[id])}</p>` + body;
}

function renderBuild(){
  const A = S.build;
  let body;
  if (A.i >= A.order.length) { body = endCard(buildScore(), BUILD.length, 'build'); setBar({ done:BUILD.length, total:BUILD.length, primary:MENU }); }
  else { const b = buildBlock(ctxBuild()); body = `<div class="card">${b.html}</div>`; setBar(buildBar(b, Object.keys(A.res).length, BUILD.length)); }
  $('#build').innerHTML = topbar('3 · Build it', 'build') + `<p class="instr">${esc(TXT.instr.build)}</p>` + body;
}

function renderStory(){
  const A = S.story, finished = A.i >= GAPS.length;
  let gi = 0, html = '<p>';
  STORY.parts.forEach(p => {
    if (typeof p === 'string') { html += p.startsWith('##') ? `</p><h3>${esc(p.slice(2))}</h3><p>` : esc(p); return; }
    const k = gi++, pk = A.picks[k];
    if (pk !== undefined) html += pk === p.a ? `<span class="gap ok">${esc(p.o[p.a])} <span aria-hidden="true">✓</span></span>`
      : `<span class="gap no"><s>${esc(p.o[pk])}</s> ${esc(p.o[p.a])} <span aria-hidden="true">✗</span></span>`;
    else if (k === A.i) html += `<span class="gap now" id="curGap">${k + 1}</span>`;
    else html += `<span class="gap todo" aria-label="gap ${k + 1}">${k + 1}</span>`;
  });
  html += '</p>';
  const text = `<div class="card story"><h2>${esc(STORY.title)}</h2><div class="story-box" id="storyBox" tabindex="0" aria-label="Diary text">${html}</div></div>`;
  let body;
  if (finished) { body = endCard(quizScore('story'), GAPS.length, 'story') + `<div style="margin-top:14px">${text}</div>`; setBar({ done:GAPS.length, total:GAPS.length, primary:MENU }); }
  else {
    const b = choiceBlock(ctxChoice());
    body = `<div class="story-wrap">${text}<div class="story-side"><p class="label">Gap ${A.i + 1} of ${GAPS.length}</p>${b.opts}${b.fb}</div></div>`;
    setBar({ done:Object.keys(A.picks).length, total:GAPS.length, primary:NEXT(!b.answered) });
  }
  $('#story').innerHTML = topbar('Review: Noor\'s diary', 'story') + `<p class="instr">${esc(TXT.instr.story)}</p>` + body;
  // Keep the current gap in view inside the scrolling text box (the page itself does not move).
  const cur = document.getElementById('curGap'), box = document.getElementById('storyBox');
  if (box) {
    if (cur) box.scrollTop = Math.max(0, cur.offsetTop - box.clientHeight / 3);
    else if (storyBoxTop != null) box.scrollTop = storyBoxTop;
    box.addEventListener('scroll', () => { storyBoxTop = box.scrollTop; }, { passive:true });
  }
}

function renderPrac(){
  const P = S.prac, pending = pendingMistakes();
  let body;
  if (P.queue.length && P.i < P.queue.length) {
    const { kind } = parseKey(P.queue[P.i]);
    const done = P.i + (kind === 'build' ? (P.res[P.queue[P.i]] ? 1 : 0) : (P.picks[P.queue[P.i]] !== undefined ? 1 : 0));
    if (kind === 'build') { const b = buildBlock(ctxBuild()); body = `<div class="card"><p class="from">${esc(TXT.from.build)}</p>${b.html}</div>`; setBar(buildBar(b, done, P.queue.length)); }
    else { const b = choiceBlock(ctxChoice()); body = `<div class="card"><p class="from">${esc(TXT.from[kind])}</p>${b.prompt}${b.opts}${b.fb}</div>`; setBar({ done, total:P.queue.length, primary:NEXT(!b.answered) }); }
  } else if (P.queue.length) {
    const fixedNow = P.queue.filter(k => P.fixed[k]).length;
    body = `<div class="card done"><div class="big" aria-hidden="true">${fixedNow === P.queue.length ? '🏆' : '💪'}</div><h3>${fixedNow} / ${P.queue.length} fixed</h3>
      <p>${pending.length ? `${pending.length} ${pending.length === 1 ? 'item is' : 'items are'} still waiting. Practise again, or come back later.` : 'You have fixed all your mistakes. Well done!'}</p></div>`;
    setBar({ done:P.queue.length, total:P.queue.length, primary: pending.length ? { act:'pracStart', label:'Practise again' } : MENU });
  } else if (pending.length) {
    body = `<div class="card done"><div class="big" aria-hidden="true">🔁</div><h3>${pending.length} ${pending.length === 1 ? 'item' : 'items'} to practise</h3>
      <p>They come from the activities and the diary. Tap Start when you are ready.</p></div>`;
    setBar({ done:0, total:pending.length, primary:{ act:'pracStart', label:'Start →' } });
  } else {
    body = `<div class="card done"><div class="big" aria-hidden="true">✨</div><h3>Nothing to practise yet</h3>
      <p>Do activities 1–3 or the diary first. Any item you get wrong will appear here.</p></div>`;
    setBar({ done:0, total:0, primary:MENU });
  }
  $('#prac').innerHTML = topbar('Practise my mistakes', 'prac') + `<p class="instr">${esc(TXT.instr.prac)}</p>` + body;
}

function renderSpeak(){
  const A = S.speak, c = SPEAK[A.order[A.i]], u = USES[c.u];
  $('#speak').innerHTML = topbar('Speaking cards', null) + `<p class="instr">${esc(TXT.instr.speak)}</p>
    <div class="speak-card ${u.id}"><span class="stripe" aria-hidden="true"></span>
      <p class="q">${esc(c.q)}</p><p class="f">${esc(c.f)}</p><span class="chip ${u.id}">${u.icon} ${esc(u.short)}</span></div>`;
  setBar({ done:A.i + 1, total:SPEAK.length, sec:[{ act:'speakPrev', icon:'←', label:'Back' }, { act:'speakShuffle', icon:'🔀', label:'Shuffle' }], primary:{ act:'speakNext', label:'Next →' } });
}

function renderGuide(){
  setBar(null);
  const uses = USES.map(u => `<div class="use ${u.id}"><span class="ic" aria-hidden="true">${u.icon}</span><h3>${esc(u.name)}</h3><p class="pat">${esc(u.pattern)}</p><p>${esc(u.explain)}<br><i>${hl(u.example)}</i></p></div>`).join('');
  $('#guide').innerHTML = topbar('The five uses of get', null) + `<div class="uses">${uses}</div>
    <div class="note"><h3>be or get?</h3>${GUIDE_NOTES.map(n => `<p>${esc(n)}</p>`).join('')}</div>
    <div class="note"><h3>🇬🇧 British and 🇺🇸 American English</h3>${GUIDE_US.map(n => `<p>${esc(n)}</p>`).join('')}</div>
    <div class="note"><h3>Spanish and Catalan speakers</h3>${GUIDE_L1.map(n => `<p>${esc(n)}</p>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="go" data-id="sort">Start activity 1 →</button></div>`;
}

// After an answer, make sure the feedback is visible above the bottom bar
function revealFeedback(){
  requestAnimationFrame(() => {
    const fb = document.querySelector('.screen.active .feedback'); if (!fb) return;
    const r = fb.getBoundingClientRect(), barH = $('#bar').hidden ? 0 : $('#bar').offsetHeight;
    if (r.bottom > innerHeight - barH || r.top < 0) fb.scrollIntoView({ block:'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  });
}

/* ================= saving ================= */
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} },
  clear(){ try { localStorage.removeItem(KEY); } catch(e){} },
};
function save(){ if (S) store.save(S); }
// Check a saved state before using it, and update saves from version 1.0. Anything that does not fit starts fresh.
function validState(d){
  try {
    if (!d || d.v !== 1) return false;
    const okOrder = (o, n) => Array.isArray(o) && o.length === n && new Set(o).size === n && o.every(x => Number.isInteger(x) && x >= 0 && x < n);
    const obj = x => x && typeof x === 'object' && !Array.isArray(x);
    if (!okOrder(d.sort.order, SORT.length) || !okOrder(d.state.order, STATE.length) || !okOrder(d.build.order, BUILD.length) || !okOrder(d.speak.order, SPEAK.length)) return false;
    for (const k of ['sort','state','story']) if (!obj(d[k].picks) || !Number.isInteger(d[k].i)) return false;
    if (!Number.isInteger(d.build.i) || !Number.isInteger(d.speak.i) || d.speak.i < 0 || d.speak.i >= SPEAK.length) return false;
    if (!obj(d.story.opt) || !GAPS.every((g, k) => okOrder(d.story.opt[k], g.o.length))) return false;
    if (!obj(d.state.opt)) d.state.opt = {};
    Object.keys(d.state.opt).forEach(k => { if (!STATE[k] || !okOrder(d.state.opt[k], STATE[k].o.length)) delete d.state.opt[k]; });
    const cleanBuild = (st, idxOf) => {
      for (const f of ['placed','pool','res','tries']) if (!obj(st[f])) st[f] = {};
      Object.keys(st.pool).forEach(k => { const n = BUILD[idxOf(k)]?.t.length; const pl = st.placed[k];
        if (!okOrder(st.pool[k], n) || !Array.isArray(pl) || !pl.every(x => Number.isInteger(x) && x >= 0 && x < n) || new Set(pl).size !== pl.length) { delete st.pool[k]; delete st.placed[k]; delete st.res[k]; } });
      st.wrong = !!st.wrong;
    };
    cleanBuild(d.build, k => +k);
    // Practise my mistakes (added in version 1.1)
    if (!obj(d.prac)) d.prac = freshPrac();
    const P = d.prac;
    const okKey = k => { const m = /^(sort|state|build|story):(\d+)$/.exec(k); if (!m) return false; return +m[2] < { sort:SORT.length, state:STATE.length, build:BUILD.length, story:GAPS.length }[m[1]]; };
    if (!obj(P.fixed)) P.fixed = {};
    Object.keys(P.fixed).forEach(k => { if (!okKey(k)) delete P.fixed[k]; });
    if (!Array.isArray(P.queue) || !P.queue.every(okKey) || !Number.isInteger(P.i) || P.i < 0) Object.assign(P, freshPracRound());
    for (const f of ['picks','opt']) if (!obj(P[f])) P[f] = {};
    Object.keys(P.opt).forEach(k => { const { kind, i } = parseKey(k); const n = kind === 'state' ? STATE[i]?.o.length : kind === 'story' ? GAPS[i]?.o.length : 0; if (!okKey(k) || !okOrder(P.opt[k], n)) delete P.opt[k]; });
    cleanBuild(P, k => parseKey(k).i);
    if (!SCREEN_OF[d.screen]) d.screen = 'home';
    return true;
  } catch(e){ return false; }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act !== 'reset') resetArm = null;
  let reveal = false, top = false;
  switch (act) {
    case 'go': go(id); return;
    case 'pick': reveal = pick(+id); break;
    case 'next': next(); top = true; break;
    case 'place': placeTile(+id); break;
    case 'unplace': unplaceTile(+id); break;
    case 'check': checkBuild(); reveal = true; break;
    case 'show': showBuild(); reveal = true; break;
    case 'pracStart': startPrac(); top = true; break;
    case 'speakNext': speakMove(1); break;
    case 'speakPrev': speakMove(-1); break;
    case 'speakShuffle': speakShuffle(); break;
    case 'again': resetAct(id); top = true; break;
    case 'reset':
      if (resetArm !== id) { resetArm = id; render(); clearTimeout(resetTimer); resetTimer = setTimeout(() => { resetArm = null; render(); }, 4000); return; }
      resetArm = null; clearTimeout(resetTimer);
      if (id === 'all') resetAll(); else resetAct(id);
      top = true; break;
  }
  render();
  if (top) window.scrollTo(0, 0);
  if (reveal) revealFeedback();
});
// Keyboard: 1–5 choose an answer, Enter = Next, arrows move through speaking cards
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^[1-9]$/.test(e.key)) { const o = document.querySelectorAll('.screen.active .opts .opt')[+e.key - 1]; if (o && !o.disabled) { o.click(); e.preventDefault(); } return; }
  if (e.key === 'Enter' && !(document.activeElement && document.activeElement.closest('button'))) { const p = $('#bar .primary'); if (p && !p.disabled && !$('#bar').hidden) { p.click(); e.preventDefault(); } return; }
  if (S.screen === 'speak' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { speakMove(e.key === 'ArrowRight' ? 1 : -1); render(); }
});

/* ================= start ================= */
(function init(){
  const saved = store.load();
  S = validState(saved) ? saved : freshState();
  go(S.screen);
})();
</script>
