<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Stylist · The Masquerade at Blackwood Manor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b1020; --night-2:#26172c; --night-3:#341f3b;
  --bone:#ede3d0; --bone-soft:#c9bba6;
  --gold:#e0b45a; --gold-deep:#b8862e;
  --moss:#8db36a; --moss-bg:#2d3b22;
  --wine:#7a2436; --no-bg:#3b1a24;
  --g-ink:#120a14;
  --display:"Cinzel", "Trajan Pro", "Times New Roman", serif;
  --fell:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --sans:"Instrument Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --r-lg:16px; --r-md:10px;
  --ease:cubic-bezier(.25,.46,.45,.94); --cine:cubic-bezier(.76,0,.24,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--bone);background:var(--night);font-size:17px;line-height:1.55;display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(224,180,90,.22),transparent 70%),radial-gradient(ellipse 80% 60% at 50% 110%,rgba(122,36,54,.35),transparent 70%),var(--night);
  animation:flicker 7s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}40%{opacity:.86}43%{opacity:.97}70%{opacity:.9}}
.fog{position:fixed;inset:auto -20% -10% -20%;height:45vh;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 30% 60%,rgba(237,227,208,.09),transparent 60%),radial-gradient(ellipse at 75% 70%,rgba(237,227,208,.07),transparent 55%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.cobweb{position:fixed;width:150px;height:150px;pointer-events:none;z-index:0;opacity:.28}
.cobweb.l{top:78px;left:0}
.cobweb.r{top:78px;right:0;transform:scaleX(-1)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

header.top{position:sticky;top:0;z-index:20;background:rgba(27,16,32,.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(224,180,90,.4)}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.hd h1{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.2vw,20px);letter-spacing:.06em;margin:0;line-height:1.2;color:var(--gold)}
.hd .sub{font-family:var(--fell);font-style:italic;color:var(--bone-soft);font-size:15px}
.hd .sp{margin-left:auto}
.steps{display:flex;gap:6px;max-width:1180px;margin:0 auto;padding:0 20px 10px}
.steps[hidden]{display:none}
.steps .pip{flex:1;border:0;background:transparent;padding:6px 0;min-height:18px}
.steps .pip::before{content:"";display:block;height:5px;border-radius:5px;background:rgba(237,227,208,.15);transition:background .2s}
.steps .pip.done::before,.steps .pip.seen::before{background:var(--gold-deep)}
.steps .pip.on::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.steps .pip:not([disabled]):hover::before{background:var(--gold)}
.steps .pip[disabled]{cursor:default}
.stepnav{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:0 0 20px;color:var(--bone-soft);font-size:15px}
.hintbox{margin:0 0 14px}
.hintbox[hidden]{display:none}
.hint-btn{padding:7px 16px;font-size:15px;border-style:dashed}
.hint{font-family:var(--fell);font-style:italic;font-size:18px;line-height:1.45;margin:0;padding:8px 14px;border-left:3px solid var(--gold-deep);background:rgba(224,180,90,.08);border-radius:0 var(--r-md) var(--r-md) 0;animation:rise .4s var(--ease)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(720px,100%);margin:64px auto 0}
.door{background:var(--night-2);border:1px solid rgba(224,180,90,.35);border-radius:var(--r-lg);padding:20px 22px;display:flex;flex-direction:column}
.door p{margin:0 0 14px}
.door .btn{margin-top:auto;align-self:flex-start}
.door-k{font-family:var(--display);font-weight:700;color:var(--gold);letter-spacing:.06em;font-size:18px}
.ghost-btn{border:1px solid rgba(224,180,90,.6);background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;color:var(--gold);transition:transform .12s}
.ghost-btn:active{transform:scale(.96)}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px 20px 40px;position:relative;z-index:1}
.screen{display:none}
.screen.on{display:block}
.screen.on .in{animation:rise .7s var(--ease) both}
.screen.on .in:nth-child(2){animation-delay:.12s}
.screen.on .in:nth-child(3){animation-delay:.24s}
.screen.on .in:nth-child(n+4){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,44px);line-height:1.12;margin:0 0 12px;letter-spacing:.02em;color:var(--bone);max-width:24ch}
h3{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--gold);margin:0 0 8px}
.lede{font-family:var(--fell);font-size:21px;line-height:1.5;max-width:60ch;margin:0 0 14px;color:var(--bone)}
.prose{max-width:64ch}
.prose p{margin:0 0 12px}

/* invitation */
.invite-wrap{display:grid;place-items:center;min-height:62vh}
.invite{position:relative;width:min(560px,100%);background:#efe4cc;color:#2a1a22;border-radius:6px;padding:40px 34px 34px;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px #b89a62 inset,0 0 0 8px #efe4cc inset,0 0 0 9px #b89a62 inset;text-align:center;transform:rotate(-1.2deg)}
.invite .small{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:#7a2436}
.invite h2{color:#2a1a22;margin:10px auto 6px;font-size:clamp(28px,5vw,40px)}
.invite .fell{font-family:var(--fell);font-size:20px;line-height:1.45;margin:0 0 6px}
.invite .date{font-family:var(--display);font-weight:700;letter-spacing:.08em;margin:16px 0 0}
.seal{position:absolute;bottom:-34px;right:34px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8344c,#6a1626 70%);box-shadow:0 6px 14px rgba(0,0,0,.5);display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#e8b8b8;font-size:30px;transform:rotate(12deg);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:rotate(12deg) scale(1)}50%{transform:rotate(12deg) scale(1.04)}}

/* panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.scene{background:var(--night-2);border:1px solid rgba(224,180,90,.35);border-radius:var(--r-lg);overflow:hidden;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene.flash::after{content:"";position:absolute;inset:0;background:#f3f0ff;opacity:0;animation:flash 2.4s .5s ease-out 1}
@keyframes flash{0%{opacity:0}4%{opacity:.85}9%{opacity:.1}13%{opacity:.6}30%{opacity:0}100%{opacity:0}}
.statement{font-family:var(--fell);font-size:19px;line-height:1.5;background:rgba(237,227,208,.06);border-left:3px solid var(--gold);padding:14px 16px;margin:16px 0 0;border-radius:0 var(--r-md) var(--r-md) 0}
.statement .who{display:block;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--gold);margin-bottom:4px;font-style:normal}
.task{background:var(--night-2);border:1px solid rgba(224,180,90,.35);border-radius:var(--r-lg);padding:22px}
.pos{font-size:14px;color:var(--bone-soft);font-weight:600;margin:0 0 6px}
.prompt{font-size:20px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{border:1px solid rgba(237,227,208,.45);background:var(--night-3);border-radius:var(--r-md);padding:14px 16px;font-weight:600;text-align:left;min-height:54px;transition:transform .12s var(--ease),border-color .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--moss-bg);border-color:var(--moss);color:#e4f0d8}
.opt.no{background:var(--no-bg);border-color:#7a4a56;text-decoration:line-through;opacity:.75}
.opt[disabled]{cursor:default}
.opts.row{grid-template-columns:repeat(3,1fr)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.fb{display:none;margin:14px 0 0;padding:12px 14px;border-radius:var(--r-md);font-size:16px}
.fb.show{display:block;animation:rise .4s var(--ease)}
.fb.ok{background:var(--moss-bg)}
.fb.ok strong{color:var(--moss)}
.fb.no{background:var(--no-bg)}
.fb .trl{display:block;margin-top:6px;font-size:14px;color:var(--bone-soft)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1px solid var(--gold);border-radius:999px;padding:12px 24px;font-weight:700;background:transparent;color:var(--gold);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--gold);color:#24131f;box-shadow:0 0 18px rgba(224,180,90,.35)}
.btn[hidden]{display:none}

/* gallery of guests */
.gallery-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 10px;flex-wrap:wrap}
.gallery-head p{margin:0;color:var(--bone-soft);font-size:15px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.guest{position:relative;background:linear-gradient(#2c1b31,#20132a);border-radius:10px;padding:10px 10px 12px;border:6px solid transparent;
  border-image:linear-gradient(135deg,#d8b064,#7a5a26 40%,#e7c47c 60%,#6e4f20) 1;transition:filter .9s var(--ease),opacity .9s var(--ease),transform .4s var(--ease)}
.guest .fig{height:170px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(224,180,90,.18),transparent 70%)}
.guest .fig svg{height:160px;width:auto}
.guest .nm{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;margin:6px 0 0;color:var(--bone)}
.guest .cos{font-family:var(--fell);font-style:italic;font-size:15px;color:var(--gold);margin:0}
.guest .wear{font-size:13.5px;color:var(--bone-soft);margin:6px 0 0;line-height:1.4}
.guest.out{filter:grayscale(1) brightness(.55);opacity:.75}
.guest .ruled{position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-6deg);background:var(--wine);color:var(--bone);font-weight:700;font-size:13px;padding:4px 10px;border-radius:4px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.5);display:none}
.guest.out .ruled{display:block;filter:none}
.guest.hl{transform:translateY(-4px);box-shadow:0 0 26px rgba(224,180,90,.35)}

/* alibi */
.letter{font-family:var(--fell);font-size:21px;line-height:1.7;background:#efe4cc;color:#2a1a22;border-radius:6px;padding:24px 26px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.letter .who{font-family:var(--display);font-size:14px;letter-spacing:.1em;color:#7a2436;display:block;margin-bottom:8px}
.gap{display:inline-block;min-width:110px;border-bottom:2px dashed #7a2436;text-align:center;padding:0 6px;line-height:1.3;color:#7a2436;font-family:var(--sans);font-weight:700;font-size:17px}
.gap.now{background:rgba(224,180,90,.45);border-radius:4px 4px 0 0}
.gap.done{border-bottom-style:solid;color:#2d5a2a}
.confirm{font-family:var(--fell);font-size:19px;margin-top:16px}

/* hotspots */
.eye{position:relative;max-width:360px;margin:0 auto}
.eye svg{width:100%;height:auto;display:block}
.hot{position:absolute;border:2px dashed rgba(224,180,90,.75);border-radius:14px;background:rgba(224,180,90,.06);animation:pulse 3.4s ease-in-out infinite}
.hot span{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:var(--night);border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.hot.ok{border-color:var(--moss);border-style:solid;background:rgba(141,179,106,.15);animation:none}
.hot.no{border-color:#7a4a56;opacity:.6;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,180,90,0)}50%{box-shadow:0 0 18px 2px rgba(224,180,90,.35)}}

/* builder */
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;padding:10px;border:1px dashed var(--bone-soft);border-radius:var(--r-md);background:rgba(237,227,208,.05);margin-bottom:12px}
.line .fixed{font-weight:700;padding:8px 4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.tiles:empty{display:none}
.tile{border:1px solid var(--gold);background:#3d2840;color:var(--bone);border-radius:999px;padding:9px 16px;font-weight:700;transition:transform .15s}
.tile:active{transform:scale(.94)}
.tile.placed{background:var(--gold);color:#24131f}

/* finale */
.unmask{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:center}
.stars{display:flex;gap:6px;margin:10px 0}
.stars svg{width:40px;height:40px}
.stars .s{opacity:0;transform:scale(.4) rotate(-20deg);animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.review{background:var(--night-2);border:1px solid var(--gold);border-radius:var(--r-lg);padding:22px;margin-top:20px}
.review blockquote{font-family:var(--fell);font-style:italic;font-size:22px;line-height:1.4;margin:6px 0 10px}
.review cite{font-style:normal;color:var(--bone-soft);font-size:15px}

.fig-l{position:relative;max-width:300px;width:100%;margin:0 auto}
.fig-l svg{width:100%;height:auto;display:block}
.brooch{position:absolute;left:14%;top:58%;width:26px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a5a6a,#0c0a10 70%);border:3px solid var(--gold);box-shadow:0 0 14px var(--gold);animation:glint 3s ease-in-out infinite}
.brooch::after{content:"";position:absolute;top:-6px;right:-8px;width:12px;height:12px;background:radial-gradient(circle,#fff 0 20%,transparent 60%);transform:rotate(45deg)}
@keyframes glint{0%,100%{box-shadow:0 0 8px var(--gold)}50%{box-shadow:0 0 24px var(--gold)}}
/* notes drawer */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--night-2);border-left:1px solid var(--gold);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px));animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sheet-head #trBtn{order:3;flex-basis:100%}
.sheet-head h3{margin:0}
.sheet-head .ghost-btn:last-child{margin-left:auto}
.vocab{list-style:none;padding:0;margin:0 0 20px}
.vocab li{padding:9px 0;border-bottom:1px solid rgba(237,227,208,.12)}
.vocab b{color:var(--bone);font-size:17px}
.vocab .ipa{color:var(--bone-soft);font-size:14px;margin-left:6px}
.vocab .tr{display:none;font-size:14px;color:var(--gold);margin-top:2px}
.show-tr .vocab .tr{display:block}
.vocab .nt{font-size:14px;color:var(--bone-soft);margin-top:2px}
.order-strip{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.order-strip span{border:1px solid var(--gold);border-radius:6px;padding:4px 8px;font-size:14px}
.order-strip span:last-child{background:var(--gold);color:#24131f;font-weight:700}

footer.bar{border-top:1px solid rgba(224,180,90,.35);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.credit{font-size:13px;color:var(--bone-soft)}
.bar-in .sp{margin-left:auto}
.bar-in{flex-wrap:wrap}
/* lightning stage */
.stage{position:relative;height:300px;border-radius:var(--r-md);background:#0d0812;border:1px solid rgba(224,180,90,.35);overflow:hidden;margin-bottom:16px}
.stage .win{position:absolute;left:50%;top:14px;bottom:14px;width:min(240px,70%);transform:translateX(-50%);background:#16122a;border:6px solid #3a2c3e;box-shadow:inset 0 0 0 2px #120a14}
.stage .win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#3a2c3e}
.stage .win::after{content:"";position:absolute;top:50%;left:0;right:0;height:5px;background:#3a2c3e}
.stage .who-fig{position:absolute;left:50%;top:22px;bottom:16px;transform:translateX(-50%);opacity:0;transition:opacity .15s}
.stage .who-fig svg{height:100%;width:auto}
.stage.lit .who-fig{opacity:1}
.stage.lit{background:#3c3a5c}
.stage.lit .win{background:#cfd2f2}
.stage.strike::after{content:"";position:absolute;inset:0;background:#f3f0ff;pointer-events:none;animation:flash 1.6s ease-out 1 forwards}
.stage-msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;margin:0;font-family:var(--fell);font-style:italic;color:var(--bone-soft);z-index:2}

/* ================= SOMETHING AT THE WINDOW ================= */
body.in-game .cobweb{opacity:.18}
.g-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:0 0 16px}
.g-head h2{margin:0}
.g-head .pos{margin:0}
.g-setup{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin:22px 0 0}
.g-field{background:var(--night-2);border:1px solid rgba(224,180,90,.3);border-radius:var(--r-lg);padding:16px 18px}
.g-lab{font-family:var(--display);font-weight:700;letter-spacing:.05em;color:var(--gold);margin:0 0 10px;font-size:16px}
.g-field p.note{margin:10px 0 0;font-size:15px;color:var(--bone-soft)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid rgba(237,227,208,.4);background:var(--night-3);border-radius:999px;padding:9px 16px;font-weight:600;transition:transform .12s,background .15s}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#24131f}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{font:inherit;color:var(--bone);background:var(--night-3);border:1px solid rgba(237,227,208,.35);border-radius:var(--r-md);padding:9px 12px;min-width:0}
.names input:focus{outline:2px solid var(--gold);outline-offset:1px}
.g-rules{margin:18px 0 0;max-width:72ch;color:var(--bone-soft)}
.g-start{margin-top:22px}

/* team strip */
.g-teams{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px;margin:0 0 16px}
.g-teams.n1{grid-template-columns:1fr!important}
.tcard{background:var(--night-2);border:1px solid rgba(237,227,208,.18);border-radius:var(--r-lg);padding:10px 14px;transition:border-color .3s,box-shadow .3s,transform .3s}
.tcard.now{border-color:var(--gold);box-shadow:0 0 20px rgba(224,180,90,.25);transform:translateY(-2px)}
.tcard .tn{font-family:var(--display);font-weight:700;letter-spacing:.03em;margin:0;display:flex;justify-content:space-between;gap:8px}
.tcard .tp{font-family:var(--sans);font-weight:700;color:var(--gold);white-space:nowrap}
.track{display:flex;gap:5px;margin:8px 0 4px}
.track i{flex:1;height:7px;border-radius:4px;background:rgba(237,227,208,.12);transition:background .5s}
.track i.on{background:linear-gradient(90deg,#b8862e,#a8344c)}
.track i.on:nth-child(4),.track i.on:nth-child(5){background:#a8344c;box-shadow:0 0 8px rgba(168,52,76,.8)}
.tcard .tw{margin:0;font-size:14px;color:var(--bone-soft)}

/* stage */
.g-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.g-stage{--sc:.36;--ty:-28%;--clip:6% 25% 22% 25%;position:relative;aspect-ratio:4/3.1;max-height:72vh;width:100%;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(#231626,#1a0f1d 72%,#140a12 72%,#0f0810);border:1px solid rgba(224,180,90,.3)}
.g-stage.d1{--sc:.5;--ty:-24%}
.g-stage.d2{--sc:.7;--ty:-22.5%}
.g-stage.d3{--sc:.97;--ty:0%;--clip:0 0 0 0}
.g-stage.d4{--sc:1.42;--ty:34%;--clip:0 0 0 0}
.g-stage.d4.lit,.g-stage.d4.shown{--sc:1;--ty:0%}
.g-stage.lit .g-fig svg{transition:filter .12s}
.g-view{position:absolute;inset:6% 25% 22% 25%;background:radial-gradient(circle at 72% 22%,#d8d4ea 0 5%,rgba(216,212,234,.15) 6%,transparent 18%),linear-gradient(#141030,#0c0a1c 62%,#0f1a12 62%,#0a120c);transition:filter .15s}
.g-view::after{content:"";position:absolute;left:0;right:0;bottom:38%;height:22%;background:radial-gradient(ellipse 18% 100% at 15% 100%,#070a08 60%,transparent 62%),radial-gradient(ellipse 14% 80% at 88% 100%,#070a08 60%,transparent 62%)}
.g-frame{position:absolute;inset:6% 25% 22% 25%;border:10px solid #3a2a34;box-shadow:inset 0 0 0 2px #120a14,0 0 0 2px #120a14;z-index:2;pointer-events:none}
.g-frame::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(237,227,208,.06) 36%,transparent 44%);pointer-events:none}
.g-sill{position:absolute;left:22%;right:22%;bottom:19%;height:3.4%;background:#4a3440;border-radius:3px;z-index:2;box-shadow:0 6px 10px rgba(0,0,0,.6)}
.g-fig{position:absolute;inset:0;z-index:1;clip-path:inset(var(--clip));transition:clip-path .9s var(--cine)}
.g-stage.d3 .g-fig,.g-stage.d4 .g-fig{z-index:3}
.g-fig svg{position:absolute;left:50%;bottom:0;height:100%;width:auto;transform-origin:50% 100%;transform:translateX(-50%) translateY(var(--ty)) scale(var(--sc));transition:transform .9s var(--cine),filter .18s,opacity .3s;filter:brightness(0);opacity:.6}
.g-stage.lit .g-fig svg,.g-stage.shown .g-fig svg{filter:none;opacity:1}
.g-stage.lit .g-view{filter:brightness(3.2) saturate(.3)}
.g-stage.lit{background:linear-gradient(#4a4466,#3a3452 72%,#2a2438 72%,#221c2c)}
.g-stage.d4:not(.lit):not(.shown) .g-fig svg{animation:loom 2.6s ease-in-out infinite}
@keyframes loom{0%,100%{transform:translateX(-50%) translateY(var(--ty)) scale(var(--sc))}50%{transform:translateX(-50%) translateY(var(--ty)) scale(calc(var(--sc) * 1.02))}}
.g-vig{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);transition:background .9s}
.g-stage.d3 .g-vig{background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(40,0,8,.75) 100%)}
.g-stage.d4 .g-vig{background:radial-gradient(ellipse at 50% 45%,transparent 22%,rgba(70,0,12,.9) 100%);animation:pulseVig 1.1s ease-in-out infinite}
@keyframes pulseVig{50%{opacity:.75}}
.g-stage.strike::after{content:"";position:absolute;inset:0;z-index:5;background:#f3f0ff;pointer-events:none;animation:flash 1.6s ease-out 1 forwards}
.g-stage.lurch .g-fig svg{transition-duration:.55s}
.g-where{margin:10px 2px 0;font-family:var(--fell);font-style:italic;color:var(--bone-soft);font-size:18px}

/* task */
.g-task h3{font-size:22px}
.tbar{height:8px;border-radius:5px;background:rgba(237,227,208,.12);overflow:hidden;margin:0 0 6px}
.tbar i{display:block;height:100%;width:100%;background:var(--gold-deep);transform-origin:left;transition:background .4s}
.tbar.low i{background:#a8344c}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--bone-soft);margin:0 0 14px;min-height:34px}
.trow .ghost-btn{padding:5px 12px;font-size:14px}
.g-hints{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.g-hints .btn{padding:8px 16px;font-size:15px;border-style:dashed}
.g-hints .btn[disabled]{opacity:.45;cursor:default}
.opt.gone{opacity:.28;text-decoration:line-through}
.opt .k{display:inline-block;min-width:1.6em;color:var(--bone-soft);font-weight:700}
.g-gain{display:inline-block;margin-left:6px;color:var(--gold);font-weight:700}

/* caught */
.caught{position:fixed;inset:0;z-index:80;background:#050205;display:grid;place-items:center;overflow:hidden}
.caught .c-face{position:absolute;inset:0;display:grid;place-items:center}
.caught .c-face svg{height:100vh;width:auto;transform-origin:50% 15%;animation:lunge .5s cubic-bezier(.5,0,.2,1.3) forwards}
@keyframes lunge{from{transform:scale(.9) translateY(10%)}to{transform:scale(3.1) translateY(14%)}}
.caught .c-red{position:absolute;inset:0;background:#8a0010;mix-blend-mode:multiply;opacity:0;animation:redflash 1.2s .35s ease-out forwards}
@keyframes redflash{0%{opacity:0}10%{opacity:.95}25%{opacity:.25}40%{opacity:.85}100%{opacity:.32}}
.caught.mild .c-red{animation-name:darkflash;background:#000;mix-blend-mode:normal}
@keyframes darkflash{0%{opacity:0}30%{opacity:.4}100%{opacity:.62}}
.caught .c-blood{position:absolute;inset:0}
.caught .c-blood svg{width:100%;height:100%;display:block}
.caught .spl{transform:scale(0);animation:splat .28s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes splat{to{transform:scale(1)}}
.caught .drip{transform:scaleY(0);transform-origin:top;animation:drip 2.4s ease-in forwards}
@keyframes drip{to{transform:scaleY(1)}}
.caught .c-text{position:relative;z-index:3;text-align:center;max-width:36rem;padding:24px;background:rgba(5,2,5,.72);border-radius:var(--r-lg);opacity:0;animation:rise .6s 1.5s var(--ease) forwards}
.caught .c-text h2{margin:0 auto 10px;max-width:none}
.caught .c-text .btn-row{justify-content:center}
body.jolt main{animation:jolt .45s .35s}
@keyframes jolt{0%,100%{transform:none}15%{transform:translate(-14px,8px) rotate(-1deg)}35%{transform:translate(12px,-10px) rotate(1deg)}55%{transform:translate(-8px,6px)}75%{transform:translate(5px,-3px)}}

/* end */
.g-end{position:relative;border-radius:var(--r-lg);overflow:hidden;padding:28px 24px 30px;background:#06040a;isolation:isolate}
.g-end .sky{position:absolute;inset:0;z-index:-1;background:linear-gradient(#06040a,#0c0814);transition:opacity 3.5s ease}
.g-end .sky.day{background:linear-gradient(#3a2a5a 0%,#a8506a 38%,#e89a5a 66%,#f4d08a 100%);opacity:0}
.g-end.dawn .sky.day{opacity:1}
.g-end .sun{position:absolute;left:50%;bottom:-160px;width:300px;height:300px;margin-left:-150px;border-radius:50%;z-index:-1;background:radial-gradient(circle,#fff4c8 0 30%,#f8d27a 45%,rgba(248,190,110,0) 70%);transition:transform 4s var(--ease);transform:translateY(120px)}
.g-end.dawn .sun{transform:translateY(-40px)}
.g-line{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 22px;min-height:150px}
.g-line .w{flex:0 0 auto;width:86px;height:140px;border:5px solid #2c1f30;background:#0c0a16;position:relative;overflow:hidden;transition:transform 2s var(--ease),opacity 2s}
.g-line .w svg{position:absolute;left:50%;bottom:-6px;height:126px;width:auto;transform:translateX(-50%);filter:brightness(0);opacity:.5;transition:filter .12s}
.g-end.lit .g-line .w{background:#c8ccec}
.g-end.lit .g-line .w svg{filter:none;opacity:1}
.g-end.dawn .g-line .w svg{filter:brightness(0);opacity:0;transform:translateX(-50%) translateY(40px);transition:opacity 2.4s,transform 2.4s,filter .4s}
.g-end.dawn .g-line .w{background:#f2c890;border-color:#5a3a30;opacity:.4;transition:opacity 3s,background 2s}
.g-end .night-msg{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:var(--fell);font-style:italic;font-size:24px;color:var(--bone-soft);transition:opacity 1.2s;margin:0}
.g-end.dawn .night-msg{opacity:0}
.g-end .late{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.g-end.dawn .late{opacity:1;transform:none}
.g-end.dawn .late.l2{transition-delay:.5s}
.g-end.dawn .late.l3{transition-delay:1s}
.g-end.dawn .late.l4{transition-delay:1.4s}
.g-end .btn:not(.main){background:rgba(27,16,32,.88)}
.g-end h2{color:#fff8ea;text-shadow:0 2px 18px rgba(60,20,30,.6);max-width:none}
.g-end .lede{color:#fff3dc;text-shadow:0 1px 8px rgba(40,10,20,.7)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0 0}
.pcard{background:rgba(27,16,32,.86);border:1px solid rgba(224,180,90,.4);border-radius:var(--r-lg);padding:14px 16px;position:relative}
.pcard.first{border:2px solid var(--gold);box-shadow:0 0 28px rgba(248,210,122,.55)}
.pcard .pl{font-family:var(--display);font-weight:900;font-size:30px;color:var(--gold);line-height:1;margin:0}
.pcard .pn{font-family:var(--display);font-weight:700;font-size:19px;margin:6px 0 2px}
.pcard .pp{font-weight:700;font-size:22px;margin:0 0 6px}
.pcard p{margin:0 0 4px;font-size:15px;color:var(--bone)}
.pcard .rib{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;background:var(--gold);color:#24131f;border-radius:999px;padding:3px 10px}
.g-review{margin-top:22px;background:rgba(27,16,32,.9);border:1px solid rgba(224,180,90,.4);border-radius:var(--r-lg);padding:18px}
.g-review[hidden]{display:none}
.rv{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.rv .rf svg{width:100%;height:auto;display:block}
.rv p{margin:0 0 6px}
.rv .ok{color:var(--moss)}
.rv .no{color:#e48a9a}
@media (max-width:900px){.g-grid{grid-template-columns:1fr}.g-setup{grid-template-columns:1fr}.g-teams{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.names{grid-template-columns:1fr}.g-line .w{width:64px;height:110px}.g-line .w svg{height:100px}.rv{grid-template-columns:80px 1fr}.g-teams{gap:8px}.tcard{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.caught .spl,.caught .drip{transform:none}.caught .c-text,.g-end .late{opacity:1;transform:none}}

@media (max-width:900px){
  .grid2,.unmask{grid-template-columns:1fr}

}

  body{font-size:16px}

  .doors{grid-template-columns:1fr;margin-top:56px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<svg class="cobweb l" viewBox="0 0 150 150" aria-hidden="true"><g fill="none" stroke="#ede3d0" stroke-width=".8"><path d="M0 0 L150 40 M0 0 L120 120 M0 0 L40 150 M0 0 L90 150 M0 0 L150 90"/><path d="M30 8 Q26 22 22 30 Q14 30 8 30 M60 16 Q52 44 44 60 Q26 58 16 60 M92 25 Q80 66 66 92 Q40 90 26 92 M124 33 Q106 90 90 124 Q56 122 34 124"/></g></svg>
<svg class="cobweb r" viewBox="0 0 150 150" aria-hidden="true"><g fill="none" stroke="#ede3d0" stroke-width=".8"><path d="M0 0 L150 40 M0 0 L120 120 M0 0 L40 150 M0 0 L90 150 M0 0 L150 90"/><path d="M30 8 Q26 22 22 30 Q14 30 8 30 M60 16 Q52 44 44 60 Q26 58 16 60 M92 25 Q80 66 66 92 Q40 90 26 92"/></g></svg>

<header class="top">
  <div class="hd"><h1 id="hdTitle">The Masquerade at Blackwood Manor</h1><span class="sub" id="hdSub">The Stylist · Halloween</span><span class="sp"></span><button class="ghost-btn" id="notesBtn">Wardrobe notes</button></div>
  <nav class="steps" id="steps" aria-label="Steps of the mystery"></nav>
</header>

<footer class="bar"><div class="bar-in"><span class="credit">Class of Coffee – with AI assistance</span><span class="sp"></span>
  <button class="ghost-btn" id="gameBtn">Play the game</button><button class="ghost-btn" id="restartBtn">Start again</button><button class="ghost-btn" id="soundBtn" aria-pressed="false">Sound off</button></div></footer>

  <div class="shade" data-close></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ---------- Garment drawing library (shared by the Stylist set) ---------- */
const G = (() => {
  let n = 0;
  const id = p => p + '_' + (++n);
  const INK = 'var(--g-ink, #2a2230)';

  function shade(hex, amt) {
    const h = hex.replace('#', '');
    let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* Returns {defs, fill} for a colour + pattern/texture */
  function paint(color, pattern, ink2) {
    const c = color || '#999999';
    const k = ink2 || shade(c, -0.45);
    const pid = id('p');
    let d = '';
    switch (pattern) {
      case 'stripes':
        d = `<pattern id="${pid}" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${c}"/><rect width="9" height="3.6" fill="${k}"/></pattern>`; break;
      case 'checks':
        d = `<pattern id="${pid}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${c}"/><rect width="7" height="14" fill="${k}" opacity=".45"/><rect width="14" height="7" fill="${k}" opacity=".45"/><rect x="10" width="1.2" height="14" fill="${shade(c, .6)}" opacity=".8"/><rect y="10" width="14" height="1.2" fill="${shade(c, .6)}" opacity=".8"/></pattern>`; break;
      case 'spots':
        d = `<pattern id="${pid}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${c}"/><circle cx="3" cy="3" r="2.1" fill="${k}"/><circle cx="9" cy="9" r="2.1" fill="${k}"/></pattern>`; break;
      case 'floral':
        d = `<pattern id="${pid}" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="${c}"/><g fill="${k}"><circle cx="5" cy="4" r="2"/><circle cx="8" cy="5.5" r="2"/><circle cx="5" cy="7.6" r="2"/><circle cx="2.2" cy="5.8" r="2"/></g><circle cx="5" cy="5.8" r="1.2" fill="#f2c94c"/><g fill="#3f7a4a"><ellipse cx="13" cy="13" rx="3" ry="1.4" transform="rotate(35 13 13)"/><ellipse cx="15" cy="16" rx="2.4" ry="1.1" transform="rotate(-25 15 16)"/></g></pattern>`; break;
      case 'lace':
        d = `<pattern id="${pid}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${c}"/><circle cx="5" cy="5" r="2.6" fill="none" stroke="${shade(c, .55)}" stroke-width="1"/><circle cx="0" cy="0" r="1.3" fill="${shade(c, .55)}"/><circle cx="10" cy="10" r="1.3" fill="${shade(c, .55)}"/><circle cx="10" cy="0" r="1.3" fill="${shade(c, .55)}"/><circle cx="0" cy="10" r="1.3" fill="${shade(c, .55)}"/></pattern>`; break;
      case 'knit':
        d = `<pattern id="${pid}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${c}"/><path d="M0 1 L2 4 L4 1 M4 1 L6 4 L8 1 M0 5 L2 8 L4 5 M4 5 L6 8 L8 5" fill="none" stroke="${shade(c, -0.25)}" stroke-width="1"/></pattern>`; break;
      case 'denim':
        d = `<pattern id="${pid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${c}"/><rect width="1.4" height="5" fill="${shade(c, .25)}" opacity=".7"/></pattern>`; break;
      case 'linen':
        d = `<pattern id="${pid}" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${c}"/><rect width="4" height=".7" fill="${shade(c, -0.12)}"/><rect width=".7" height="4" fill="${shade(c, -0.08)}"/></pattern>`; break;
      case 'suede':
        d = `<pattern id="${pid}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${c}"/><circle cx="1.5" cy="2" r=".6" fill="${shade(c, -0.2)}"/><circle cx="5" cy="1" r=".5" fill="${shade(c, .2)}"/><circle cx="4" cy="5" r=".6" fill="${shade(c, -0.2)}"/><circle cx="1" cy="6" r=".5" fill="${shade(c, .2)}"/></pattern>`; break;
      case 'fur':
        d = `<pattern id="${pid}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${c}"/><path d="M1 7 L2 2 M4 8 L5 3 M6 6 L7.5 1" stroke="${shade(c, .35)}" stroke-width=".9"/><path d="M3 6 L3.5 1" stroke="${shade(c, -0.3)}" stroke-width=".9"/></pattern>`; break;
      case 'bones':
        d = `<pattern id="${pid}" width="16" height="14" patternUnits="userSpaceOnUse"><rect width="16" height="14" fill="${c}"/><rect x="2" y="5" width="12" height="3.2" rx="1.6" fill="#efe6d2"/><circle cx="2.4" cy="5" r="1.6" fill="#efe6d2"/><circle cx="2.4" cy="8.2" r="1.6" fill="#efe6d2"/><circle cx="13.6" cy="5" r="1.6" fill="#efe6d2"/><circle cx="13.6" cy="8.2" r="1.6" fill="#efe6d2"/></pattern>`; break;
      case 'bandages':
        d = `<pattern id="${pid}" width="22" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-9)"><rect width="22" height="8" fill="${c}"/><rect width="22" height="1.3" fill="${shade(c, -0.28)}"/><rect x="9" y="1" width="1" height="7" fill="${shade(c, -0.18)}"/><rect y="4" width="22" height=".6" fill="${shade(c, .2)}"/></pattern>`; break;
      case 'velvet': case 'silk': case 'leather': case 'lycra': {
        const hi = pattern === 'velvet' ? shade(c, .32) : pattern === 'silk' ? shade(c, .5) : pattern === 'leather' ? shade(c, .42) : shade(c, .38);
        const lo = shade(c, pattern === 'velvet' ? -0.45 : -0.2);
        d = `<linearGradient id="${pid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${lo}"/><stop offset=".38" stop-color="${c}"/><stop offset=".5" stop-color="${hi}"/><stop offset=".62" stop-color="${c}"/><stop offset="1" stop-color="${lo}"/></linearGradient>`; break;
      }
      default:
        return { defs: '', fill: c };
    }
    return { defs: d, fill: `url(#${pid})` };
  }

  const S = `stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;
  const mirror = inner => `<g transform="translate(120 0) scale(-1 1)">${inner}</g>`;

  /* A top: T-shirt, jumper, hoodie, tank, shirt */
  function topShapes(o, fill) {
    const fit = o.fit || 'regular';
    const s = fit === 'tight' ? 19 : fit === 'loose' ? 29 : 24;
    const h = fit === 'tight' ? 17 : fit === 'loose' ? 33 : 25;
    const nw = 9, L = 60 - s;
    let out = '';
    // hood behind
    if (o.neck === 'hood') out += `<path d="M44 26 Q36 -4 60 -2 Q84 -4 76 26 Z" fill="${fill}" ${S}/>`;
    // sleeves
    let sl = '';
    if (o.sleeve === 'short') sl = `<path d="M${L} 22 L${L - 17} 42 L${L - 8} 51 L${L + 1} 43 Z" fill="${fill}" ${S}/>`;
    if (o.sleeve === 'long') {
      const w = fit === 'tight' ? 8 : 11;
      sl = `<path d="M${L} 22 Q${L - 11} 48 ${L - 12} 98 L${L - 12 + w} 99 Q${L - 2} 62 ${L + 1} 44 Z" fill="${fill}" ${S}/>`;
      if (o.cuffs) sl += `<path d="M${L - 12} 92 L${L - 12 + w} 93" stroke="${INK}" stroke-width="1.2"/>`;
    }
    out += sl + mirror(sl);
    // body
    let neckline;
    if (o.neck === 'v') neckline = `L68 14 L60 ${o.deepV ? 46 : 34} Z`;
    else if (o.neck === 'scoop') neckline = `L68 14 Q60 34 52 14 Z`;
    else neckline = `L69 14 Q60 25 51 14 Z`;
    let body;
    if (o.sleeve === 'none') {
      const so = o.straps ? 45 : L + 5;
      const nl = o.neck === 'scoop' ? `Q60 34 69 14` : o.neck === 'v' ? `L60 34 L69 14` : `Q60 25 69 14`;
      body = `M${so} 13 L51 14 ${nl} L${120 - so} 13 Q${120 - L - 8} 30 ${120 - L + 1} 46 L${60 + h} 108 L${60 - h} 108 L${L - 1} 46 Q${L + 8} 30 ${so} 13 Z`;
    } else {
      body = `M51 14 L${L} 22 L${L + 1} 46 L${60 - h} 108 L${60 + h} 108 L${120 - L - 1} 46 L${120 - L} 22 L69 14 ` + (o.neck === 'v' ? `L60 ${o.deepV ? 46 : 34} Z` : o.neck === 'scoop' ? `Q60 34 51 14 Z` : `Q60 25 51 14 Z`);
    }
    out += `<path d="${body}" fill="${fill}" ${S}/>`;
    if (o.lacehem) {
      let p = `M${60 - h} 108`;
      for (let x = 60 - h; x < 60 + h; x += 6) p += ` q3 6 6 0`;
      out += `<path d="${p}" fill="${fill}" ${S}/>`;
    }

try { st = JSON.parse(localStorage.getItem(PKEY)); } catch (e) {}
if (!st || typeof st.step !== 'number' || !st.subs) st = freshState();
st.sub = {}; st.out = st.out || {}; st.outAt = st.outAt || {}; st.hints = st.hints || {}; st.max = Math.max(st.max || 0, st.step);
try { Object.assign(prefs, JSON.parse(localStorage.getItem('theStylist.blackwood.prefs')) || {}); } catch (e) {}
function savePrefs() { try { localStorage.setItem('theStylist.blackwood.prefs', JSON.stringify(prefs)); } catch (e) {} }

function gallery(highlight) {
  return `<div class="gallery-head in"><h3>The guests</h3><p>Everyone came in costume. Use the clues to rule guests out.</p></div>
  <div class="gallery in">${GUESTS.map(g => `<article class="guest${isOut(g.id) ? ' out' : ''}${highlight && highlight.includes(g.id) ? ' hl' : ''}" data-g="${g.id}">
    <span class="ruled">Ruled out: ${esc(isOut(g.id) ? st.out[g.id] : '')}</span>
    <div class="fig">${figure(g.g, { label: g.name + ' as ' + g.cos })}</div>
    <p class="nm">${esc(g.name)}</p><p class="cos">${esc(g.cos)}</p><p class="wear">Wearing ${esc(g.wear)}</p></article>`).join('')}</div>`;
}
function isOut(id) { return !!st.out[id] && (st.outAt[id] || 0) <= st.step; }
function ruleOut(map) {
  Object.entries(map).forEach(([id, why], i) => {
    st.out[id] = why; st.outAt[id] = st.step; save();
    setTimeout(() => {
      const el = document.querySelector(`.guest[data-g="${id}"]`);
      if (el) { el.querySelector('.ruled').textContent = 'Ruled out: ' + why; el.classList.add('out'); }
    }, 500 + i * 260);
  });
}

/* ================= SCREENS ================= */
const STEPS = ['invite', 'theft', 'clue0', 'clue1', 'clue2', 'alibiF', 'alibiE', 'eye', 'report', 'finale'];
const STEP_NAMES = ['The invitation', 'Midnight in the library', 'Clue 1: the broken case', 'Clue 2: the flowerbed', 'Clue 3: the flash of lightning', 'Inés Navarro’s alibi', 'Sasha Petrov’s alibi', 'The stylist’s eye', 'The report', 'Case closed'];
const main = $('#main');

function render() {
  if (mode === 'game') { renderGame(); return; }
  st.step = Math.min(st.step, STEPS.length - 1); st.max = Math.min(Math.max(st.max, st.step), STEPS.length - 1);
  const s = STEPS[st.step];
  st.sub = st.subs[s] = st.subs[s] || {};
  document.body.classList.remove('in-game');
  $('#steps').hidden = false;
  $('#hdTitle').textContent = 'The Masquerade at Blackwood Manor'; $('#hdSub').textContent = 'The Stylist · Halloween'; $('#gameBtn').textContent = 'Play the game';
  $('#steps').innerHTML = STEPS.map((x, i) => `<button class="pip${i < st.step ? ' done' : i === st.step ? ' on' : i <= st.max ? ' seen' : ''}" data-step="${i}" ${i > st.max ? 'disabled' : ''} aria-label="${esc(STEP_NAMES[i])}${i === st.step ? ', this step' : i > st.max ? ', not reached yet' : ''}" title="${esc(STEP_NAMES[i])}"></button>`).join('');
  const nav = st.step > 0 ? `<div class="stepnav"><button class="ghost-btn" id="backBtn">Back</button><span>Step ${st.step + 1} of ${STEPS.length}: ${esc(STEP_NAMES[st.step])}</span></div>` : '';
  main.innerHTML = `${nav}<section class="screen on">${VIEWS[s.replace(/\d$/, '').replace(/[FE]$/, '')](s)}</section>`;
  if ($('#backBtn')) $('#backBtn').onclick = () => go(st.step - 1);
  $('#gameBtn').hidden = s === 'invite' || s === 'finale';
  window.scrollTo({ top: 0 });
  const rb = $('#restartBtn'); if (rb) rb.hidden = st.step === 0 || s === 'finale';
  HOOKS[s] && HOOKS[s]();
}
function go(i) { if (i < 0 || i > st.max) return; st.step = i; save(); render(); }
function next() { st.step++; st.max = Math.max(st.max, st.step); save(); render(); }
$('#steps').addEventListener('click', e => { const b = e.target.closest('.pip'); if (b && !b.disabled) go(+b.dataset.step); });

  return `<svg viewBox="0 0 400 260" aria-label="A dark figure at a window, lit by lightning"><rect width="400" height="260" fill="#120a18"/>

   <path d="M240 12 L222 70 L240 70 L214 130" fill="none" stroke="#f3f0ff" stroke-width="3"/>
   ${(() => { const f = figure(g, { silhouette: true, showTop: true, capeBack: true, inner: true }); return `<defs>${f.defs}</defs><g transform="translate(137 26) scale(1.05)">${f.body}</g>`; })()}</svg>`;

const HOOKS = {
 invite: () => { $('#go').onclick = () => { audio(); sfx('creak'); next(); }; $('#playGame').onclick = () => openGame(); },
 theft: () => { if (!st.sub.heard) { st.sub.heard = true; save(); sfx('midnight'); } $('#go').onclick = next; },
 clue0: () => clueHook(0), clue1: () => clueHook(1), clue2: () => clueHook(2),
 alibiF: () => alibiHook(0), alibiE: () => alibiHook(1),

function markOk(b, opts) { b.classList.add('ok'); opts.querySelectorAll('.opt').forEach(o => o.disabled = true); }
function wrongShake(b) { b.classList.add('no'); b.disabled = true; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

function clueHook(n) {
  const c = CLUES[n], opts = $('#opts'), fb = $('#fb');
  opts.innerHTML = shuffle(c.opts.map((o, i) => i)).map(i => `<button class="opt" data-i="${i}">${esc(c.opts[i][0])}</button>`).join('');
 
  if (c.scene === 'lightning') { setTimeout(() => sfx('thunder'), 550); }
  hintUI($('.task'), 'clue' + n, HINTS.clue[n]);
  function solved(restoring) {
    markOk(opts.querySelector('.opt[data-i="0"]'), opts);
    const k = Object.keys(c.out).length;
    fb.className = 'fb ok show';
    fb.innerHTML = `<strong>${esc(c.opts[0][1].split('. ')[0])}.</strong> ${esc(c.opts[0][1].split('. ').slice(1).join('. '))} ${k === 1 ? 'One more guest can be ruled out.' : ['', 'One', 'Two', 'Three', 'Four', 'Five'][k] + ' guests can be ruled out.'}<span class="trl">${esc(c.tr)}</span>`;
    if (!restoring) ruleOut(c.out);
    hideHint($('.task'));
    $('#go').hidden = false; $('#go').onclick = next;
   
  }
  if (st.sub.solved) { solved(true); return; }
  opts.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i === 0) { st.sub.solved = true; save(); solved(false); }
    else { st.wrong++; save(); wrongShake(b); fb.className = 'fb no show'; fb.innerHTML = `<strong>Not this one.</strong> ${esc(c.opts[i][1])}`; }
  };
}

function alibiHook(n) {
  const a = ALIBIS[n];
  st.sub.gi = st.sub.gi || 0; st.sub.filled = st.sub.filled || [];
  const filled = st.sub.filled;
  const letter = $('#letter'), opts = $('#opts'), fb = $('#fb');
  function drawLetter() {
    const gi = st.sub.gi;
    letter.innerHTML = `<span class="who">${esc(a.who)}</span>` + a.parts.map(p => typeof p === 'number'
      ? `<span class="gap${p === gi && filled[p] == null ? ' now' : ''}${filled[p] != null ? ' done' : ''}">${filled[p] != null ? esc(a.gaps[p].opts[filled[p]]) : '&nbsp;' + (p + 1) + '&nbsp;'}</span>`
      : esc(p)).join('');
  }
  function drawOpts() {
    const g = a.gaps[st.sub.gi];
    $('#gapPrompt').textContent = `Choose the word for gap ${st.sub.gi + 1} of ${a.gaps.length}.`;
    opts.className = 'opts row';
    opts.innerHTML = shuffle(g.opts.map((o, i) => i)).map(i => `<button class="opt" data-i="${i}">${esc(g.opts[i])}</button>`).join('');
    hintUI($('.task'), 'alibi' + n + '-' + st.sub.gi, HINTS.alibi[n][st.sub.gi]);
   
  }
  function complete() {
    $('#gapPrompt').textContent = 'The alibi is complete.';
    opts.innerHTML = ''; const hb = $('.task .hintbox'); if (hb) hb.hidden = true;
    if (a.confirm) {
      $('#confirm').innerHTML = `<p class="statement"><span class="who">${esc(a.confirm.who)}</span>${esc(a.confirm.say)}</p>`;
      if (!st.out[a.id]) { ruleOut({ [a.id]: a.out }); save(); }
    } else {
      $('#confirm').innerHTML = `<p class="statement"><span class="who">Inspector Adaeze Grey</span>Nobody can confirm Sasha’s story. Sasha says they did not leave the ballroom, so take a close look at that costume.</p>`;
    }
   
    $('#go').hidden = false; $('#go').onclick = next;
  }
  opts.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return;
    const g = a.gaps[st.sub.gi], i = +b.dataset.i;
    if (i === g.a) {
      filled[st.sub.gi] = i; markOk(b, opts); hideHint($('.task'));
      fb.className = 'fb ok show'; fb.innerHTML = `<strong>Correct.</strong> ${esc(g.fb[i].replace(/^Correct\. /, ''))}`;
      st.sub.gi++; save(); drawLetter();
      if (st.sub.gi < a.gaps.length) {
        const nb = document.createElement('div'); nb.className = 'btn-row';
        nb.innerHTML = `<button class="btn" id="nextGap">Next gap</button>`; fb.appendChild(nb);
        $('#nextGap').onclick = () => { fb.className = 'fb'; drawLetter(); drawOpts(); };
       
      } else complete();
    } else {
      st.wrong++; save(); wrongShake(b);
      fb.className = 'fb no show'; fb.innerHTML = `<strong>Not this one.</strong> ${esc(g.fb[i])}`;
    }
  };
  drawLetter();
  if (st.sub.gi >= a.gaps.length) complete(); else drawOpts();
}

function eyeHook() {
  const eye = $('#eye'), fb = $('#fb');
  hintUI($('.task'), 'eye', HINTS.eye);
 
  function solved(b) {
    b.classList.add('ok'); eye.querySelectorAll('.hot').forEach(x => x.disabled = true);
    const h = HOTSPOTS.find(x => x.ok);
    fb.className = 'fb ok show'; fb.innerHTML = `<strong>Correct.</strong> ${esc(h.fb.replace(/^Correct\. /, ''))}<span class="trl">Català: L’ant es taca amb l’aigua. Español: El ante se mancha con el agua.</span>`;
    $('#go').hidden = false; $('#go').onclick = next; hideHint($('.task'));
  }
  HOTSPOTS.forEach(h => {
    const b = document.createElement('button');
    b.className = 'hot'; b.style.left = h.box[0] + '%'; b.style.top = h.box[1] + '%'; b.style.width = h.box[2] + '%'; b.style.height = h.box[3] + '%';
    b.setAttribute('aria-label', h.label); b.innerHTML = `<span>${h.label}</span>`;
    b.onclick = () => {
      if (b.disabled) return;
      if (h.ok) { st.sub.solved = true; save(); solved(b); }
      else { st.wrong++; save(); b.classList.add('no'); b.disabled = true; fb.className = 'fb no show'; fb.innerHTML = `<strong>Not this one.</strong> ${esc(h.fb)}`; }
    };
    eye.appendChild(b);
    if (h.ok && st.sub.solved) setTimeout(() => solved(b));
  });
}

const HINTBOX = `<div class="hintbox"><button class="btn hint-btn" type="button">Show a hint</button><p class="hint" hidden></p></div>`;
const HINTS = {
 clue: [
  'Read again what happens when the inspector strokes the threads one way and then the other. Only one of these materials changes like that.',
  'Nell says that the boots did not shine at all and that they looked like the skin of a peach. Think about which material is soft, slightly rough and never shiny.',
  'There are two things to check. Celia could see the thief’s bare arms, and the lines on the top went in only one direction.'],
 alibi: [[
  'The word after the gap is as, and Inés is talking about a character from a musical.',
  'Inés wanted to take off her wet clothes and put on dry ones.',
  'The problem with the dressing gown was that it was enormous. Which verb is about size?',
  'Mr Pryce was putting the wet cape somewhere so that it could dry.'], [
  'The words after the gap are a moth costume, so you need a verb that takes clothes as its object.',
  'People were talking about how good the colour looked on Sasha.',
  'The bow tie and the cape are exactly the same purple.',
  'Sasha is talking about two different pieces of clothing and whether they look good together.']],
 eye: 'Sasha says they have not been outside, but it was raining and the flowerbed under the window was wet. Look for the detail that water and soil would mark.',
};
function reportHint(item) {
  const kinds = item.words.map(w => CAT_WORD[w[1]]);
  return `Here you have ${kinds.slice(0, -1).join(', ')} and ${kinds[kinds.length - 1]}. Open the Wardrobe notes and check the order strip before you place them.`;
}
function hintCount() { return Object.keys(st.hints).length; }
function hintUI(host, key, text) {
  const box = host && host.querySelector('.hintbox'); if (!box) return;
  const b = box.querySelector('.hint-btn'), p = box.querySelector('.hint');
  box.hidden = false; p.textContent = text;
  const reveal = () => { p.hidden = false; b.hidden = true; };
  if (st.hints[key]) reveal(); else { p.hidden = true; b.hidden = false; }
  b.onclick = () => { st.hints[key] = true; save(); reveal(); sfx('hint'); };
}
function hideHint(host) { const b = host && host.querySelector('.hint-btn'); if (b) b.hidden = true; }

/* Builder with optional distractor words (item.extra) */
function builder(host, item, onDone, onFlash) {
  const all = item.words.map(w => ({ w: w[0], c: w[1], d: false })).concat((item.extra || []).map(w => ({ w: w[0], c: w[1], d: true })));
  const need = item.words.length;
  const placed = [], pool = shuffle(all.map((w, i) => i));
  let solved = false;
  host.innerHTML = `<div class="line"></div><div class="tiles"></div><div class="fb" role="status"></div><div class="btn-row"><button class="btn main chk" hidden>Check the description</button>${onFlash ? '<button class="btn flash-again">Flash again</button>' : ''}</div>`;
  const line = $('.line', host), tiles = $('.tiles', host), fb = $('.fb', host), chk = $('.chk', host);
  function draw() {
    line.innerHTML = `<span class="fixed">${item.plural ? '' : 'a'}</span>` + placed.map(i => `<button class="tile placed" data-i="${i}" ${solved ? 'disabled' : ''}>${esc(all[i].w)}</button>`).join('') + `<span class="fixed">${esc(item.noun)}</span>`;
    tiles.innerHTML = solved ? '' : pool.filter(i => !placed.includes(i)).map(i => `<button class="tile" data-i="${i}">${esc(all[i].w)}</button>`).join('');
    chk.hidden = solved || placed.length !== need;
    const fa = $('.flash-again', host); if (fa) fa.hidden = solved;
  }
  host.onclick = e => {
    if (solved) return;
    if (e.target.closest('.flash-again')) { onFlash(); return; }
    const t = e.target.closest('.tile'); if (!t) return;
    const i = +t.dataset.i;
    if (t.classList.contains('placed')) placed.splice(placed.indexOf(i), 1);
    else if (placed.length < need) placed.push(i);
    fb.className = 'fb'; draw();
  };
  function shake() { line.classList.remove('shake'); void line.offsetWidth; line.classList.add('shake'); }
  function win() {
    solved = true; draw();
    const o = item.words.slice().sort((x, y) => CATS.indexOf(x[1]) - CATS.indexOf(y[1])).map(w => CAT_NAMES[w[1]]);
    fb.className = 'fb ok show';
    fb.innerHTML = `<strong>Correct.</strong> The order is ${o.length > 1 ? o.slice(0, -1).join(', ') + ' and ' + o[o.length - 1] : o[0]}, and then the noun.`;
  }
  chk.onclick = () => {
    const bad = placed.filter(i => all[i].d).length;
    if (bad) {
      st.wrong++; save();
      fb.className = 'fb no show';
      fb.innerHTML = `<strong>Not correct yet.</strong> ${bad === 1 ? 'One of these words does' : 'Two of these words do'} not describe ${esc(item.about)}. Change the words${onFlash ? ', or tap Flash again to look once more' : ''}.`;
      shake(); return;
    }
    const cats = placed.map(i => all[i].c); let k = -1;
    for (let j = 0; j < cats.length - 1; j++) if (CATS.indexOf(cats[j]) > CATS.indexOf(cats[j + 1])) { k = j; break; }
    if (k < 0) { win(); onDone(); return; }
    st.wrong++; save();
    const a = all[placed[k]], b = all[placed[k + 1]];
    fb.className = 'fb no show';
    fb.innerHTML = `<strong>Not correct yet.</strong> <i>${esc(b.w)}</i> is ${CAT_WORD[b.c]}, and <i>${esc(a.w)}</i> is ${CAT_WORD[a.c]}. ${CAT_PL[b.c]} come before ${CAT_PL[a.c].toLowerCase()}. Tap a word in the description to move it.`;
    shake();
  };
  draw();

const WHERE = ['at the bottom of the garden', 'on the lawn', 'at the window', 'in the room', 'right behind you'];
const NUMW = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];

function phrase(words, noun, pl) { const t = words.join(' ') + ' ' + noun; return pl ? t : (/^[aeiou]/i.test(t) ? 'an ' : 'a ') + t; }
function buildOpts(q) {
  const base = q.w.map(x => x[0]);
  const opts = [{ t: phrase(base, q.n, q.pl), ok: true }];
  q.mem.forEach(([i, wd, why]) => { const ws = base.slice(); ws[i] = wd; opts.push({ t: phrase(ws, q.n, q.pl), why }); });
  const pairs = []; for (let j = 0; j < q.w.length - 1; j++) if (q.w[j][1] !== q.w[j + 1][1]) pairs.push(j);
  const j = pairs[Math.floor(Math.random() * pairs.length)];
  const ws = base.slice(); [ws[j], ws[j + 1]] = [ws[j + 1], ws[j]];
  const a = q.w[j], b = q.w[j + 1];
  opts.push({ t: phrase(ws, q.n, q.pl), order: true, why: `The words are right, but the order is not. ${CAT_PL[a[1]]} come before ${CAT_PL[b[1]].toLowerCase()}, so <i>${esc(a[0])}</i> goes before <i>${esc(b[0])}</i>.` });
  return shuffle(opts);
}
function orderNote(q) { const o = q.w.map(x => CAT_NAMES[x[1]]); return `The order is ${o.length > 1 ? o.slice(0, -1).join(', ') + ' and ' + o[o.length - 1] : o[0]}, and then the noun.`; }

let gm = null;
const gcfg = { teams: 2, len: 6, time: 60, fright: 'full', names: ['Team 1', 'Team 2', 'Team 3', 'Team 4'] };

function openGame() { mode = 'game'; stopHeart(); gm = { screen: 'setup' }; render(); }
function leaveGame() { mode = 'story'; stopHeart(); stopTimer(); gm = null; render(); }

function makeQueue(total) {
  let pool = shuffle(QUESTIONS.map((q, i) => i)); const out = []; let last = null;
  while (out.length < total && pool.length) {
    let k = pool.findIndex(i => QUESTIONS[i].c !== last); if (k < 0) k = 0;
    const i = pool.splice(k, 1)[0]; out.push(i); last = QUESTIONS[i].c;
  }
  return out;
}
function startGame() {
  const n = gcfg.teams;
  gm = { screen: 'turn', turn: 0, total: n * gcfg.len, queue: makeQueue(n * gcfg.len), log: [],
    teams: gcfg.names.slice(0, n).map((nm, i) => ({ name: (nm || '').trim() || 'Team ' + (i + 1), pts: 0, dist: 0, right: 0, hints: 0, caughtBy: [] })) };
  gm.phase = 'ready';
  render();
}
const curTeam = () => gm.teams[gm.turn % gm.teams.length];
const curQ = () => QUESTIONS[gm.queue[gm.turn]];

function renderGame() {
  document.body.classList.add('in-game');
  $('#steps').hidden = true;
  $('#hdTitle').textContent = 'Something at the Window'; $('#hdSub').textContent = 'Blackwood Manor · Halloween game';
  $('#gameBtn').textContent = 'Back to the mystery'; $('#gameBtn').hidden = false; $('#restartBtn').hidden = true;
  window.scrollTo({ top: 0 });
  if (gm.screen === 'setup') return setupScreen();
  if (gm.screen === 'turn') return turnScreen();
  if (gm.screen === 'end') return endScreen();
}

/* ---------- set-up ---------- */
function nameInputs() { return Array.from({ length: gcfg.teams }, (_, i) => `<input type="text" maxlength="18" data-i="${i}" value="${esc(gcfg.names[i])}" aria-label="Name of team ${i + 1}">`).join(''); }
function bindNames() { main.querySelectorAll('.names input').forEach(inp => inp.oninput = () => { gcfg.names[+inp.dataset.i] = inp.value; }); }
function setupScreen() {
  stopHeart();
  const seg = (key, list) => `<div class="seg" data-key="${key}">${list.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${gcfg[key] == v}">${l}</button>`).join('')}</div>`;
  main.innerHTML = `<section class="screen on">

   <p class="lede in">It is Halloween night at Blackwood Manor, and the storm has cut the electricity again. Every time the lightning flashes, you will see a creature at the window for a few seconds. Remember what it is wearing, and then choose the right description. Every wrong answer brings the creature one step closer. If it reaches your team, it gets you, and you lose five points.</p>
   <div class="g-setup in">
    <div class="g-field"><p class="g-lab">Number of teams</p>${seg('teams', [[1, 'One'], [2, 'Two'], [3, 'Three'], [4, 'Four']])}</div>

    <div class="g-field"><p class="g-lab">Time to answer</p>${seg('time', [[60, 'One minute'], [90, 'A minute and a half'], [0, 'No timer']])}<p class="note">When the time runs out, the creature comes one step closer. You can pause the timer at any moment.</p></div>
    <div class="g-field"><p class="g-lab">When a creature gets a team</p>${seg('fright', [['full', 'Blood on the screen'], ['mild', 'No blood']])}</div>
    <div class="g-field"><p class="g-lab">Points</p><p style="margin:0">A right answer is worth three points. There are two hints on every turn, and each hint you use costs one point, but a right answer is always worth at least one point.</p></div>

  });
  bindNames();
  $('#gStart').onclick = () => { audio(); if (prefs.sound) ambienceStart(); startGame(); };
}

/* ---------- a turn ---------- */
function teamStrip() {
  return `<div class="g-teams${gm.teams.length === 1 ? ' n1' : ''}" style="--n:${gm.teams.length}">${gm.teams.map((t, i) => `<div class="tcard${i === gm.turn % gm.teams.length && gm.screen === 'turn' ? ' now' : ''}" data-t="${i}">
    <p class="tn"><span>${esc(t.name)}</span><span class="tp">${t.pts} ${t.pts === 1 ? 'point' : 'points'}</span></p>
    <div class="track" aria-hidden="true">${[0, 1, 2, 3, 4].map(k => `<i class="${k < t.dist ? 'on' : ''}"></i>`).join('')}</div>
    <p class="tw">Their creature is ${WHERE[Math.min(t.dist, 4)]}.</p></div>`).join('')}</div>`;
}
function turnScreen() {
  const T = curTeam(), q = curQ(), cr = creature(q.c);
  gm.opts = buildOpts(q); gm.used = { flash: false, remove: false }; gm.phase = 'ready'; gm.answered = false;
  main.innerHTML = `<section class="screen on">
   <div class="g-head"><p class="pos">Creature ${gm.turn + 1} of ${gm.total}</p></div>
   ${teamStrip()}
   <div class="g-grid">
    <div><div class="g-stage d${Math.min(T.dist, 4)}" id="gStage"><div class="g-view"></div><div class="g-fig" id="gFig">${figure(cr.g, { label: Cap(cr.name) })}</div><div class="g-frame"></div><div class="g-sill"></div><div class="g-vig"></div></div>
     <p class="g-where" id="gWhere">Something is ${WHERE[Math.min(T.dist, 4)]}.</p></div>
    <div class="task g-task" id="gTask"></div>
   </div></section>`;
  heart(T.dist);
  readyPanel();
}
function readyPanel() {
  const T = curTeam();
  $('#gTask').innerHTML = `<p class="pos">${esc(T.name)}</p><h3>${gm.teams.length > 1 ? esc(T.name) + ', it is your turn.' : 'Watch the window.'}</h3>
   <p>When everyone in the team is looking at the screen, tap the button. The lightning will show you the creature for a few seconds. After that, you will choose the right description of one thing it was wearing.</p>
   <div class="btn-row"><button class="btn main" id="gFlash">Wait for the lightning</button></div>`;
  $('#gFlash').onclick = () => { $('#gTask').innerHTML = `<p class="pos">${esc(T.name)}</p><h3>Look carefully.</h3><p>The creature will only be there while the lightning lasts.</p>`; flash(() => questionPanel()); };
}
function flash(after) {
  const stg = $('#gStage'); if (!stg) return;
  stg.classList.remove('lit', 'strike', 'shown'); void stg.offsetWidth; stg.classList.add('strike');
  setTimeout(() => sfx('thunder'), 350);
  setTimeout(() => stg.classList.add('lit'), 110);
  setTimeout(() => stg.classList.remove('lit'), 1500);
  setTimeout(() => { stg.classList.add('lit'); }, 1650);
  setTimeout(() => { stg.classList.remove('lit', 'strike'); after && after(); }, 3300);
}
function questionPanel() {
  const T = curTeam(), q = curQ();
  gm.phase = 'question';
  $('#gTask').innerHTML = `<p class="pos">${esc(T.name)}</p><p class="prompt">${esc(q.q)}</p>
   ${gcfg.time ? `<div class="tbar" id="tbar"><i></i></div><div class="trow"><span id="tlab">Take your time.</span><button class="ghost-btn" id="tPause">Pause</button></div>` : ''}
   <div class="opts" id="gOpts">${gm.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span>${esc(o.t)}</button>`).join('')}</div>
   <div class="g-hints" id="gHints"><button class="btn" id="hFlash">Flash again (costs one point)</button><button class="btn" id="hRemove">Remove two descriptions (costs one point)</button></div>
   <div class="fb" id="gFb" role="status"></div><div class="btn-row"><button class="btn main" id="gNext" hidden></button></div>`;
  $('#gOpts').onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled || gm.answered) return; answer(+b.dataset.i); };
  $('#hFlash').onclick = () => {
    if (gm.used.flash || gm.answered) return; gm.used.flash = true; $('#hFlash').disabled = true; $('#hFlash').textContent = 'Flash again: used';
    holdTimer(true); sfx('hint'); flash(() => holdTimer(false));
  };
  $('#hRemove').onclick = () => {
    if (gm.used.remove || gm.answered) return; gm.used.remove = true; $('#hRemove').disabled = true; $('#hRemove').textContent = 'Remove two: used'; sfx('hint');
    const wrong = shuffle(gm.opts.map((o, i) => i).filter(i => !gm.opts[i].ok)).slice(0, 2);
    wrong.forEach(i => { const b = $(`#gOpts .opt[data-i="${i}"]`); b.disabled = true; b.classList.add('gone'); });
  };
  if (gcfg.time) startTimer(gcfg.time);
}

/* timer */
let tm = null;
function startTimer(sec) { stopTimer(); tm = { left: sec * 1000, total: sec * 1000, paused: false, last: performance.now(), lastSec: sec, id: setInterval(tickTimer, 200) }; $('#tPause').onclick = () => { pauseTimer(!tm.paused); }; }
function tickTimer() {
  if (!tm) return; const now = performance.now(); const dt = now - tm.last; tm.last = now;
  if (tm.paused || tm.hold) return;
  tm.left -= dt; const bar = $('#tbar'); if (!bar) { stopTimer(); return; }
  bar.querySelector('i').style.transform = `scaleX(${Math.max(0, tm.left / tm.total)})`;
  const s = Math.ceil(tm.left / 1000);
  if (s <= 10) { bar.classList.add('low'); $('#tlab').textContent = s > 0 ? `${s} ${s === 1 ? 'second' : 'seconds'} left` : 'Time is up'; if (s !== tm.lastSec && s > 0) sfx('tick'); }
  tm.lastSec = s;
  if (tm.left <= 0) { stopTimer(); answer(-1); }
}
function pauseTimer(on) {
  if (!tm) return; tm.paused = on;
  const b = $('#tPause'); if (b) b.textContent = tm.paused ? 'Carry on' : 'Pause';
  const l = $('#tlab'); if (l && tm.left > 10000) l.textContent = tm.paused ? 'The timer is paused.' : 'Take your time.';
}
function holdTimer(on) { if (tm) { tm.hold = on; tm.last = performance.now(); } }
function stopTimer() { if (tm) clearInterval(tm.id); tm = null; }

function answer(i) {
  if (gm.answered) return; gm.answered = true; stopTimer();
  const T = curTeam(), q = curQ(), cr = creature(q.c), right = gm.opts.find(o => o.ok);
  const o = i >= 0 ? gm.opts[i] : null, ok = !!(o && o.ok);
  const hintsUsed = (gm.used.flash ? 1 : 0) + (gm.used.remove ? 1 : 0); T.hints += hintsUsed;
  const opts = $('#gOpts'); opts.querySelectorAll('.opt').forEach(b => b.disabled = true);
  opts.querySelector(`.opt[data-i="${gm.opts.indexOf(right)}"]`).classList.add('ok');
  if (o && !ok) opts.querySelector(`.opt[data-i="${i}"]`).classList.add('no');
  $('#gHints').hidden = true;
  const trow = $('.trow'); if (trow) trow.hidden = true; const tb = $('#tbar'); if (tb) tb.hidden = true;
  $('#gStage').classList.add('shown');
  const fb = $('#gFb');
  gm.log.push({ qi: gm.queue[gm.turn], team: gm.turn % gm.teams.length, chose: o ? o.t : null, ok, right: right.t });
  let caught = false;
  if (ok) {
    const pts = Math.max(1, 3 - hintsUsed); T.pts += pts; T.right++; sfx('right');
    fb.className = 'fb ok show'; fb.innerHTML = `<strong>Correct.</strong> ${orderNote(q)} <span class="g-gain">+${pts} ${pts === 1 ? 'point' : 'points'}</span>`;
  } else {
    sfx('wrong'); T.dist++;
    caught = T.dist >= 5;
    fb.className = 'fb no show';
    fb.innerHTML = `<strong>${o ? 'Not this one.' : 'Time is up.'}</strong> ${o ? o.why + ' ' : ''}The right description is <i>${esc(right.t)}</i>.${caught ? '' : ` ${Cap(cr.name)} has come one step closer, and it is now ${WHERE[T.dist]}.`}`;
    setTimeout(() => approach(T.dist), 700);
  }
  updateStrip();
  const last = gm.turn >= gm.total - 1;
  const nb = $('#gNext');
  nb.textContent = last ? 'See who survived the night' : gm.teams.length > 1 ? `Next turn: ${gm.teams[(gm.turn + 1) % gm.teams.length].name}` : 'Next creature';
  nb.onclick = () => { if (last) { gm.screen = 'end'; render(); } else { gm.turn++; render(); } };
  if (caught) { nb.hidden = true; setTimeout(() => caughtScreen(T, cr, () => { nb.hidden = false; updateStrip(); approach(0); nb.focus(); }), 1500); }
  else { nb.hidden = false; }
}
function approach(d) {
  const stg = $('#gStage'); if (!stg) return;
  stg.classList.remove('d0', 'd1', 'd2', 'd3', 'd4'); stg.classList.add('d' + Math.min(d, 4), 'lurch');
  if (d > 0) sfx('step');
  $('#gWhere').textContent = d >= 5 ? 'It is here.' : `Something is ${WHERE[Math.min(d, 4)]}.`;
  heart(d);
}
function updateStrip() { const strip = main.querySelector('.g-teams'); if (strip) strip.outerHTML = teamStrip(); }

/* caught */
function bloodSVG() {
  const R = Math.random; let b = '';
  for (let k = 0; k < 3; k++) {
    const cx = 160 + R() * 680, cy = 120 + R() * 320, r = 46 + R() * 40;
    b += `<g class="spl" style="animation-delay:${(.38 + k * .14).toFixed(2)}s;transform-origin:${cx.toFixed(0)}px ${cy.toFixed(0)}px"><circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${r.toFixed(0)}"/>`;
    for (let i = 0; i < 16; i++) { const a = R() * Math.PI * 2, d = r * (1 + R() * 1.4), rr = 3 + R() * 13; b += `<circle cx="${(cx + Math.cos(a) * d).toFixed(0)}" cy="${(cy + Math.sin(a) * d).toFixed(0)}" r="${rr.toFixed(1)}"/>`; }
    for (let i = 0; i < 4; i++) { const x = cx - r * .6 + R() * r * 1.2, w = 6 + R() * 8; b += `<rect class="drip" style="animation-delay:${(.6 + R() * .6).toFixed(2)}s" x="${x.toFixed(0)}" y="${cy.toFixed(0)}" width="${w.toFixed(0)}" height="${(80 + R() * 200).toFixed(0)}" rx="${(w / 2).toFixed(0)}"/>`; }
    b += '</g>';
  }
  for (let i = 0; i < 16; i++) { const x = i * 64 + R() * 30, w = 10 + R() * 16; b += `<rect class="drip" style="animation-delay:${(.3 + R() * .5).toFixed(2)}s" x="${x.toFixed(0)}" y="-20" width="${w.toFixed(0)}" height="${(90 + R() * 300).toFixed(0)}" rx="${(w / 2).toFixed(0)}"/>`; }
  return `<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="bl" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9a0a18"/><stop offset="1" stop-color="#5a0008"/></linearGradient></defs><g fill="url(#bl)">${b}</g></svg>`;
}
function caughtScreen(T, cr, done) {
  stopHeart();
  const lost = Math.min(5, T.pts); T.pts -= lost; T.dist = 0; T.caughtBy.push(cr.name);
  const mild = gcfg.fright === 'mild';
  const ov = document.createElement('div');
  ov.className = 'caught' + (mild ? ' mild' : ''); ov.setAttribute('role', 'alertdialog'); ov.setAttribute('aria-labelledby', 'cTitle');
  ov.innerHTML = `<div class="c-face">${figure(cr.g, { label: Cap(cr.name) })}</div><div class="c-red"></div>${mild ? '' : `<div class="c-blood">${bloodSVG()}</div>`}
   <div class="c-text"><h2 id="cTitle">${esc(Cap(cr.name))} has got ${esc(T.name)}.</h2>
   <p>${lost === 0 ? esc(T.name) + ' had no points to lose this time.' : esc(T.name) + ' loses ' + (lost === 5 ? 'five points' : lost === 1 ? 'its last point' : 'its last ' + NUMW[lost] + ' points') + '.'} The creature goes back to the bottom of the garden, and the night carries on.</p>
   <div class="btn-row"><button class="btn main" id="cGo">Carry on</button></div></div>`;
  document.body.appendChild(ov); document.body.classList.add('jolt');
  sfx('sting');
  setTimeout(() => document.body.classList.remove('jolt'), 1200);
  const go = $('#cGo', ov); setTimeout(() => go.focus(), 1600);
  go.onclick = () => { ov.remove(); done(); };
}

/* ---------- end ---------- */
function endScreen() {
  stopHeart(); stopTimer();
  const seen = [...new Set(gm.log.map(l => QUESTIONS[l.qi].c))];
  const ranked = gm.teams.map((t, i) => Object.assign({ i }, t)).sort((a, b) => b.pts - a.pts);
  const top = ranked[0].pts, firsts = ranked.filter(t => t.pts === top);
  const place = t => 1 + ranked.filter(x => x.pts > t.pts).length;
  const ord = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
  const each = gm.total / gm.teams.length;
  let head;
  if (gm.teams.length === 1) head = `You survived the night with ${top} ${top === 1 ? 'point' : 'points'}.`;
  else if (firsts.length === 1) head = `${firsts[0].name} survived the night with the most points: ${top}.`;
  else head = `${firsts.map(t => t.name).join(' and ')} share first place with ${top} ${top === 1 ? 'point' : 'points'}.`;
  const caughtLine = t => t.caughtBy.length === 0 ? 'No creature got this team.' : `${t.caughtBy.length === 1 ? 'Caught once' : 'Caught ' + (t.caughtBy.length === 2 ? 'twice' : NUMW[t.caughtBy.length] + ' times')}, by ${listNames(t.caughtBy)}.`;
  main.innerHTML = `<section class="screen on"><div class="g-end" id="gEnd"><div class="sky"></div><div class="sky day"></div><div class="sun"></div>
   <div class="g-line" aria-hidden="true">${seen.map(id => `<div class="w">${figure(creature(id).g)}</div>`).join('')}</div>
   <p class="night-msg" aria-hidden="true">The night is nearly over.</p>
   <p class="pos late" style="color:#fff3dc">The end of the night</p>
   <h2 class="late">Dawn at Blackwood Manor</h2>
   <p class="lede late l2">The sun is coming up, and the creatures have gone back into the dark. ${esc(head)}</p>
   <div class="podium late l3">${ranked.map(t => `<div class="pcard${t.pts === top ? ' first' : ''}">${t.pts === top && gm.teams.length > 1 ? '<span class="rib">Survived the night</span>' : ''}
     <p class="pl">${ord(place(t))}</p><p class="pn">${esc(t.name)}</p><p class="pp">${t.pts} ${t.pts === 1 ? 'point' : 'points'}</p>
     <p>${t.right} of ${each} descriptions right.</p><p>${t.hints === 0 ? 'No hints used.' : t.hints === 1 ? 'One hint used.' : Cap(NUMW[t.hints] || String(t.hints)) + ' hints used.'}</p><p>${esc(caughtLine(t))}</p></div>`).join('')}</div>
   <div class="btn-row late l4"><button class="btn main" id="eReview">Review the descriptions</button><button class="btn" id="eAgain">Play again with the same teams</button><button class="btn" id="eSet">Change the settings</button></div>
   <div class="g-review" id="gReview" hidden></div>
  </div></section>`;
  const end = $('#gEnd');
  setTimeout(() => { end.classList.add('lit'); sfx('thunder'); }, 500);
  setTimeout(() => end.classList.remove('lit'), 1100);
  setTimeout(() => end.classList.add('lit'), 1300);
  setTimeout(() => end.classList.remove('lit'), 2300);
  setTimeout(() => { end.classList.add('dawn'); sfx('dawn'); }, 2900);
  $('#eAgain').onclick = () => startGame();
  $('#eSet').onclick = () => { gm = { screen: 'setup' }; render(); };
  let ri = 0;
  const rev = $('#gReview');
  function drawRev() {
    const l = gm.log[ri], q = QUESTIONS[l.qi], cr = creature(q.c), tn = gm.teams[l.team].name;
    rev.innerHTML = `<p class="pos">Description ${ri + 1} of ${gm.log.length}</p><div class="rv"><div class="rf">${figure(cr.g, { label: Cap(cr.name) })}</div><div>
      <p><b>${esc(q.q)}</b></p><p>The right description is <i>${esc(l.right)}</i>.</p>
      <p class="${l.ok ? 'ok' : 'no'}">${l.ok ? esc(tn) + ' chose the right description.' : l.chose ? esc(tn) + ' chose <i>' + esc(l.chose) + '</i>.' : esc(tn) + ' ran out of time.'}</p></div></div>
      <div class="btn-row">${ri > 0 ? '<button class="btn" id="rBack">Back</button>' : ''}${ri < gm.log.length - 1 ? '<button class="btn main" id="rFwd">Forward</button>' : ''}</div>`;
    if ($('#rBack')) $('#rBack').onclick = () => { ri--; drawRev(); };
    if ($('#rFwd')) $('#rFwd').onclick = () => { ri++; drawRev(); };
  }
  $('#eReview').onclick = () => { rev.hidden = false; $('#eReview').hidden = true; drawRev(); rev.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
}
function listNames(a) { const c = {}; a.forEach(n => c[n] = (c[n] || 0) + 1); const p = Object.keys(c); return p.length === 1 ? p[0] : p.slice(0, -1).join(', ') + ' and ' + p[p.length - 1]; }

/* keyboard: 1 to 4 choose a description */
document.addEventListener('keydown', e => {
  if (mode !== 'game' || !gm || gm.screen !== 'turn' || gm.phase !== 'question' || gm.answered || e.target.closest('input')) return;
  const k = +e.key; if (k >= 1 && k <= 4) { const b = $(`#gOpts .opt[data-i="${k - 1}"]`); if (b && !b.disabled) b.click(); }
});

syncPrefs();
render();
</script>
</body>
</html>
