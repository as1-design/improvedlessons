<script>
/* ================= CONTENT (edit here) ================= */
// Each question: q = question, opts = four options (a–d, in this order),
// a = index of the right option (0 = a, 1 = b, 2 = c, 3 = d),
// why = explanation shown after checking, at = where in the video the answer is.
const CONTENT = {
  title: '“War of the Worlds” at 80',
  level: 'B2.2 · Listening',
  videoEmbed: 'https://drive.google.com/file/d/1M3c2UGgda0CIc9yEfwaDtRvd0hjpZm7y/preview',
  videoOpen:  'https://drive.google.com/file/d/1M3c2UGgda0CIc9yEfwaDtRvd0hjpZm7y/view',
  stages: [
    { label: '1st listening',
      text: ['Read the questions first.', 'Then watch the whole video.', 'Choose one answer for each question.'] },
    { label: '2nd listening',
      text: ['Watch the video again.', 'Check your answers and change them if you need to.', 'When you finish, press “Check my answers”.'] }
  ],
  note: 'Some questions ask what newspapers said in 1938. Other questions ask what the video says about those newspaper stories.',
  questions: [
    { q: 'What is the main purpose of the video?',
      opts: ['To explain the origins of modern science-fiction radio',
             'To investigate whether the War of the Worlds broadcast truly caused mass panic',
             'To compare different versions of H. G. Wells’s novel',
             'To analyse Orson Welles’s career as a filmmaker'],
      a: 1, why: 'The video examines whether the broadcast really caused mass panic.', at: '0:22' },
    { q: 'What was the social context in the United States in 1938, according to the video?',
      opts: ['A time of economic depression and rising international tension',
             'A period of rapid economic growth and optimism',
             'A moment of political stability and low public anxiety',
             'A period dominated by the success of television'],
      a: 0, why: 'The US was experiencing economic depression and tension related to war in Europe.', at: '0:29' },
    { q: 'How was the radio programme structured?',
      opts: ['As a straightforward reading of the novel',
             'As a comedy show with occasional interviews',
             'As a fictional programme using simulated news bulletins and music',
             'As a live report from an actual scientific expedition'],
      a: 2, why: 'It used simulated news bulletins and music to create a realistic fake programme.', at: '0:37' },
    { q: 'According to early newspaper coverage, how did some listeners reportedly react?',
      opts: ['They began writing letters to the government requesting military action',
             'They switched off their radios immediately',
             'They protested outside radio stations',
             'They fled their homes and panicked, believing an invasion was real'],
      a: 3, why: 'Newspapers reported people fleeing their homes in panic.', at: '0:54' },
    { q: 'What does the video suggest about those newspaper stories?',
      opts: ['They were mostly untrue or exaggerated',
             'They were verified thoroughly by investigators',
             'They were created by Orson Welles as part of a publicity campaign',
             'They were published only in small, local papers'],
      a: 0, why: 'The stories were exaggerated or unverified.', at: '1:35' },
    { q: 'What explanation does the video give for why some listeners did believe the broadcast?',
      opts: ['They trusted radio more than newspapers',
             'People in the 1930s were more gullible than people are today',
             'The programme was broadcast during a power cut',
             'They were influenced by existing fears and beliefs'],
      a: 3, why: 'Some people believed it because the message aligned with their existing fears or beliefs.', at: '2:06' },
    { q: 'What is the main conclusion of the video regarding “mass hysteria”?',
      opts: ['It was widespread and affected the entire country',
             'It was a rare but unavoidable result of radio technology at the time',
             'It did not occur on the huge scale often claimed',
             'It only affected listeners in large cities'],
      a: 2, why: 'There was no mass hysteria on the large scale often claimed.', at: '3:20' }
  ],
  ui: { checked: 'Checked', answered: n => `${n} of ${CONTENT.questions.length} answered`,
        right: 'Right.', wrong: 'Not quite.', rightIs: 'The answer is', heard: 'You hear this at about',
        open: 'If the video does not play here, open it in Google Drive',
        score: (s, t) => `${s} / ${t}`, scoreText: 'Look at the explanations above. Watch the parts again where you made a mistake.' }
};
const LETTERS = ['a', 'b', 'c', 'd'];
const KEY = 'b22-war-of-the-worlds-listening.v2';

/* ================= state ================= */
let S = fresh();
function fresh(){ return { v: 1, stage: 0, answers: CONTENT.questions.map(() => null), checked: false }; }

/* ================= logic ================= */
function choose(qi, oi){ if (S.checked) return; S.answers[qi] = oi; save(); }
function setStage(i){ S.stage = i; save(); }
function check(){ if (S.checked) return; S.checked = true; save(); }
function reset(){ S = fresh(); save(); }
function answeredCount(){ return S.answers.filter(a => a !== null).length; }
function score(){ return S.answers.reduce((n, a, i) => n + (a === CONTENT.questions[i].a ? 1 : 0), 0); }

/* ================= display ================= */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderStatic(){
  document.title = CONTENT.title.replace(/[“”]/g, '"') + ' · ' + CONTENT.level;
  $('title').textContent = CONTENT.title;
  $('level').textContent = CONTENT.level;
  $('player').src = CONTENT.videoEmbed;
  const a = el('a', null, CONTENT.ui.open); a.href = CONTENT.videoOpen; a.target = '_blank'; a.rel = 'noopener';
  $('vlink').replaceChildren(a);
  $('note').textContent = CONTENT.note;
  $('instr').replaceChildren(...CONTENT.stages.map(s => { const d = el('div'); d.append(...s.text.map(t => el('p', null, t))); return d; }));
  $('stages').replaceChildren(...CONTENT.stages.map((s, i) => {
    const b = el('button', 'stage', s.label); b.dataset.act = 'stage'; b.dataset.i = i; return b; }));
  // build the questions once; render() only updates them
  $('qs').replaceChildren(...CONTENT.questions.map((q, qi) => {
    const box = el('article', 'q'); box.id = 'q' + qi;
    const h = el('h2'); h.append(el('span', 'num', String(qi + 1)), el('span', null, q.q)); box.append(h);
    const opts = el('div', 'opts'); opts.setAttribute('role', 'group'); opts.setAttribute('aria-label', 'Question ' + (qi + 1));
    q.opts.forEach((o, oi) => {
      const b = el('button', 'opt'); b.dataset.act = 'choose'; b.dataset.q = qi; b.dataset.o = oi;
      b.append(el('span', 'l', LETTERS[oi] + ')'), el('span', 't', o), el('span', 'm'));
      opts.append(b);
    });
    box.append(opts);
    const fb = el('div', 'fb'); fb.hidden = true; box.append(fb);
    return box;
  }));
}

function render(){
  document.querySelectorAll('.stage').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === S.stage)));
  // both texts sit in the same place, so the page never jumps when the stage changes
  $('instr').querySelectorAll(':scope > div').forEach((d, i) => d.setAttribute('aria-hidden', String(i !== S.stage)));

  CONTENT.questions.forEach((q, qi) => {
    const box = $('q' + qi);
    box.querySelectorAll('.opt').forEach(b => {
      const oi = +b.dataset.o, mine = S.answers[qi] === oi, good = oi === q.a;
      b.setAttribute('aria-pressed', String(mine));
      b.disabled = S.checked;
      b.classList.toggle('right', S.checked && good);
      b.classList.toggle('wrong', S.checked && mine && !good);
      b.querySelector('.m').textContent = S.checked ? (good ? '✓' : (mine ? '✗' : '')) : '';
    });
    const fb = box.querySelector('.fb');
    if (S.checked){
      const ok = S.answers[qi] === q.a;
      fb.className = 'fb ' + (ok ? 'ok' : 'no');
      const head = el('strong', null, ok ? CONTENT.ui.right : CONTENT.ui.wrong);
      const body = ok ? ' ' + q.why : ` ${CONTENT.ui.rightIs} ${LETTERS[q.a]}). ${q.why}`;
      fb.replaceChildren(head, document.createTextNode(body), el('span', 'when', `${CONTENT.ui.heard} ${q.at}.`));
      fb.hidden = false;
    } else { fb.hidden = true; fb.replaceChildren(); }
  });

  $('count').textContent = S.checked ? `${CONTENT.ui.checked}: ${CONTENT.ui.score(score(), CONTENT.questions.length)}` : CONTENT.ui.answered(answeredCount());
  $('checkBtn').disabled = S.checked || answeredCount() === 0;
  $('resetBtn').disabled = !S.checked && answeredCount() === 0;

  const r = $('result');
  if (S.checked){
    r.replaceChildren(el('div', 'score', CONTENT.ui.score(score(), CONTENT.questions.length)), el('p', null, CONTENT.ui.scoreText));
    r.classList.add('show');
  } else { r.classList.remove('show'); r.replaceChildren(); }
}

/* ================= saving ================= */
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.v === 1 && Array.isArray(d.answers) && d.answers.length === CONTENT.questions.length){
      S = { v: 1, stage: d.stage === 1 ? 1 : 0, checked: !!d.checked,
            answers: d.answers.map(a => (Number.isInteger(a) && a >= 0 && a < 4) ? a : null) };
    }
  } catch (e) {}
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'choose') choose(+b.dataset.q, +b.dataset.o);
  else if (act === 'stage') setStage(+b.dataset.i);
  else if (act === 'check') check();
  else if (act === 'reset') reset();
  render();
});

load(); renderStatic(); render();
</script>
