<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Stylist · Day one at the studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe3; --paper-2:#ebe3d2; --card:#fbf8f1;
  --ink:#241e2a; --ink-soft:#5a5160;
  --chalk:#b3242c; --chalk-deep:#8e1a22;
  --tape:#efc233; --tape-deep:#c99a12;
  --ok:#3e7650; --ok-bg:#dcebdd;
  --no-bg:#f1dcd8;
  --g-ink:#2a2230;
  --serif:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Instrument Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --ease:cubic-bezier(.25,.46,.45,.94); --spring:cubic-bezier(.34,1.56,.64,1);
  --tint-1:#e6efe0; --tint-2:#f6e2d9; --tint-3:#e3e8f2; --tint-4:#f5ecd0; --tint-5:#ece3ef;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  background-image:radial-gradient(circle, rgba(36,30,42,.13) 1px, transparent 1.2px);
  background-size:22px 22px;
  font-size:17px; line-height:1.55;
  display:flex; flex-direction:column; min-height:100%;
  padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:14px;padding:12px 20px 6px;max-width:1180px;margin:0 auto}
.brand h1{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink-soft);font-size:15px}
.tape{position:relative;background:var(--tape);border-top:1px solid var(--tape-deep);overflow-x:auto;scrollbar-width:none}
.tape::-webkit-scrollbar{display:none}
.tape-inner{display:flex;min-width:max-content;max-width:1180px;margin:0 auto;position:relative;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 50px);
  background-size:100% 6px,100% 12px;background-repeat:no-repeat;background-position:0 0,0 0}
.stop{border:0;background:transparent;padding:16px 16px 9px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:120px;position:relative;transition:transform .15s var(--ease)}
.stop:active{transform:scale(.96)}
.stop .n{font-family:var(--serif);font-weight:700;font-size:13px;line-height:1}
.stop .t{font-weight:600;font-size:14px;white-space:nowrap}
.stop .k{font-size:12px;color:#4a3b10}
.stop.act{background:rgba(255,255,255,.18)}
.stop.on{background:var(--ink);color:var(--tape)}
.stop.on .k{color:#e8d48c}
.stop.on::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:28px 20px 40px}
.screen{display:none}
.screen.on{display:block}
.screen.on > *{animation:rise .5s var(--ease) both}
.screen.on > *:nth-child(2){animation-delay:.08s}
.screen.on > *:nth-child(3){animation-delay:.16s}
.screen.on > *:nth-child(n+4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

h2{font-family:var(--serif);font-weight:700;font-size:clamp(30px,4.6vw,46px);line-height:1.08;margin:0 0 10px;letter-spacing:-.015em;max-width:22ch}
h3{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15;margin:34px 0 6px}
.lede{font-size:19px;max-width:62ch;margin:0 0 6px}
.prose{max-width:66ch}
.prose p{margin:0 0 12px}

/* welcome */
.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:start}
.badge{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);padding:22px;box-shadow:8px 8px 0 var(--chalk);transform:rotate(1.2deg);position:relative;margin-top:22px}
.badge .clip{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:62px;height:26px;border:3px solid var(--ink-soft);border-bottom:0;border-radius:14px 14px 0 0}
.badge .photo{width:86px;height:86px;border-radius:50%;background:var(--tint-4);border:2px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.badge .photo svg{width:76px}
.badge-row{display:flex;gap:16px;align-items:center}
.badge h4{font-family:var(--serif);font-size:24px;margin:0;line-height:1.1}
.badge .role{color:var(--chalk);font-weight:600}
.badge dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:18px 0 0;font-size:15px}
.badge dt{color:var(--ink-soft)}
.badge dd{margin:0;font-weight:600}
.contents{list-style:none;padding:0;margin:22px 0 0;border:2px solid var(--ink);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.contents li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--paper-2)}
.contents li:first-child{border-top:0}
.contents li.act{background:var(--tint-4)}
.contents .kind{font-size:13px;color:var(--ink-soft);margin-left:auto}
.contents button{border:0;background:none;padding:0;font-weight:600;text-align:left}
.contents button:hover{text-decoration:underline;text-decoration-color:var(--chalk);text-underline-offset:3px}

/* rails and hanging cards */
.group-intro{max-width:64ch;margin:0 0 4px;color:var(--ink-soft)}
.rail{position:relative;margin-top:30px;padding-top:18px}
.rail::before{content:"";position:absolute;left:-6px;right:-6px;top:0;height:9px;border-radius:9px;
  background:linear-gradient(#c9ced6,#7f8792 60%,#5b626c);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px 18px}
.card{position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:0 0 14px;
  box-shadow:0 6px 14px rgba(36,30,42,.1);transform-origin:50% -14px;margin-top:14px}
.card::before{content:"";position:absolute;top:-16px;left:50%;width:14px;height:16px;border:2.5px solid #6c727c;border-bottom:0;border-radius:10px 10px 0 0;transform:translateX(-50%)}
.card.sway{animation:sway 1.1s var(--ease)}
@keyframes sway{0%{transform:rotate(0)}25%{transform:rotate(2.4deg)}55%{transform:rotate(-1.6deg)}80%{transform:rotate(.6deg)}100%{transform:rotate(0)}}
.card .pic{border-radius:11px 11px 0 0;height:150px;display:grid;place-items:center;border-bottom:1.5px solid var(--ink)}
.card .pic svg{height:128px;width:auto;overflow:visible}
.card:nth-child(5n+1) .pic{background:var(--tint-1)}
.card:nth-child(5n+2) .pic{background:var(--tint-2)}
.card:nth-child(5n+3) .pic{background:var(--tint-3)}
.card:nth-child(5n+4) .pic{background:var(--tint-4)}
.card:nth-child(5n+5) .pic{background:var(--tint-5)}
.card .body{padding:12px 14px 0}
.word-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.word{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.1;margin:0}
.ipa{color:var(--ink-soft);font-size:15px;margin:2px 0 8px}
.listen{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;transition:transform .12s}
.listen:active{transform:scale(.92)}
.listen svg{width:18px;height:18px}
.tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px;margin:0 0 8px}
.tr dt{color:var(--ink-soft)}
.tr dd{margin:0;font-weight:600}
.ex{font-size:15px;margin:0 0 8px}
.feel{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;margin:0 0 8px}
.feel svg{width:30px;flex:none}
.note{font-size:14px;border-left:4px solid var(--chalk);padding:4px 0 4px 10px;margin:0}
.note b{color:var(--chalk-deep)}

/* panels */
.panel{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);padding:20px 22px;margin-top:28px;max-width:860px}
.panel h4{font-family:var(--serif);font-size:22px;margin:0 0 8px;line-height:1.2}
.panel.chalk{border-color:var(--chalk);box-shadow:6px 6px 0 var(--chalk)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
.q{border:1.5px solid var(--ink);border-radius:var(--r-md);padding:12px;background:var(--paper)}
.q .verb{font-family:var(--serif);font-weight:700;font-size:22px;display:block}
.q p{margin:4px 0 0;font-size:15px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.pair > div{background:var(--paper);border-radius:var(--r-md);padding:12px 14px}
.pair .lab{font-family:var(--serif);font-weight:700;font-size:20px;display:block;margin-bottom:4px}
.pair ul{margin:6px 0 0;padding-left:18px}
.pair li{margin:2px 0}
.mini-tr{font-size:14px;color:var(--ink-soft)}

/* word order */
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 6px;min-width:640px}
.slot-wrap{overflow-x:auto;padding-bottom:6px}
.slot{border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--card);padding:8px 6px;text-align:center;font-weight:700;font-size:14px}
.slot small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
.slot.noun{background:var(--ink);color:var(--paper)}
.slot.noun small{color:#d8d0c4}
.ex-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px;margin-top:6px}
.ex-row span{text-align:center;padding:7px 4px;border-radius:var(--r-sm);font-size:15px;font-weight:600}
.ex-row span.f{background:#fff;border:1.5px dashed var(--ink-soft)}
.ex-row span.e{color:transparent}
.ex-row span.nn{background:var(--paper-2)}
.mirror{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.mirror div{background:var(--paper);border-radius:var(--r-md);padding:10px 12px;font-size:15px}
.mirror b{display:block;font-size:13px;color:var(--ink-soft);font-weight:600}

/* builder & check */
.task{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);padding:22px;max-width:820px;margin-top:20px;position:relative}
.pos{font-size:14px;color:var(--ink-soft);font-weight:600;margin:0 0 6px}
.prompt{font-size:20px;margin:0 0 14px;max-width:56ch}
.task .pic{height:150px;display:grid;place-items:center;background:var(--tint-3);border-radius:var(--r-md);margin-bottom:14px;border:1.5px solid var(--ink)}
.task .pic svg{height:130px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{border:2px solid var(--ink);background:var(--paper);border-radius:var(--r-md);padding:13px 14px;font-weight:600;text-align:left;min-height:54px;position:relative;transition:transform .12s var(--ease),box-shadow .12s}
.opt::before{content:"";position:absolute;top:50%;left:-7px;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:var(--card);transform:translateY(-50%)}
.opt:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:#1f4a2c}
.opt.no{background:var(--no-bg);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.85}
.opt[disabled]{cursor:default}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.fb{margin:14px 0 0;padding:12px 14px;border-radius:var(--r-md);font-size:16px;display:none}
.fb.show{display:block;animation:rise .35s var(--ease)}
.fb.ok{background:var(--ok-bg)}
.fb.ok strong{color:var(--ok)}
.fb.no{background:var(--no-bg)}
.fb .trl{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
.line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;padding:10px;border:2px dashed var(--ink-soft);border-radius:var(--r-md);background:#fff;margin-bottom:12px}
.line .fixed{font-weight:700;padding:8px 4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.tiles:empty{display:none}
.tile{border:2px solid var(--ink);background:var(--tape);border-radius:999px;padding:9px 16px;font-weight:700;transition:transform .15s var(--spring)}
.tile:active{transform:scale(.94)}
.tile.placed{background:var(--card)}
.tile .cat{display:block;font-size:11px;font-weight:600;color:var(--ink-soft)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{border:2px solid var(--ink);border-radius:999px;padding:11px 22px;font-weight:700;background:var(--card);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--ink);color:var(--paper)}
.btn[hidden]{display:none}

/* stars */
.stars{display:flex;gap:6px;margin:10px 0}
.stars svg{width:38px;height:38px}
.stars .s{opacity:0;transform:scale(.4) rotate(-20deg);animation:pop .5s var(--spring) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.review{background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);padding:22px;max-width:640px;margin-top:20px;box-shadow:8px 8px 0 var(--tape)}
.review blockquote{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.35;margin:6px 0 10px}
.review cite{font-style:normal;color:var(--ink-soft);font-size:15px}
.rev-list{list-style:none;padding:0;margin:18px 0 0;max-width:640px}
.rev-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:12px 16px;margin-bottom:10px}
.rev-list .st{display:flex;gap:2px}
.rev-list .st svg{width:22px;height:22px}
.empty{color:var(--ink-soft);max-width:56ch}

footer.bar{border-top:2px solid var(--ink);background:var(--paper);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.credit{font-size:13px;color:var(--ink-soft);margin-right:auto}

@media (max-width:860px){
  .welcome{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr 1fr}
  .mirror{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
}
@media (max-width:520px){
  .credit{flex-basis:100%;font-size:12px}
  .bar-in{gap:8px}
  .bar-in .btn{flex:1;padding:10px 12px;font-size:15px}
  .bar-in .btn[hidden]{display:none}
  body{font-size:16px}
  main{padding:20px 14px 30px}
  .brand{padding:10px 14px 4px}
  .brand p{display:none}
  .stop{min-width:100px;padding:14px 12px 8px}
  .qgrid{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr;gap:18px 10px}
  .card .pic{height:112px}
  .card .pic svg{height:96px}
  .word{font-size:21px}
  .task{padding:16px}
}
@media (max-width:520px){ .tr{grid-template-columns:1fr} .tr dt{font-size:12px;margin-top:4px} }
@media (max-width:380px){ .cards{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>The Stylist</h1><p>Day one at the studio: clothes and fashion</p></div>
  <nav class="tape" aria-label="Sections"><div class="tape-inner" id="route"></div></nav>
</header>

<main id="main"></main>

<footer class="bar">
  <div class="bar-in">
    <span class="credit">Class of Coffee – with AI assistance</span>
    <button class="btn" id="prevBtn">Previous section</button>
    <button class="btn main" id="nextBtn">Next section</button>
  </div>
</footer>

<script>
/* ---------- Garment drawing library (shared by the Stylist set) ---------- */
const G = (() => {
  let n = 0;
  const id = p => p + '_' + (++n);
  const INK = 'var(--g-ink, #2a2230)';

  function shade(hex, amt) {
    const h = hex.replace('#', '');
    let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
    return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* Returns {defs, fill} for a colour + pattern/texture */
  function paint(color, pattern, ink2) {
    const c = color || '#999999';
    const k = ink2 || shade(c, -0.45);
    const pid = id('p');
    let d = '';
    switch (pattern) {
      case 'stripes':
        d = `<pattern id="${pid}" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${c}"/><rect width="9" height="3.6" fill="${k}"/></pattern>`; break;
      case 'checks':
        d = `<pattern id="${pid}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${c}"/><rect width="7" height="14" fill="${k}" opacity=".45"/><rect width="14" height="7" fill="${k}" opacity=".45"/><rect x="10" width="1.2" height="14" fill="${shade(c, .6)}" opacity=".8"/><rect y="10" width="14" height="1.2" fill="${shade(c, .6)}" opacity=".8"/></pattern>`; break;
      case 'spots':
        d = `<pattern id="${pid}" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${c}"/><circle cx="3" cy="3" r="2.1" fill="${k}"/><circle cx="9" cy="9" r="2.1" fill="${k}"/></pattern>`; break;
      case 'floral':
        d = `<pattern id="${pid}" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="${c}"/><g fill="${k}"><circle cx="5" cy="4" r="2"/><circle cx="8" cy="5.5" r="2"/><circle cx="5" cy="7.6" r="2"/><circle cx="2.2" cy="5.8" r="2"/></g><circle cx="5" cy="5.8" r="1.2" fill="#f2c94c"/><g fill="#3f7a4a"><ellipse cx="13" cy="13" rx="3" ry="1.4" transform="rotate(35 13 13)"/><ellipse cx="15" cy="16" rx="2.4" ry="1.1" transform="rotate(-25 15 16)"/></g></pattern>`; break;
      case 'lace':
        d = `<pattern id="${pid}" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${c}"/><circle cx="5" cy="5" r="2.6" fill="none" stroke="${shade(c, .55)}" stroke-width="1"/><circle cx="0" cy="0" r="1.3" fill="${shade(c, .55)}"/><circle cx="10" cy="10" r="1.3" fill="${shade(c, .55)}"/><circle cx="10" cy="0" r="1.3" fill="${shade(c, .55)}"/><circle cx="0" cy="10" r="1.3" fill="${shade(c, .55)}"/></pattern>`; break;
      case 'knit':
        d = `<pattern id="${pid}" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="${c}"/><path d="M0 1 L2 4 L4 1 M4 1 L6 4 L8 1 M0 5 L2 8 L4 5 M4 5 L6 8 L8 5" fill="none" stroke="${shade(c, -0.25)}" stroke-width="1"/></pattern>`; break;
      case 'denim':
        d = `<pattern id="${pid}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${c}"/><rect width="1.4" height="5" fill="${shade(c, .25)}" opacity=".7"/></pattern>`; break;
      case 'linen':
        d = `<pattern id="${pid}" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${c}"/><rect width="4" height=".7" fill="${shade(c, -0.12)}"/><rect width=".7" height="4" fill="${shade(c, -0.08)}"/></pattern>`; break;
      case 'suede':
        d = `<pattern id="${pid}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${c}"/><circle cx="1.5" cy="2" r=".6" fill="${shade(c, -0.2)}"/><circle cx="5" cy="1" r=".5" fill="${shade(c, .2)}"/><circle cx="4" cy="5" r=".6" fill="${shade(c, -0.2)}"/><circle cx="1" cy="6" r=".5" fill="${shade(c, .2)}"/></pattern>`; break;

function speak(text) {

    speechSynthesis.speak(u);
  } catch (e) {}
}

function go(i) {
  cur = Math.max(0, Math.min(SCREENS.length - 1, i));
  const s = SCREENS[cur];
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('on'));
  const el = $('#s-' + s.id);
  const first = !el.dataset.built;
  if (first || s.id === 'reviews') { el.innerHTML = s.html(); el.dataset.built = '1'; }
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  document.querySelectorAll('.stop').forEach((b, j) => { b.classList.toggle('on', j === cur); if (j === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  const on = route.querySelector('.stop.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  $('#prevBtn').hidden = cur === 0;
  $('#nextBtn').hidden = cur === SCREENS.length - 1;
  $('#nextBtn').textContent = cur === 0 ? 'Start with the rails' : 'Next section';
  window.scrollTo({ top: 0 });
  if (first && s.id === 'welcome') buildContents();
  if (first && s.id === 'order') buildOrderPractice();
  if (first && s.id === 'check') startCheck(false);
  if (s.id === 'reviews') buildReviews();
  prog.cur = cur; saveProg();
}
route.addEventListener('click', e => { const b = e.target.closest('.stop'); if (b) go(+b.dataset.i); });
$('#prevBtn').onclick = () => go(cur - 1);

});

function builder(host, item, onDone) {
  const placed = [];
  const pool = shuffle(item.words.map((w, i) => i));
  const art = /^[aeiou]/.test(item.words[0][0]) ? 'an' : 'a';
  let tries = 0, solved = false;
  host.innerHTML = `<div class="line" aria-label="Your label"></div><div class="tiles" aria-label="Words to use"></div><div class="fb" role="status"></div><div class="btn-row"><button class="btn main chk" hidden>Check the label</button></div>`;
  const line = $('.line', host), tiles = $('.tiles', host), fb = $('.fb', host), chk = $('.chk', host);
  function render() {
    const first = placed.length ? item.words[placed[0]][0] : item.words[0][0];
    const a = /^[aeiou]/.test(first) ? 'an' : 'a';
    line.innerHTML = `<span class="fixed">${item.plural ? '' : a}</span>` + placed.map(i => `<button class="tile placed" data-i="${i}" ${solved ? 'disabled' : ''}>${item.words[i][0]}</button>`).join('') + `<span class="fixed">${item.noun}</span>`;
    tiles.innerHTML = pool.filter(i => !placed.includes(i)).map(i => `<button class="tile" data-i="${i}">${item.words[i][0]}</button>`).join('');
    chk.hidden = solved || placed.length !== item.words.length;
  }
  host.onclick = e => {
    if (solved) return;
    const t = e.target.closest('.tile'); if (!t) return;
    const i = +t.dataset.i;
    if (t.classList.contains('placed')) placed.splice(placed.indexOf(i), 1); else placed.push(i);
    fb.className = 'fb'; render();
  };
  chk.onclick = () => {
    const cats = placed.map(i => item.words[i][1]);
    let bad = -1;
    for (let k = 0; k < cats.length - 1; k++) if (CATS.indexOf(cats[k]) > CATS.indexOf(cats[k + 1])) { bad = k; break; }
    if (bad < 0) {
      solved = true; render();
      const order = item.words.slice().sort((x, y) => CATS.indexOf(x[1]) - CATS.indexOf(y[1])).map(w => CAT_NAMES[w[1]]);
      fb.className = 'fb ok show';
      fb.innerHTML = `<strong>Correct.</strong> The order is ${order.slice(0, -1).join(', ')} and ${order[order.length - 1]}, and then the noun.`;
      onDone && onDone(tries);
    } else {
      tries++;
      const a = item.words[placed[bad]], b = item.words[placed[bad + 1]];
      fb.className = 'fb no show';
      fb.innerHTML = `<strong>Not correct yet.</strong> <i>${b[0]}</i> is ${CAT_WORD[b[1]]}, and <i>${a[0]}</i> is ${CAT_WORD[a[1]]}. ${CAT_PL[b[1]]} come before ${CAT_PL[a[1]].toLowerCase()}. Tap a word in the label to move it.`;
      line.classList.remove('shake'); void line.offsetWidth; line.classList.add('shake');
    }
  };
  render();
}

function solveNow(host, item) {
  const words = item.words.map((w, i) => i).sort((x, y) => CATS.indexOf(item.words[x][1]) - CATS.indexOf(item.words[y][1]));
  words.forEach(i => { const t = host.querySelector(`.tiles .tile[data-i="${i}"]`); t && t.click(); });
  const c = host.querySelector('.chk'); c && c.click();
}
const PRACTICE = [
 {words:[['spotted','pattern'],['red','colour'],['silk','material']], noun:'scarf'},
 {words:[['woollen','material'],['old-fashioned','opinion'],['checked','pattern']], noun:'jacket'},
 {words:[['suede','material'],['long','fit'],['brown','colour']], noun:'boots', plural:true},
];
function buildOrderPractice() {
  const host = $('#orderPractice');
  let i = Math.min(prog.pr || 0, PRACTICE.length - 1);
  function show() {
    host.innerHTML = `<div class="task"><p class="pos">Label ${i + 1} of ${PRACTICE.length}</p><div class="b"></div><div class="btn-row"><button class="btn main nx" hidden>Next label</button><button class="btn again" hidden>Start again</button></div></div>`;
    builder($('.b', host), PRACTICE[i], () => {
      prog.prDone = i; saveProg();
      const last = i === PRACTICE.length - 1;
      $('.nx', host).hidden = last; $('.again', host).hidden = !last;
      if (last) $('.again', host).classList.add('main');
    });
    $('.nx', host).onclick = () => { i++; prog.pr = i; saveProg(); show(); };
    $('.again', host).onclick = () => { i = 0; prog.pr = 0; prog.prDone = -1; saveProg(); show(); };
    if (prog.prDone === i) solveNow($('.b', host), PRACTICE[i]);
  }
  show();
}

/* ================= FIRST-DAY CHECK ================= */
let ck = null;
function startCheck(fresh) {
  if (fresh || !prog.ck) ck = { i: 0, wrong: 0, done: false, finished: false };
  else { ck = prog.ck; if (ck.done && !ck.finished) { ck.i++; ck.done = false; } }
  prog.ck = ck; saveProg();
  if (ck.finished) finishCheck(); else showCheck();
}
function showCheck() {
  const area = $('#checkArea');
  if (ck.i >= CHECK.length) return finishCheck();
  const it = CHECK[ck.i];
  const pic = it.pic ? `<div class="pic">${G.svg(it.pic[0], it.pic[1])}</div>` : '';
  area.innerHTML = `<div class="task"><p class="pos">Question ${ck.i + 1} of ${CHECK.length}</p>${pic}<p class="prompt">${esc(it.prompt)}</p><div class="ans"></div><div class="btn-row"><button class="btn main nx" hidden>${ck.i === CHECK.length - 1 ? 'See your review' : 'Next question'}</button></div></div>`;
  const ans = $('.ans', area), nx = $('.nx', area);
  nx.onclick = () => { ck.i++; ck.done = false; saveProg(); showCheck(); };
  if (it.kind === 'mc') {
    const order = shuffle(it.opts.map((o, i) => i));
    ans.innerHTML = `<div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${esc(it.opts[i])}</button>`).join('')}</div><div class="fb" role="status"></div>`;
    const fb = $('.fb', ans);
    ans.onclick = e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      if (+b.dataset.i === it.a) {
        b.classList.add('ok');
        ans.querySelectorAll('.opt').forEach(o => o.disabled = true);
        const k = it.tr || findWord(it.key);
        fb.className = 'fb ok show';
        fb.innerHTML = `<strong>Correct.</strong> ${esc(it.why)}${k ? `<span class="trl">Català: ${esc(k.ca)}. Español: ${esc(k.es)}.</span>` : ''}`;
        nx.hidden = false; ck.done = true; saveProg();
      } else {
        ck.wrong++; saveProg();
        b.classList.add('no'); b.disabled = true;
        b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        fb.className = 'fb no show';
        fb.innerHTML = `<strong>Not correct here.</strong> Read the question again and try another answer.`;
      }
    };
  } else {
    builder(ans, it, tries => { ck.wrong += tries; ck.done = true; saveProg(); nx.hidden = false; });
  }
}
function findWord(k) {
  const all = [...FIT, ...STYLE, ...PATTERN, ...MATERIALS, ...STYLEADJ, ...VERBS_ON, ...VERBS_LOOK];
  if (k === 'dress') return { ca: 'vestir(-se)', es: 'vestir(se)' };
  return all.find(w => plainWord(w.w) === k || w.w === k || plainWord(w.w).split(' ')[0] === k);
}
function starsFor(wrong) { return wrong <= 1 ? 5 : wrong <= 3 ? 4 : wrong <= 5 ? 3 : 2; }
const QUOTES = {
 5:'You know the stock perfectly. I would happily send you to any client in London.',
 4:'You know the stock well. Have another look at the cards you were unsure about, and you will be ready for clients.',
 3:'You have made a good start. Go back to the sections where you made mistakes before you meet your first client.',
 2:'There is still quite a lot to learn. Spend some more time on the rails and in the fabric drawer, and then try the check again.'
};
function finishCheck() {
  const stars = starsFor(ck.wrong);
  if (!ck.finished) { ck.finished = true; saveProg(); saveReview('studio', stars); }
  $('#checkArea').innerHTML = `<div class="review"><p class="pos">Your review from the studio manager</p>
   <div class="stars">${Array.from({ length: 5 }, (_, i) => `<span class="s" style="animation-delay:${i * 140}ms">${starSVG(i < stars)}</span>`).join('')}</div>
   <blockquote>${QUOTES[stars]}</blockquote><cite>Dee Okoro, manager, Hanger &amp; Thread</cite>
   <p style="margin:14px 0 0">You gave ${ck.wrong === 0 ? 'no wrong answers' : ck.wrong === 1 ? 'one wrong answer' : ck.wrong + ' wrong answers'}.</p>
   <div class="btn-row"><button class="btn main" id="ckAgain">Start again</button></div></div>`;
  $('#ckAgain').onclick = () => startCheck(true);
}

/* ================= REVIEWS ================= */
function buildReviews() {
  const r = loadReviews(), keys = Object.keys(r);
  const list = $('#revList');
  if (!keys.length) {
    list.outerHTML = `<p class="empty" id="revList">You have no reviews yet. Complete the first-day check, and your review will appear here.</p>`;
  } else {
    list.innerHTML = keys.map(k => `<li><span><b>${esc(TITLES[k] || k)}</b><br><span style="font-size:14px;color:var(--ink-soft)">Best review: ${r[k].best} out of 5</span></span><span class="st" aria-label="${r[k].stars} out of 5 stars">${Array.from({ length: 5 }, (_, i) => starSVG(i < r[k].stars)).join('')}</span></li>`).join('');
  }
  const cb = $('#clearRev'); let armed = false;
  cb.hidden = !keys.length;
  cb.onclick = () => {
    if (!armed) { armed = true; cb.textContent = 'Tap again to delete all your reviews'; return; }
    try { localStorage.removeItem(STORE); } catch (e) {} go(cur);
  };
}

if (canSpeak) speechSynthesis.getVoices();
go(prog.cur || 0);
</script>
