        <div class="steps3">
          <div><span class="n">1</span><p style="margin:6px 0 0"><b>Notice.</b> Look at some examples and work out the pattern yourself.</p></div>
          <div><span class="n">2</span><p style="margin:6px 0 0"><b>Check the rule.</b> Compare your idea with the rule, and tick the box when you have read it.</p></div>
          <div><span class="n">3</span><p style="margin:6px 0 0"><b>Practise.</b> The first questions check what you probably know; the questions marked <b>B2.2 step up</b> are new at this level.</p></div>
        </div>
        <p style="margin:16px 0 0">The timer and the progress bar at the top show how long you have been working and how much you have completed. Every question you answer correctly at the first attempt lights up your spectrum. All the rules are collected on the page <b>All the rules</b>. Your progress and your time are saved in this browser, so you can continue at home on the same device.</p>
      </div></details>
    </div>
  </section>`;
}
function bindIntro(){
  const svg = document.getElementById("tapPrism"); if(!svg) return;
  const split = () => {
    if(svg.classList.contains("split")){ svg.classList.remove("split"); void svg.getBoundingClientRect(); }
    svg.classList.add("split"); introSplit = true; svg.blur();
    burst(svg.querySelector(".prism-g"), "var(--gen)");
  };
  svg.addEventListener("click", split);
  svg.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); split(); } });
}

/* ---------- station page ---------- */
function stationHTML(s){
  return `<section class="screen">
    <div class="stagger"><div style="--i:0"><span class="part-letter" aria-hidden="true">${s.code}</span><p class="kicker">Part ${s.part} · Station ${s.code}</p><h2>${s.title}</h2></div>
    <p class="lead" style="--i:1; margin-top:12px">${s.sub}</p></div>
    <div style="clear:both"></div>
    <article class="card edge" id="notice"></article>
    <article class="card" id="rule"></article>
    <article class="card" id="practice"></article>
  </section>`;
}
function stepTag(n, label, state){ return `<div class="step-tag"><span class="num">${n}</span><span class="lab">${label}</span>${state?`<span class="state">${state}</span>`:""}</div>`; }

function renderNotice(s){
  const box = document.getElementById("notice"); const n = s.notice; const ns = noticeState(s);
  const doneChip = ns.done ? '<span class="chip" style="--c:var(--ok)"><i></i>Done</span>' : "";
  let body = "";
  if(n.type === "sort"){
    body = `<p class="ask" style="color:var(--ink); font-size:18px">${n.ask}</p>` + n.rows.map((r,i) => {
      const ok = ns.rows[i];
      return `<div class="sort-row ${ok?"done":""}" data-row="${i}"><div class="st">${md(r.t)}${r.l1?`<div class="l1s">${md(r.l1)}</div>`:""}</div>
        <div class="bins">${n.bins.map((b,k)=>`<button class="bin ${ok && k===r.bin ? "right":""}" data-bin="${k}" ${ok?"disabled":""}>${ok && k===r.bin ? "✓ ":""}${b}</button>`).join("")}</div>
        <div class="rv ${ok?"show":""}">${md(r.rv)}</div></div>`;
    }).join("");
  } else {
    const opts = shuffle(n.opts.map((o,k)=>Object.assign({k},o)));
    body = `<ul class="examples">${n.examples.map(e=>`<li>${e}</li>`).join("")}</ul>
      <p class="ask" style="color:var(--ink); font-size:18px">${n.ask}</p>
      <div class="opts">${opts.map((o,i)=>{ const done = ns.done && o.ok; return `<button class="opt ${done?"right":""}" data-k="${o.k}" ${ns.done?"disabled":""}><span class="mk">${done?"✓":"ABCD"[i]}</span><span>${md(o.t)}</span></button>`; }).join("")}</div>
      <div class="fb ${ns.done?"good show":""}" id="nfb">${ns.done?`<span class="lbl">Well noticed</span>${md(n.opts.find(o=>o.ok).fb)}`:""}</div>`;
  }
  box.innerHTML = stepTag(1, "Notice", doneChip) + body +
    `<div class="discover ${ns.done?"show":""}" id="disc"><span class="kicker" style="display:block; margin-bottom:4px">What did you notice?</span>${md(n.discover)}</div>`;
  if(n.type === "sort"){
    box.querySelectorAll(".sort-row").forEach(row => row.querySelectorAll(".bin").forEach(btn => btn.addEventListener("click", () => {
      const i = +row.dataset.row, r = n.rows[i], k = +btn.dataset.bin, rv = row.querySelector(".rv");
      if(k === r.bin){
        ns.rows[i] = true; row.classList.add("done"); btn.classList.add("right"); btn.textContent = "✓ " + n.bins[k];
        row.querySelectorAll(".bin").forEach(b => b.disabled = true);
        rv.className = "rv show"; rv.innerHTML = md(r.rv);
        if(n.rows.every((_,j) => ns.rows[j])) finishNotice(s);
        save(); renderChrome();
      } else {
        btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("wrong","shake");
        rv.className = "rv show bad"; rv.textContent = "Not this one. Think again and try the other option.";
      }
    })));
  } else if(!ns.done){
    box.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      const o = n.opts[+btn.dataset.k], fb = box.querySelector("#nfb");
      if(o.ok){
        btn.classList.add("right"); btn.querySelector(".mk").textContent = "✓";
        box.querySelectorAll(".opt").forEach(b => b.disabled = true);
        fb.className = "fb good show"; fb.innerHTML = `<span class="lbl">Well noticed</span>${md(o.fb)}`;
        finishNotice(s);
      } else {
        btn.classList.add("wrong","shake"); btn.disabled = true; btn.querySelector(".mk").textContent = "✕";
        fb.className = "fb bad show"; fb.innerHTML = `<span class="lbl">Not this one: try again</span>${md(o.fb)}`;
      }
    }));
  }
}
function finishNotice(s){
  const ns = noticeState(s); if(ns.done) return;
  ns.done = true; S.open[s.id] = true; save();
  const d = document.getElementById("disc"); if(d) d.classList.add("show");
  renderChrome(); renderRule(s, true); renderPractice(s);
  setTimeout(() => { const r = document.getElementById("rule"); if(r) r.scrollIntoView({behavior:"smooth", block:"start"}); }, 900);
}
function readBox(s){
  const on = !!S.read[s.id];
  return `<label class="readbox ${on?"on":""}" data-read="${s.id}"><input type="checkbox" ${on?"checked":""}><span class="bx"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>${on ? "I've read this rule." : "Tick this box when you have read the rule."}</span></label>`;
}
function renderRule(s, flash){
  const box = document.getElementById("rule");
  if(!S.open[s.id]){
    box.className = "card locked";
    box.innerHTML = stepTag(2, "Check the rule") + `<p style="color:var(--muted); margin-bottom:8px">The rule opens when you finish the Notice task. Try to work out the pattern yourself first, and then compare your idea with the rule.</p><button class="linkbtn" id="peek">Open the rule anyway</button>`;
    box.querySelector("#peek").addEventListener("click", () => { S.open[s.id] = true; save(); renderRule(s, true); renderPractice(s); });
    return;
  }
  box.className = "card edge" + (flash ? " lit" : ""); box.style.setProperty("--c", "var(--accent)");
  box.innerHTML = stepTag(2, "Check the rule", S.read[s.id] ? '<span class="chip" style="--c:var(--ok)"><i></i>Read</span>' : "") + `<div class="rule-body">${s.rule}</div>` + readBox(s);
  bindRead(box);
}
function bindRead(scope){
  scope.querySelectorAll(".readbox").forEach(lb => {
    const inp = lb.querySelector("input");
    inp.addEventListener("change", () => {
      const id = lb.dataset.read; S.read[id] = inp.checked; save();
      lb.classList.toggle("on", inp.checked);
      lb.lastElementChild.textContent = inp.checked ? "I've read this rule." : "Tick this box when you have read the rule.";
      if(inp.checked) burst(lb.querySelector(".bx"), "var(--ok)");
      renderChrome();
      if(st(current) && current === id){ const tag = document.querySelector("#rule .step-tag .state");
        const head = document.querySelector("#rule .step-tag"); if(head){ const old = head.querySelector(".state"); if(old) old.remove(); if(inp.checked) head.insertAdjacentHTML("beforeend",'<span class="state"><span class="chip" style="--c:var(--ok)"><i></i>Read</span></span>'); } }
    });
  });
}

/* ---------- practice ---------- */
function renderPractice(s){
  const box = document.getElementById("practice");
  if(!S.open[s.id]){
    box.className = "card locked";
    box.innerHTML = stepTag(3, "Practise") + `<p style="color:var(--muted); margin:0">The questions open after the rule.</p>`;
    return;
  }
  const order = orderFor(s);
  const nextId = order.find(id => !S.ans[id]);
  const idxCur = nextId ? order.indexOf(nextId) : -1;
  const dots = `<div class="dots" aria-hidden="true">${order.map((id,i) => { const r = S.ans[id]; const cls = r ? (r.first?"hit":"miss") : (i===idxCur?"cur":""); return `<span class="${cls}" style="--c:${CATS[BYID[id].cat].c}"></span>`; }).join("")}</div>`;
  if(!nextId){ box.className = "card edge"; box.style.removeProperty("--c"); box.innerHTML = stepTag(3, "Practise", '<span class="chip" style="--c:var(--ok)"><i></i>Done</span>') + dots + summaryHTML(s); bindSummary(s); return; }
  const it = BYID[nextId], c = CATS[it.cat].c;
  const opts = shuffle(it.opts.map((o,k)=>Object.assign({k},o)));
  const l1 = it.l1 ? `<div class="l1">${it.l1.map(p=>`<span class="pair"><span class="lang">${p[0]}</span>${p[1]}</span>`).join("")}</div>` : "";
  box.className = "card"; box.style.setProperty("--c", c); box.style.borderTop = `6px solid ${c}`;
  box.innerHTML = `<div class="sweep" id="sweep"></div>` + stepTag(3, "Practise") + dots + `
    <div class="q-meta"><span class="lvl ${it.lvl==="new"?"new":""}">${it.lvl==="new"?"B2.2 step up":"You probably know this"}</span><span class="chip" style="--c:${c}"><i></i>${idxCur+1} / ${order.length}</span></div>
    ${l1}<div class="prompt">${md(it.prompt)}</div>${it.ask?`<p class="ask">${md(it.ask)}</p>`:`<div style="height:8px"></div>`}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-k="${o.k}"><span class="mk" aria-hidden="true">${"ABCD"[i]}</span><span>${md(o.t)}</span></button>`).join("")}</div>
    <div class="fb" id="fb" role="status"></div>
    <div class="why" id="why"><span class="lbl">Why</span>${md(it.why)}${it.uk?`<div class="uk" style="margin-bottom:0"><span class="tag">UK / US</span>${md(it.uk)}</div>`:""}</div>
    <div class="next-row" id="nextrow"><button class="btn" id="nextbtn">${idxCur+1 < order.length ? "Next question →" : "See how I did →"}</button></div>`;
  box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(s, it, b, box)));
  box.querySelector("#nextbtn").addEventListener("click", () => { renderPractice(s); box.scrollIntoView({behavior:"smooth", block:"start"}); });
}
function answer(s, it, btn, card){
  const o = it.opts[+btn.dataset.k], fb = card.querySelector("#fb");
  if(o.ok){
    const first = !S.miss[it.id];
    S.ans[it.id] = {first}; save();
    btn.classList.add("right"); btn.querySelector(".mk").textContent = "✓";
    card.querySelectorAll(".opt").forEach(b => b.disabled = true);
    fb.className = "fb good show"; fb.innerHTML = `<span class="lbl">${first?"Correct, first attempt":"Correct"}</span>${md(o.fb)}`;
    card.querySelector("#why").classList.add("show"); card.querySelector("#nextrow").classList.add("show");
    const sw = card.querySelector("#sweep"); sw.classList.remove("go"); void sw.offsetWidth; sw.classList.add("go");
    card.classList.remove("lit"); void card.offsetWidth; card.classList.add("lit");
    if(first) burst(btn, CATS[it.cat].c);
    renderChrome();
    document.getElementById("live").textContent = "Correct. " + o.fb.replace(/\*/g,"");
  } else {
    S.miss[it.id] = true; save();
    btn.classList.add("wrong","shake"); btn.disabled = true; btn.querySelector(".mk").textContent = "✕";
    fb.className = "fb bad show"; fb.innerHTML = `<span class="lbl">Not this one: try again</span>${md(o.fb)}`;
    document.getElementById("live").textContent = "Not this one. " + o.fb.replace(/\*/g,"");
  }
}
function burst(el, color){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect();
  const cols = [color, "var(--self)", "var(--gen)", "var(--it)", "var(--there)", "var(--other)", "var(--pass)"];
  for(let i=0;i<18;i++){
    const sp = document.createElement("span"); sp.className = "shard";
    const ang = Math.random()*Math.PI*2, dist = 50 + Math.random()*110;
    sp.style.left = (r.left + r.width*.15 + Math.random()*r.width*.7) + "px"; sp.style.top = (r.top + r.height/2) + "px";
    sp.style.background = cols[i % cols.length];
    sp.style.setProperty("--dx", Math.cos(ang)*dist + "px"); sp.style.setProperty("--dy", (Math.sin(ang)*dist - 40) + "px"); sp.style.setProperty("--r", (Math.random()*540-270) + "deg");
    document.body.appendChild(sp); setTimeout(()=>sp.remove(), 1100);
  }
}
function summaryHTML(s){
  const sc = stScore(s), n = s.items.length;
  const i = STATIONS.indexOf(s), nxt = STATIONS[i+1];
  const msg = sc===n ? "You answered every question correctly at the first attempt."
    : sc >= n-1 ? "Well done. Read the explanations for any question you missed, and try the questions again if you like."
    : "Read the rule again, and then try the questions again: they will appear in a different order.";
  const left = [];
  if(!noticeState(s).done) left.push("the Notice task");
  if(!S.read[s.id]) left.push("ticking the rule as read");
  return `<div class="score-big">${sc}<small> / ${n} first time</small></div>
    <p style="margin-top:16px">${msg}</p>
    ${left.length ? `<p style="color:var(--muted)">To complete this station, you still need to finish ${left.join(" and ")}.</p>` : ""}
    <div class="row" style="margin-top:16px"><button class="btn ghost small" id="redo">Try these questions again</button>
    ${nxt ? `<button class="btn" data-go="${nxt.id}">Next: ${nxt.code} ${nxt.title} →</button>` : `<button class="btn" data-go="spectrum">See my spectrum →</button>`}</div>`;
}
function bindSummary(s){
  const b = document.getElementById("redo");
  if(b) b.addEventListener("click", () => { s.items.forEach(i => { delete S.ans[i]; delete S.miss[i]; }); delete S.order[s.id]; save(); renderChrome(); renderPractice(s); });
}

/* ---------- all the rules ---------- */
function notesHTML(){
  const und = STATIONS.filter(s => !S.open[s.id]).length;
  return `<section class="screen stagger">
    <p class="kicker" style="--i:0">Reference</p>
    <h2 style="--i:1">All the <span class="grad">rules</span></h2>
    <p class="lead" style="--i:2; margin-top:12px">This page collects the rules from all seven stations. ${und ? `Rules that you have not discovered yet are shown in a lighter colour. You can read them here, but you will remember them better if you discover them in their station first.` : `You have discovered every rule.`}</p>
    ${STATIONS.map((s,i) => {
      const open = !!S.open[s.id];
      const state = S.read[s.id] ? '<span class="chip" style="--c:var(--ok)"><i></i>Read</span>' : open ? '<span class="chip"><i style="--c:var(--gen)"></i>Discovered</span>' : '<span class="chip">Not discovered yet</span>';
      return `<article class="card edge" style="--i:${3+i}; ${s.part==="A"?"--accent:var(--self)":"--accent:var(--it)"}">
        <div class="row" style="justify-content:space-between; margin-bottom:12px"><span class="kicker">Part ${s.part} · ${s.code}</span>${state}</div>
        <h3 class="${open?"":"undisc"}">${s.title}</h3>
        ${open ? "" : `<div class="undisc-msg"><span>You have not discovered this rule yet.</span><button class="btn small ghost" data-go="${s.id}">Discover it in ${s.code} →</button></div>`}
        <div class="rule-body ${open?"":"undisc"}">${s.rule}</div>
        ${open ? readBox(s) : ""}
      </article>`; }).join("")}
  </section>`;
}

/* ---------- spectrum ---------- */
function spectrumHTML(){
  const ids = allItems(), total = ids.length, hit = ids.filter(i=>S.ans[i]&&S.ans[i].first).length, p = progress();
  return `<section class="screen stagger">
    <p class="kicker" style="--i:0">Your results</p>
    <h2 style="--i:1">My <span class="grad">spectrum</span></h2>
    <p class="lead" style="--i:2; margin-top:12px">Each beam shows how many questions of that type you answered correctly at the first attempt. The brighter and thicker the beam, the better.</p>
    <div style="--i:3">${prismSVG("spectrum")}</div>
    <div class="card edge" style="--i:4">
      <div class="score-big">${hit}<small> / ${total} first time</small></div>
      <p style="color:var(--muted); margin-top:8px">You have completed ${p.pct}% of the lesson, and you have been working for ${fmt(S.time)}.</p>
      <div class="bands">${CAT_ORDER.map(c=>{const x=catStats(c); return `<div class="band" style="--c:${CATS[c].c}"><span>${CATS[c].name}</span><span class="bar"><i data-w="${x.hit/x.total*100}%"></i></span><span class="n">${x.hit}/${x.total}</span></div>`;}).join("")}</div>
    </div>
    <div class="card" style="--i:5">
      <h3>Stations</h3>
      <ul class="todo">${STATIONS.map(s=>{ const ns=noticeState(s); const parts=[ns.done?"Notice ✓":"Notice", S.read[s.id]?"Rule ✓":"Rule", `${s.items.filter(i=>S.ans[i]).length}/${s.items.length} questions`].join(" · ");
        return `<li><span><b>${s.code}</b> · ${s.title}<br><span style="font-family:var(--mono); font-size:12px; color:var(--muted)">${parts}</span></span>${stationDone(s)?`<span class="chip">${stScore(s)} / ${s.items.length} first time</span>`:`<button class="btn small" data-go="${s.id}">Go there</button>`}</li>`; }).join("")}</ul>
    </div>
    <div class="row" style="--i:6; margin-top:24px">
      <button class="btn" id="copy">Copy my results</button>
      <button class="btn ghost" id="fresh">Start fresh</button>
    </div>
  </section>`;
}
function resultsText(){
  const lines = ["The Prism: pronouns, it and there — my results", `Time: ${fmt(S.time)} · Completed: ${progress().pct}%`, ""];
  STATIONS.forEach(s => lines.push(`${s.code} ${s.plain}: ${s.items.filter(i=>S.ans[i]).length === s.items.length ? stScore(s)+" / "+s.items.length+" first time" : "not finished"}${S.read[s.id]?"":" (rule not ticked)"}`));
  lines.push("");
  CAT_ORDER.forEach(c => { const x = catStats(c); lines.push(`${CATS[c].name} (${CATS[c].words}): ${x.hit} / ${x.total}`); });
  return lines.join("\n");
}
function bindPage(){
  if(current === "notes") bindRead(document.getElementById("app"));
  const copy = document.getElementById("copy");
  if(copy) copy.addEventListener("click", async () => {
    const t = resultsText(); let ok = false;
    try{ await navigator.clipboard.writeText(t); ok = true; }catch(e){
      try{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); ok=document.execCommand("copy"); ta.remove(); }catch(e2){}
    }
    copy.textContent = ok ? "Copied" : "Copying is not available here";
    setTimeout(()=>{ copy.textContent = "Copy my results"; }, 2000);
  });
  const fr = document.getElementById("fresh");
  if(fr) fr.addEventListener("click", () => {
    if(!freshArm){ freshArm = true; fr.textContent = "Tap again to delete everything, including the time"; setTimeout(()=>{ freshArm=false; const f=document.getElementById("fresh"); if(f) f.textContent="Start fresh"; }, 4000); return; }
    freshArm = false; S = {ans:{}, miss:{}, order:{}, notice:{}, open:{}, read:{}, time:0, cheers:[]}; save(); paintTimer(); go("intro");
  });
}

paintThemeBtn(); paintTimer(); render();
</script>
